<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>地球坐标测试</title>
<style>body{margin:0;overflow:hidden;background:#000;font-family:Microsoft YaHei,sans-serif}
#info{position:absolute;top:10px;left:10px;color:#fff;font-size:14px;background:rgba(0,0,0,0.6);padding:10px;border-radius:6px;z-index:10}
#info span{display:inline-block;margin:2px 8px}

/* 图例 */
#legend{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;background:rgba(0,0,0,0.7);padding:8px 16px;border-radius:20px;z-index:10}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 4px 0 12px;vertical-align:middle}
.dot.green{background:#22c55e}
.dot.red{background:#ef4444}
</style></head>
<body>
<div id="info">
  🔴 <span id="coord-beijing">北京(39.9,116.4)</span>
  🟢 <span id="coord-guinea">几内亚湾(0,0)</span>
  🟢 <span id="coord-london">伦敦(51.5,-0.1)</span>
</div>
<div id="legend">
  <span class="dot green"></span>=测试地标
  <span class="dot red" style="background:#ef4444"></span>=北京(期望在亚洲东北部)
  <span> 拖动旋转 | 滚轮缩放</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
function latLngToPosition(lat, lng, radius) {
    // ===== 当前代码使用的公式 =====
    const phi = ((90 - lat) / 180) * Math.PI;
    const theta = ((lng + 180) / 360) * 2 * Math.PI;
    return new THREE.Vector3(
        -radius * Math.cos(theta) * Math.sin(phi),
         radius * Math.cos(phi),
         radius * Math.sin(theta) * Math.sin(phi)
    );
}

// 测试几个城市
const testCities = [
    { name: '几内亚湾', lat: 0, lng: 0, color: 0x22c55e },
    { name: '北京',     lat: 39.9, lng: 116.4, color: 0xef4444 },
    { name: '伦敦',     lat: 51.5, lng: -0.1, color: 0x22c55e },
    { name: '上海',     lat: 31.2, lng: 121.5, color: 0xf59e0b },
    { name: '东京',     lat: 35.7, lng: 139.7, color: 0x22c55e },
    { name: '纽约',     lat: 40.7, lng: -74.0, color: 0x22c55e },
    { name: '悉尼',     lat: -33.9, lng: 151.2, color: 0x22c55e },
    { name: '开普敦',   lat: -33.9, lng: 18.4, color: 0x22c55e },
    { name: '赤道0°',   lat: 0, lng: 30, color: 0x3b82f6 },
    { name: '赤道90°E', lat: 0, lng: 90, color: 0x3b82f6 },
];

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 4);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.minDistance = 2;
controls.maxDistance = 10;

// 地球贴图
const textureLoader = new THREE.TextureLoader();
const earth = new THREE.Mesh(
    new THREE.SphereGeometry(1.3, 64, 64),
    new THREE.MeshPhongMaterial({
        map: textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
        specular: new THREE.Color(0x333333),
        shininess: 5,
    })
);
scene.add(earth);

// 大气层
const glow = new THREE.Mesh(
    new THREE.SphereGeometry(1.35, 48, 48),
    new THREE.MeshPhongMaterial({ color: 0x4488ff, transparent: true, opacity: 0.08, side: THREE.BackSide })
);
scene.add(glow);

// 网格线（辅助）
const gridMat = new THREE.LineBasicMaterial({ color: 0x2d5a8a, transparent: true, opacity: 0.2 });
for (let lat = -80; lat <= 80; lat += 20) {
    const pts = [];
    for (let lon = 0; lon <= 360; lon += 5) {
        const p = latLngToPosition(lat, lon, 1.32);
        pts.push(p);
    }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), gridMat));
}

// 画标记点
testCities.forEach(city => {
    const pos = latLngToPosition(city.lat, city.lng, 1.36);
    
    // 大球（更明显）
    const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(0.05, 8, 8),
        new THREE.MeshBasicMaterial({ color: city.color })
    );
    sphere.position.copy(pos);
    earth.add(sphere);
    
    // 光晕
    const glow2 = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 8, 8),
        new THREE.MeshBasicMaterial({ color: city.color, transparent: true, opacity: 0.3 })
    );
    glow2.position.copy(pos);
    earth.add(glow2);

    // Sprite 标签
    const canvas = document.createElement('canvas');
    canvas.width = 256;
    canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.roundRect ? ctx.roundRect(4, 4, 248, 56, 8) : ctx.fillRect(4, 4, 248, 56);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(`${city.name}(${city.lat},${city.lng})`, 128, 32);
    
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
        map: new THREE.CanvasTexture(canvas),
        transparent: true,
        depthTest: false
    }));
    sprite.position.set(pos.x * 1.1, pos.y * 1.1 + 0.12, pos.z * 1.1);
    sprite.scale.set(0.5, 0.12, 1);
    earth.add(sprite);
});

// 灯光
scene.add(new THREE.AmbientLight(0x404060));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(5, 5, 5);
scene.add(dl);
const bl = new THREE.DirectionalLight(0x4488ff, 0.3);
bl.position.set(-5, -5, -5);
scene.add(bl);

// 星星
const stars = new THREE.Points(
    new THREE.BufferGeometry().setFromPoints(
        Array.from({length:2000}, () => new THREE.Vector3(
            (Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200
        ))
    ),
    new THREE.PointsMaterial({ color: 0xffffff, size: 0.15 })
);
scene.add(stars);

function animate() {
    requestAnimationFrame(animate);
    earth.rotation.y += 0.002;
    controls.update();
    renderer.render(scene, camera);
}
animate();

// resize
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body></html>
