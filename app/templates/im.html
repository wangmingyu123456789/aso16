<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:#131b2e;color:#e8e8e8;height:100vh;overflow:hidden}
        .app{display:flex;height:100vh}

        /* === 左侧面板 === */
        .sidebar{width:280px;background:#182032;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.08);flex-shrink:0}
        .sidebar-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06)}
        .sidebar-header .logo-row{display:flex;align-items:center;margin-bottom:12px}
        .sidebar-header .logo{font-size:18px;font-weight:700;color:#fff}

        /* 搜索框 */
        .search-box{position:relative}
        .search-box input{width:100%;padding:8px 12px 8px 32px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);border-radius:8px;color:#e0e0e0;font-size:13px;outline:none;transition:border-color .2s}
        .search-box input:focus{border-color:rgba(123,47,247,0.5)}
        .search-box input::placeholder{color:rgba(255,255,255,0.25)}
        .search-box .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,0.25);font-size:14px}

        /* 标签页切换 */
        .tab-bar{display:flex;border-bottom:1px solid rgba(255,255,255,0.06)}
        .tab-item{flex:1;padding:12px;text-align:center;font-size:13px;color:rgba(255,255,255,0.4);cursor:pointer;transition:all .2s;border-bottom:2px solid transparent}
        .tab-item:hover{color:rgba(255,255,255,0.7)}
        .tab-item.active{color:#a78bfa;border-bottom-color:#7b2ff7}

        /* 列表区域 */
        .list-area{flex:1;overflow-y:auto;padding:8px}

        .sidebar-bottom{padding:10px 12px;border-top:1px solid rgba(255,255,255,0.06)}
        .sidebar-file-btn{width:100%;padding:8px 12px;border-radius:8px;border:none;background:rgba(123,47,247,0.12);color:#a78bfa;font-size:13px;cursor:pointer;transition:all .2s;text-align:center}
        .sidebar-file-btn:hover{background:rgba(123,47,247,0.22)}

        /* 文件列表 */
        .file-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:all .2s}
        .file-item:hover{background:rgba(255,255,255,0.04)}
        .file-item .file-icon{font-size:22px;width:36px;text-align:center}
        .file-item .file-info{flex:1;min-width:0}
        .file-item .file-name{font-size:13px;color:#e0e0e0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .file-item .file-meta{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px}
        .file-item .file-download{padding:4px 10px;border-radius:6px;border:none;background:rgba(123,47,247,0.12);color:#a78bfa;font-size:11px;cursor:pointer;transition:all .2s;flex-shrink:0}
        .file-item .file-download:hover{background:rgba(123,47,247,0.25)}
        .file-empty{padding:40px 20px;text-align:center;color:rgba(255,255,255,0.25);font-size:13px}
        .file-loading{padding:40px 20px;text-align:center;color:rgba(255,255,255,0.25);font-size:13px}

        /* 会话列表项 */
        .conv-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:all .2s}
        .conv-item:hover{background:rgba(255,255,255,0.04)}
        .conv-item.active{background:rgba(123,47,247,0.1)}
        .conv-item .avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;flex-shrink:0;position:relative}
        .conv-item .avatar .online-dot{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#22c55e;border:2px solid #0d1321}
        .conv-item .info{flex:1;min-width:0}
        .conv-item .info .name{font-size:14px;color:#fff;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .conv-item .info .last-msg{font-size:12px;color:rgba(255,255,255,0.35);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
        .conv-item .meta{text-align:right;flex-shrink:0}
        .conv-item .meta .time{font-size:11px;color:rgba(255,255,255,0.25)}
        .conv-item .meta .unread{margin-top:4px;min-width:18px;height:18px;border-radius:9px;background:#ff4d4f;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;padding:0 5px}
        .conv-delete-btn{width:22px;height:22px;border-radius:50%;border:none;background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.2);cursor:pointer;font-size:12px;flex-shrink:0;transition:all .2s;display:none;align-items:center;justify-content:center;padding:0;line-height:1}
        .conv-item:hover .conv-delete-btn{display:flex}
        .conv-delete-btn:hover{background:rgba(255,77,79,0.25);color:#ff4d4f}

        /* 通讯录 */
        .contact-group{margin-bottom:8px}
        .contact-group .group-title{padding:8px 12px;font-size:12px;color:rgba(255,255,255,0.3);cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
        .contact-group .group-title:hover{color:rgba(255,255,255,0.5)}
        .contact-group .group-title .arrow{width:12px;height:12px;transition:transform .3s ease;display:inline-block;position:relative}
        .contact-group .group-title .arrow::after{content:'';position:absolute;top:3px;left:1px;width:8px;height:8px;border-right:1.5px solid rgba(255,255,255,0.3);border-bottom:1.5px solid rgba(255,255,255,0.3);transform:rotate(45deg)}
        .contact-group .group-title .arrow.collapsed{transform:rotate(-90deg)}
        .contact-group .group-list{padding:0 4px;overflow:hidden;transition:max-height .35s ease,padding .35s ease,opacity .25s ease;max-height:1000px;opacity:1}
        .contact-group .group-list.collapsed{max-height:0!important;padding-top:0!important;padding-bottom:0!important;opacity:0;pointer-events:none}
        .contact-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:all .2s}
        .contact-item:hover{background:rgba(255,255,255,0.04)}
        .contact-item .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0;position:relative}
        .contact-item .avatar .online-dot{position:absolute;bottom:0;right:0;width:8px;height:8px;border-radius:50%;background:#22c55e;border:2px solid #0d1321}
        .contact-item .name{font-size:13px;color:rgba(255,255,255,0.7)}

        /* 空状态 */
        .empty-state{text-align:center;padding:40px 20px;color:rgba(255,255,255,0.15);animation:fadeInUp .5s ease}
        .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:0.35}
        .empty-state p{font-size:13px;line-height:1.6;color:rgba(255,255,255,0.2)}

        /* === 右侧聊天窗口 === */
        .main{flex:1;display:flex;flex-direction:column;min-width:0}

        /* 聊天头部 */
        .chat-header{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;min-height:57px}
        .chat-header .chat-title{font-size:15px;color:#fff;font-weight:500}
        .chat-header .chat-members{font-size:12px;color:rgba(255,255,255,0.3)}

        .back-home-btn{display:none;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer;text-decoration:none;transition:all .2s;margin-left:10px}
        .back-home-btn:hover{background:rgba(123,47,247,0.1);border-color:rgba(123,47,247,0.3);color:#a78bfa}

        /* === 右上角用户区 === */
        .user-bar{display:flex;align-items:center;gap:12px}
        .user-avatar-sm{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0}
        .user-name-sm{font-size:13px;color:rgba(255,255,255,0.7);font-weight:500}
        .user-divider-sm{width:1px;height:16px;background:rgba(255,255,255,0.1)}
        .btn-logout-sm{padding:6px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
        .btn-logout-sm:hover{background:rgba(255,77,79,0.1);border-color:rgba(255,77,79,0.3);color:#ff4d4f}

        /* 消息区域 */
        .chat-messages{flex:1;overflow-y:auto;padding:24px;padding-bottom:12px;display:flex;flex-direction:column;gap:16px}

        /* 消息气泡 */
        .msg-row{display:flex;align-items:flex-start;gap:10px;max-width:70%;margin-bottom:4px}
        .msg-row.self{align-self:flex-end;flex-direction:row-reverse}
        .msg-row .msg-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
        .msg-row .msg-bubble{padding:10px 14px;border-radius:12px;font-size:14px;line-height:1.6;word-break:break-word}
        .msg-row:not(.self) .msg-bubble{background:rgba(255,255,255,0.06);color:#e0e0e0;border-top-left-radius:4px}
        .msg-row.self .msg-bubble{background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(123,47,247,0.2));color:#fff;border-top-right-radius:4px}
        .msg-row .msg-sender{font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:4px;display:flex;align-items:center;gap:6px}
        .msg-time{font-size:10px;color:rgba(255,255,255,0.2);padding:2px 0}
        .msg-time-left{text-align:left}
        .msg-time-right{text-align:right}

        /* 角色标识 */
        .role-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:500;line-height:1.4}
        .role-owner{background:rgba(250,173,20,0.15);color:#fbbf24;border:1px solid rgba(250,173,20,0.3)}
        .role-admin{background:rgba(16,185,129,0.15);color:#34d399;border:1px solid rgba(16,185,129,0.3)}

        /* 时间分割线 */
        .msg-divider{width:100%;text-align:center;padding:16px 0}
        .msg-divider span{background:rgba(255,255,255,0.06);padding:4px 16px;border-radius:10px;font-size:11px;color:rgba(255,255,255,0.25)}

        /* 输入区域 */
        .chat-input{border-top:1px solid rgba(255,255,255,0.08);padding:12px 48px 16px;position:relative}
        .input-wrapper{display:flex;gap:12px;align-items:flex-start;max-width:900px;margin:0 auto}
        .input-wrapper textarea{flex:1;padding:12px 18px;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.1);border-radius:12px;color:#e8e8e8;font-size:14px;font-family:inherit;resize:none;outline:none;min-height:44px;max-height:220px;line-height:1.5;overflow-y:hidden;transition:border-color .2s,box-shadow .2s}
        .input-wrapper textarea:focus{border-color:rgba(123,47,247,0.6);box-shadow:0 0 16px rgba(123,47,247,0.1)}
        .input-wrapper textarea::placeholder{color:rgba(255,255,255,0.3)}
        .btn-send{padding:12px 32px;background:linear-gradient(135deg,#7b2ff7,#00d4ff);border:none;border-radius:12px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
        .btn-send:hover{opacity:0.9;transform:translateY(-1px);box-shadow:0 4px 16px rgba(123,47,247,0.4)}
        .btn-send:disabled{opacity:0.4;cursor:not-allowed;transform:none}

        /* 空聊天占位 */
        .chat-empty{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-top:calc(35vh - 70px)}
        .chat-empty .placeholder{text-align:center;color:rgba(255,255,255,0.15);animation:fadeInUp .6s ease}
        .chat-empty .placeholder .icon{font-size:72px;margin-bottom:20px;opacity:0.35;animation:float 3s ease-in-out infinite}
        .chat-empty .placeholder h3{font-size:20px;color:rgba(255,255,255,0.25);margin-bottom:10px;font-weight:500}
        .chat-empty .placeholder p{font-size:13px;color:rgba(255,255,255,0.15);max-width:280px;margin:0 auto;line-height:1.6}
        @keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

        /* 连接状态 */
        .ws-status{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:11px;white-space:nowrap}
        .ws-status .dot{width:7px;height:7px;border-radius:50%}
        .ws-status.online{background:rgba(34,197,94,0.15);color:#22c55e}
        .ws-status.online .dot{background:#22c55e}
        .ws-status.offline{background:rgba(255,77,79,0.15);color:#ff4d4f}
        .ws-status.offline .dot{background:#ff4d4f}
        .ws-status.reconnecting{background:rgba(255,193,7,0.15);color:#ffc107}
        .ws-status.reconnecting .dot{background:#ffc107;animation:pulse 1s infinite}

        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}

        /* 搜索结果 */
        .search-results{position:absolute;top:100%;left:0;right:0;background:#1d2440;border:1px solid rgba(255,255,255,0.1);border-radius:8px;margin-top:4px;max-height:200px;overflow-y:auto;z-index:50;display:none}
        .search-results.show{display:block}
        .search-result-item{padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;color:rgba(255,255,255,0.6);transition:background .2s}
        .search-result-item:hover{background:rgba(255,255,255,0.04);color:#fff}
        .search-result-item .sr-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;flex-shrink:0}

        /* 模态框 */
        .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:200}
        .modal-overlay.show{display:flex}
        .modal{background:#343d58;border:1px solid rgba(255,255,255,0.16);border-radius:16px;padding:28px;min-width:360px;max-width:480px;box-shadow:0 16px 48px rgba(0,0,0,0.35)}
        .modal h3{font-size:17px;color:#f4f4f4;margin-bottom:18px}
        .modal .form-group{margin-bottom:12px}
        .modal .form-group label{display:block;font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:4px}
        .modal .form-group input,.modal .form-group textarea,.modal .form-group select{width:100%;padding:10px 14px;background:rgba(255,255,255,0.08);border:1.5px solid rgba(255,255,255,0.1);border-radius:10px;color:#f0f0f0;font-size:14px;outline:none;transition:border-color .2s}
        .modal .form-group input:focus,.modal .form-group textarea:focus{border-color:rgba(123,47,247,0.5)}
        .modal .form-group textarea{resize:vertical;min-height:60px}
        .modal .form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
        .modal .btn{padding:10px 20px;border-radius:10px;border:none;cursor:pointer;font-size:14px;transition:all .2s}
        .modal .btn-primary{background:linear-gradient(135deg,#7b2ff7,#00d4ff);color:#fff}
        .modal .btn-primary:hover{opacity:0.9;transform:translateY(-1px)}
        .modal .btn-secondary{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.1)}
        .modal .btn-secondary:hover{background:rgba(255,255,255,0.12)}

        /* 公告确认弹窗 */
        .announce-confirm-box{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.2)}
        .announce-confirm-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 0;background:#fff}
        .announce-confirm-header h3{margin:0;color:#1a1a2e;font-size:18px}
        .announce-confirm-body{padding:16px 24px 20px;background:#fff;color:#333;font-size:15px;line-height:1.7;min-height:80px;white-space:pre-wrap;word-break:break-word}
        .announce-confirm-footer{padding:0 24px 20px;background:#fff}
        .announce-confirm-footer .gm-btn{background:linear-gradient(135deg,#7b2ff7,#00d4ff);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;transition:opacity .2s}
        .announce-confirm-footer .gm-btn:hover{opacity:0.9}

        /* 创建群聊 */
        .create-group-container{width:100%}
        .cg-header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
        .cg-title-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,rgba(123,47,247,0.25),rgba(0,212,255,0.15));display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
        .cg-body{max-height:280px;overflow-y:auto;margin-bottom:12px}
        .cg-member-grid{display:flex;flex-direction:column;gap:6px}
        .cg-member-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,0.03);border:1.5px solid transparent;cursor:pointer;transition:all .2s}
        .cg-member-card:hover{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.08)}
        .cg-member-card:has(input:checked){background:rgba(123,47,247,0.1);border-color:rgba(123,47,247,0.4)}
        .cg-member-check{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.2);flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent}
        .cg-member-card:has(input:checked) .cg-member-check{background:linear-gradient(135deg,#7b2ff7,#00d4ff);border-color:transparent;color:#fff}
        .cg-member-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0}
        .cg-member-name{flex:1;font-size:13px;color:rgba(255,255,255,0.7);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .cg-member-type{font-size:10px;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:6px;flex-shrink:0}
        .cg-footer{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)}

        /* 好友申请通知 */
        .friend-req-badge{position:relative}
        .friend-req-badge .badge-dot{position:absolute;top:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:#ff4d4f}

        /* 好友申请列表项 */
        .friend-req-item{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid rgba(255,255,255,0.04)}
        .friend-req-item:last-child{border-bottom:none}
        .friend-req-item .fr-avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;flex-shrink:0}
        .friend-req-item .fr-info{flex:1}
        .friend-req-item .fr-info .fr-name{font-size:13px;color:#fff}
        .friend-req-item .fr-info .fr-msg{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px}
        .friend-req-item .fr-actions{display:flex;gap:6px}
        .friend-req-item .fr-actions button{padding:4px 10px;border-radius:6px;border:none;cursor:pointer;font-size:11px}
        .fr-btn-accept{background:rgba(34,197,94,0.2);color:#22c55e}
        .fr-btn-reject{background:rgba(255,77,79,0.2);color:#ff4d4f}

        /* 群成员列表 */
        .member-list{max-height:200px;overflow-y:auto}
        .member-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
        .member-item:last-child{border-bottom:none}
        .member-item .m-avatar{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,0.5)}
        .member-item .m-name{flex:1;font-size:12px;color:rgba(255,255,255,0.6)}
        .member-item .m-role{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(123,47,247,0.2);color:#a78bfa}
        .member-item .m-remove{background:none;border:none;color:#ff4d4f;cursor:pointer;font-size:11px;opacity:0.6}
        .member-item .m-remove:hover{opacity:1}

        /* @提及面板 */

<script>
// ==================== 全局状态 ====================
var currentConvId = 0;
var currentConvType = '';
var _pendingAnnounceConfirm = null; // 待确认的公告 {id, content}
var ws = null;
var wsReconnectTimer = null;
var wsReconnectDelay = 1000;
var MAX_RECONNECT_DELAY = 30000;
var heartbeatTimer = null;

function getCsrfToken() {
    var m = document.cookie.match(/_xsrf=([^;]+)/);
    if (m) return m[1];
    var appRoot = document.getElementById('appRoot');
    if (appRoot && appRoot.dataset.xsrf) return appRoot.dataset.xsrf;
    return '';
}

// ==================== WebSocket 管理 ====================
function connectWebSocket() {
    if (ws && (ws.readyState === WebSocket.CONNECTING || ws.readyState === WebSocket.OPEN)) return;

    var protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(protocol + '//' + location.host + '/im/ws');

    ws.onopen = function() {
        setWsStatus('online', '已连接');
        wsReconnectDelay = 1000;
        startHeartbeat();
    };

    ws.onmessage = function(e) {
        var data = JSON.parse(e.data);
        if (data.type === 'pong') return;
        if (data.type === 'connected') return;
        if (data.type === 'message') {
            onReceiveMessage(data);
        }
        if (data.type === 'ack') {
            // 消息 ack 确认
            handleMsgAck(data);
        }
        if (data.type === 'friend_request') {
            // 收到新的好友申请
            onNewFriendRequest(data);
        }
        if (data.type === 'friend_request_accepted') {
            // 好友申请被同意
            onFriendRequestAccepted(data);
        }
        if (data.type === 'friend_request_rejected') {
            // 好友申请被拒绝
            onFriendRequestRejected(data);
        }
        if (data.type === 'friend_added') {
            // 新好友已添加（自己同意别人的申请后刷新）
            loadContacts();
            loadFriendRequestBadge();
        }
        if (data.type === 'group_invite') {
            // 收到新的群邀请
            onNewGroupInvite(data);
        }
        if (data.type === 'group_invite_accepted') {
            // 群邀请被同意
            onGroupInviteAccepted(data);
        }
        if (data.type === 'group_invite_rejected') {
            // 群邀请被拒绝
            onGroupInviteRejected(data);
        }
        if (data.type === 'group_joined') {
            // 加入群聊（邀请被同意后）
            onGroupJoined(data);
        }
        if (data.type === 'group_info_changed') {
            onGroupInfoChanged(data);
        }
        if (data.type === 'member_removed') {
            onMemberRemoved(data);
        }
        if (data.type === 'member_added') {
            onMemberAdded(data);
        }
        if (data.type === 'member_role_changed') {
            onMemberRoleChanged(data);
        }
        if (data.type === 'member_muted') {
            onMemberMuted(data);
        }
        if (data.type === 'group_mute_all') {
            onGroupMuteAll(data);
        }
        if (data.type === 'group_dismissed') {
            onGroupDismissed(data);
        }
        if (data.type === 'new_announcement') {
            onNewAnnouncement(data);
        }
        if (data.type === 'announcement_deleted') {
            onAnnouncementDeleted(data);
        }
        if (data.type === 'announcement_confirmed') {
            onAnnouncementConfirmed(data);
        }
        if (data.type === 'you_removed') {
            onYouRemoved(data);
        }
        if (data.type === 'group_transferred') {
            onGroupTransferred(data);
        }
    };

    ws.onclose = function() {
        setWsStatus('offline', '已断开');
        stopHeartbeat();
        scheduleReconnect();
    };

    ws.onerror = function() {
        setWsStatus('offline', '连接错误');
    };
}

// ==================== Toast & Confirm 提示 ====================
var toastContainer = null;
function ensureToastContainer() {
    if (!toastContainer || !document.body.contains(toastContainer)) {
        toastContainer = document.createElement('div');
        toastContainer.className = 'my-toast-container';
        document.body.appendChild(toastContainer);
    }
    return toastContainer;
}
function showToast(msg, type) {
    type = type || 'info';
    ensureToastContainer();
    var el = document.createElement('div');
    el.className = 'my-toast ' + type;
    el.textContent = msg;
    el.addEventListener('animationend', function(e) {
        if (e.animationName === 'toastOut') { el.remove(); }
    });
    toastContainer.appendChild(el);
}
function showConfirm(msg, okClass, icon) {
    return new Promise(function(resolve) {
        icon = icon || '⚠️';
        okClass = okClass || '';
        var overlay = document.createElement('div');
        overlay.className = 'my-confirm-overlay';
        overlay.innerHTML =
            '<div class="my-confirm-box">' +
            '<div class="cf-icon">' + icon + '</div>' +
            '<div class="cf-msg">' + msg + '</div>' +
            '<div class="cf-btns">' +
            '<button class="cf-btn cf-cancel">取消</button>' +
            '<button class="cf-btn cf-ok' + (okClass ? ' ' + okClass : '') + '">确定</button>' +
            '</div></div>';
        overlay.querySelector('.cf-cancel').onclick = function() { overlay.remove(); resolve(false); };
        overlay.querySelector('.cf-ok').onclick = function() { overlay.remove(); resolve(true); };
        overlay.addEventListener('click', function(e) { if(e.target === overlay){overlay.remove();resolve(false);} });
        document.body.appendChild(overlay);
    });
}

function scheduleReconnect() {
    if (wsReconnectTimer) return;
    setWsStatus('reconnecting', '重连中...');
    wsReconnectTimer = setTimeout(function() {
        wsReconnectTimer = null;
        connectWebSocket();
        wsReconnectDelay = Math.min(wsReconnectDelay * 2, MAX_RECONNECT_DELAY);
    }, wsReconnectDelay);
}

function startHeartbeat() {
    stopHeartbeat();
    heartbeatTimer = setInterval(function() {
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({type: 'ping'}));
        }
    }, 15000);
}

function stopHeartbeat() {
    if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
    }
}

function setWsStatus(status, text) {
    var el = document.getElementById('wsStatus');
    el.className = 'ws-status ' + status;
    document.getElementById('wsStatusText').textContent = text;
}

// ==================== 输入框自动扩展 ====================
function autoResizeTextarea(el) {
    el.style.height = 'auto';
    var newH = Math.min(el.scrollHeight, 220);
    el.style.height = newH + 'px';
    el.style.overflowY = el.scrollHeight > 220 ? 'auto' : 'hidden';
}

// ==================== 消息收发 ====================
function sendMessage() {
    var input = document.getElementById('msgInput');
    var content = input.value.trim();
    if (!content || !currentConvId) return;

    input.value = '';
    input.style.height = 'auto';
    input.style.overflowY = 'hidden';
    document.getElementById('btnSend').disabled = true;

    // 生成客户端消息ID（用于幂等和ack匹配）
    var clientMsgId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

    // 先显示在界面上（发送中状态）
    var selfName = getCurrentUserName();
    var selfRole = (currentConvType === 'group') ? getCurrentUserRole() : '';
    var tempEl = appendMessage('self', content, selfName, true, '', 'text', selfRole);
    if (tempEl) {
        tempEl.setAttribute('data-pending-conv', currentConvId);
        tempEl.classList.add('msg-sending');
    }
    _pendingMessages[currentConvId] = clientMsgId;

    // 5秒超时未收到ack则标记失败
    setTimeout(function() {
        if (_pendingMessages[currentConvId] === clientMsgId) {
            var el = document.querySelector('.msg-row[data-pending-conv="' + currentConvId + '"]');
            if (el) {
                el.classList.remove('msg-sending');
                el.classList.add('msg-failed');
            }
            delete _pendingMessages[currentConvId];
        }
    }, 5000);

    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
            type: 'message',
            conversation_id: currentConvId,
            msg_type: 'text',
            content: content,
            client_msg_id: clientMsgId
        }));
    } else {
        // WebSocket 未连接，使用 HTTP 发送
        fetch('/im/api/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json', 'X-XSRFToken': getCsrfToken()},
            body: JSON.stringify({conversation_id: currentConvId, msg_type: 'text', content: content})
        }).then(function(r){return r.json()}).then(function(res){
            if(res.code === 0){
                var el = document.querySelector('.msg-row[data-pending-conv="' + currentConvId + '"]');
                if (el) {
                    el.removeAttribute('data-pending-conv');
                    el.classList.remove('msg-sending');
                }
                delete _pendingMessages[currentConvId];
            }
        });
    }

    document.getElementById('btnSend').disabled = false;
    loadConversations();
}

function onReceiveMessage(data) {
    if (data.conversation_id === currentConvId && data.sender_id !== getCurrentUserId()) {
        appendMessage('other', data.content, data.sender_name, false, data.create_at, data.msg_type, data.sender_role);
        // 标记已读
        if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({type: 'read', conversation_id: currentConvId}));
        }
    }
    // 如果是毒鸡汤助手发送的消息，使用语音播报
    if (data.sender_name && data.sender_name.indexOf('毒鸡汤') !== -1 && data.content) {
        if (window.SpeechManager) {
            window.SpeechManager.speak(data.content);
        }
    }
    loadConversations();
}

// ==================== 消息展示 ====================
function appendMessage(direction, content, sender, isTemp, time, msgType, senderRole) {
    var container = document.getElementById('chatMessages');
    // 移除空状态
    var empty = container.querySelector('.chat-empty');
    if (empty) empty.remove();

    var div = document.createElement('div');
    div.className = 'msg-row ' + (direction === 'self' ? 'self' : '');
    if (isTemp) div.setAttribute('data-temp-id', '1');

    var avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = (sender || '?')[0];

    var bubble = document.createElement('div');

    // 群聊中显示发送人名称和角色标识
    if (currentConvType === 'group') {
        var senderEl = document.createElement('div');
        senderEl.className = 'msg-sender';
        var roleBadge = '';
        var role = senderRole || '';
        if (role === 'owner') {
            roleBadge = '<span class="role-badge role-owner">群主</span>';
        } else if (role === 'admin') {
            roleBadge = '<span class="role-badge role-admin">管理员</span>';
        }
        senderEl.innerHTML = sender + roleBadge;
        bubble.appendChild(senderEl);
    }

    // 根据消息类型渲染
    var type = msgType || 'text';
    if (type === 'image') {
        var fileInfo = {};
        try { fileInfo = JSON.parse(content || '{}'); } catch(e) {}
        var img = document.createElement('img');
        img.className = 'msg-image';
        img.src = fileInfo.url || content;
        img.loading = 'lazy';
        img.onclick = function() { previewImage(fileInfo.url || content); };
        bubble.appendChild(img);
    } else if (type === 'file') {
        var fileInfo = {};
        try { fileInfo = JSON.parse(content || '{}'); } catch(e) {}
        var fileDiv = document.createElement('div');
        fileDiv.className = 'msg-file';
        fileDiv.onclick = function() { var u = this.getAttribute('data-download-url'); if (u) window.open(u); };
        fileDiv.innerHTML = '<div class="file-icon">📄</div><div class="file-info"><div class="file-name">' +
            escapeHtml(fileInfo.filename || '未知文件') + '</div><div class="file-size">' +
            formatFileSize(fileInfo.size || 0) + '</div></div>';
        if (fileInfo.url) {
            fileDiv.setAttribute('data-download-url', fileInfo.url);
        }
        bubble.appendChild(fileDiv);
    } else {
        var textEl = document.createElement('div');
        textEl.textContent = content;
        bubble.appendChild(textEl);
    }

    var timeEl = document.createElement('div');
    timeEl.className = 'msg-time ' + (direction === 'self' ? 'msg-time-right' : 'msg-time-left');
    timeEl.textContent = time || formatTime(new Date());

    div.appendChild(avatar);
    div.appendChild(bubble);
    container.appendChild(div);
    container.appendChild(timeEl);
    container.scrollTop = container.scrollHeight;
    return div;
}

function formatTime(date) {
    var h = date.getHours().toString().padStart(2, '0');
    var m = date.getMinutes().toString().padStart(2, '0');
    return h + ':' + m;
}

function formatMsgTime(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr.replace(' ', 'T'));
    var now = new Date();
    var diff = now - d;
    if (diff < 86400000 && d.getDate() === now.getDate()) {
        return formatTime(d);
    }
    if (diff < 172800000) return '昨天';
    return (d.getMonth()+1) + '/' + d.getDate();
}

function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function renderConversations(list) {
    var area = document.getElementById('listArea');
    if (!list || list.length === 0) {
        area.innerHTML = '<div class="empty-state"><div class="icon">💬</div><p>暂无会话，去添加好友开始聊天</p></div>';
        return;
    }
    var html = '';
    list.forEach(function(c){
        var active = c.id === currentConvId ? ' active' : '';
        var unread = c.unread_count > 0 ? '<div class="unread">' + (c.unread_count > 99 ? '99+' : c.unread_count) + '</div>' : '';
        // 安全解析 JSON 格式的 last_message，只显示文件名
        var lastMsg = c.last_message || '';
        if (lastMsg && lastMsg.charAt(0) === '{') {
            // 从 JSON 中提取 filename 字段（兼容被截断的 JSON）
            var match = lastMsg.match(/"filename"\s*:\s*"([^"]+)"/);
            lastMsg = match ? match[1] : '[文件]';
        }
        html += '<div class="conv-item' + active + '" onclick="openConversation(' + c.id + ',\'' + c.type + '\',\'' + (c.name||'').replace(/'/g,"\\'") + '\')">';
        html += '<div class="avatar">' + (c.avatar || '#') + '</div>';
        html += '<div class="info"><div class="name">' + (c.name || '未知') + '</div>';
        html += '<div class="last-msg">' + escapeHtml(lastMsg) + '</div></div>';
        html += '<div class="meta"><div class="time">' + formatMsgTime(c.last_message_at) + '</div>' + unread + '</div>';
        html += '<button class="conv-delete-btn" onclick="event.stopPropagation();deleteConversation(' + c.id + ',\'' + (c.name||'').replace(/'/g,"\\'") + '\')" title="删除会话">×</button>';
        html += '</div>';
    });
    area.innerHTML = html;
}

function deleteConversation(convId, convName) {
    convId = Number(convId);
    showConfirm('确定要删除与「' + convName + '」的对话吗？聊天记录将被清除，文件不会丢失。', 'danger', '🗑️').then(function(ok){
    if (!ok) return;
    fetch('/im/api/conversations?conversation_id=' + convId, {
        method: 'DELETE',
        headers: {'X-XSRFToken': getCsrfToken()}
    }).then(function(r){return r.json()}).then(function(res){
        if(res.code === 0){
            if (currentConvId === convId) {
                currentConvId = 0;
                currentConvType = '';
                document.getElementById('chatHeader').style.display = 'none';
                document.getElementById('chatInput').style.display = 'none';

    });
}

function getFileIcon(ext) {
    ext = (ext||'').toLowerCase();
    if (['.jpg','.jpeg','.png','.gif','.webp','.bmp'].indexOf(ext)>=0) return '🖼️';
    if (['.doc','.docx'].indexOf(ext)>=0) return '📝';
    if (['.xls','.xlsx'].indexOf(ext)>=0) return '📊';
    if (['.pdf'].indexOf(ext)>=0) return '📄';
    if (['.zip','.rar','.7z','.tar','.gz'].indexOf(ext)>=0) return '🗜️';
    if (['.txt'].indexOf(ext)>=0) return '📃';
    if (['.ppt','.pptx'].indexOf(ext)>=0) return '📑';
    if (['.mp3','.wav','.flac','.aac'].indexOf(ext)>=0) return '🎵';
    if (['.mp4','.avi','.mov','.mkv'].indexOf(ext)>=0) return '🎬';
    return '📎';
}

function formatFileTime(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr.replace(' ','T'));
    if (isNaN(d.getTime())) return dateStr;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var yesterday = new Date(today - 86400000);
    var dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (dDay.getTime() === today.getTime()) {
        return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    } else if (dDay.getTime() === yesterday.getTime()) {
        return '昨天 ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    } else {
        return (d.getMonth()+1) + '/' + d.getDate() + ' ' + ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
    }
}

function downloadFile(url, filename) {
    var a = document.createElement('a');
    a.href = '/im/api/file/' + url;
    a.download = filename || url;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

function toggleGroup(el) {
    var arrow = el.querySelector('.arrow');
    var list = el.nextElementSibling;
    var isCollapsed = list.classList.contains('collapsed');

    if (isCollapsed) {
        // 展开
        arrow.classList.remove('collapsed');
        list.classList.remove('collapsed');
        list.style.maxHeight = list.scrollHeight + 'px';
        setTimeout(function() {
            list.style.maxHeight = '1000px';
        }, 350);
    } else {
        // 收起
        list.style.maxHeight = list.scrollHeight + 'px';
        // 强制重排
        list.offsetHeight;
        arrow.classList.add('collapsed');
        list.classList.add('collapsed');
        list.style.maxHeight = '0px';
    }
}

// ==================== 打开会话 ====================
function openConversation(convId, convType, convName) {
    currentConvId = convId;
    currentConvType = convType;

    // 切换到会话标签页
    _activeMainTab = 'conversations';
    document.querySelectorAll('.tab-item').forEach(function(t){t.classList.remove('active')});
    document.querySelector('.tab-item[data-tab="conversations"]').classList.add('active');

    // 恢复可能被删除的会话（将 is_deleted 重置为 0）
    fetch('/im/api/conversations/restore?conversation_id=' + convId, {
        method: 'POST',
        headers: {'X-XSRFToken': getCsrfToken()}
    });

    // 更新头部
    document.getElementById('chatHeader').style.display = 'flex';
    document.getElementById('chatTitle').textContent = convName;
    document.getElementById('chatInput').style.display = 'block';

    // 群聊显示群管理按钮和@提及按钮
    document.getElementById('btnGroupManage').style.display = (convType === 'group') ? 'inline-block' : 'none';
    document.getElementById('btnMention').style.display = (convType === 'group') ? 'flex' : 'none';
    if (convType === 'group') {
        groupMembersCache = []; // 清空缓存
    }

    // 加载历史消息
    loadHistory(convId);

    // 刷新会话列表（确保当前会话显示在列表中）
    loadConversations();

    // 加载群成员数
    if (convType === 'group') {
        fetch('/im/api/members?conversation_id=' + convId).then(function(r){return r.json()}).then(function(res){
            if(res.code === 0){
                document.getElementById('chatMembers').textContent = res.data.length + ' 人';
                // 获取当前用户在群中的角色
                var selfUserId = getCurrentUserId();
                for (var i = 0; i < res.data.length; i++) {
                    if (res.data[i].id === selfUserId) {
                        _currentUserRole = res.data[i].role || 'member';
                        break;
                    }
                }
            }
        });
        // 检查是否有未确认的公告
        checkUnconfirmedAnnouncement(convId);
    } else {
        document.getElementById('chatMembers').textContent = '';
        _currentUserRole = '';
    }

    // 标记已读
    if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({type: 'read', conversation_id: convId}));
    }

    // 延迟高亮当前会话（等loadConversations完成）
    setTimeout(function(){
        document.querySelectorAll('.conv-item').forEach(function(el){el.classList.remove('active')});
        var convItems = document.querySelectorAll('.conv-item');
        convItems.forEach(function(item){
            var onclick = item.getAttribute('onclick') || '';
            if (onclick.indexOf('openConversation(' + convId + ',') !== -1) {
                item.classList.add('active');
                var badge = item.querySelector('.unread');
                if (badge) badge.remove();
            }
        });
    }, 100);
}

function loadHistory(convId) {
    fetch('/im/api/history?conversation_id=' + convId + '&limit=50').then(function(r){return r.json()}).then(function(res){
        if(res.code === 0){
            renderMessages(res.data);
        }
    });
}

function renderMessages(messages) {
    var container = document.getElementById('chatMessages');
    container.innerHTML = '';

    if (!messages || messages.length === 0) {
        container.innerHTML = '<div class="chat-empty"><div class="placeholder"><div class="icon">💬</div><h3>暂无消息</h3><p>发送一条消息开始聊天吧</p></div></div>';
        return;
    }

    var lastDate = '';
    var selfUserId = getCurrentUserId();

    messages.forEach(function(m){
        var msgDate = m.create_at ? m.create_at.split(' ')[0] : '';
        if (msgDate && msgDate !== lastDate) {
            lastDate = msgDate;
            var divider = document.createElement('div');
            divider.className = 'msg-divider';
            divider.innerHTML = '<span>' + msgDate + '</span>';
            container.appendChild(divider);
        }

        if (m.type === 'system') {
            var sysDiv = document.createElement('div');
            sysDiv.className = 'msg-divider';
            sysDiv.innerHTML = '<span>' + (m.content || '') + '</span>';
            container.appendChild(sysDiv);
            return;
        }

        var isSelf = m.sender_id === selfUserId;
        var div = document.createElement('div');
        div.className = 'msg-row ' + (isSelf ? 'self' : '');

        var avatar = document.createElement('div');
        avatar.className = 'msg-avatar';
        avatar.textContent = (m.sender_name || '?')[0];

        var bubble = document.createElement('div');

        // 群聊中显示发送人名称和角色标识
        if (currentConvType === 'group') {
            var senderEl = document.createElement('div');
            senderEl.className = 'msg-sender';
            var roleBadge = '';
            var role = m.sender_role || '';
            if (role === 'owner') {
                roleBadge = '<span class="role-badge role-owner">群主</span>';
            } else if (role === 'admin') {
                roleBadge = '<span class="role-badge role-admin">管理员</span>';
            }
            senderEl.innerHTML = m.sender_name + roleBadge;
            bubble.appendChild(senderEl);
        }

        // 根据消息类型渲染
        var msgType = m.type || 'text';
        if (msgType === 'image') {
            var fileInfo = {};
            try { fileInfo = JSON.parse(m.content || '{}'); } catch(e) {}
            var img = document.createElement('img');
            img.className = 'msg-image';
            img.src = fileInfo.url || m.content;
            img.loading = 'lazy';
            img.onclick = function() { previewImage(fileInfo.url || m.content); };
            bubble.appendChild(img);
        } else if (msgType === 'file') {
            var fileInfo = {};
            try { fileInfo = JSON.parse(m.content || '{}'); } catch(e) {}
            var fileDiv = document.createElement('div');
            fileDiv.className = 'msg-file';
            fileDiv.onclick = function() { var u = this.getAttribute('data-download-url'); if (u) window.open(u); };
            fileDiv.innerHTML = '<div class="file-icon">📄</div><div class="file-info"><div class="file-name">' +
                escapeHtml(fileInfo.filename || '未知文件') + '</div><div class="file-size">' +
                formatFileSize(fileInfo.size || 0) + '</div></div>';
            if (fileInfo.url) {
                fileDiv.setAttribute('data-download-url', fileInfo.url);
            }
            bubble.appendChild(fileDiv);
        } else {
            var textEl = document.createElement('div');
            textEl.textContent = m.content;
            bubble.appendChild(textEl);
        }

        div.appendChild(avatar);
        div.appendChild(bubble);

        // 时间放在气泡外面，独立一行
        var timeWrapper = document.createElement('div');
        timeWrapper.className = 'msg-time ' + (isSelf ? 'msg-time-right' : 'msg-time-left');
        timeWrapper.textContent = m.create_at ? formatDisplayTime(m.create_at) : '';
        container.appendChild(div);
        container.appendChild(timeWrapper);
    });

    container.scrollTop = container.scrollHeight;
}

function formatDisplayTime(timeStr) {
    if (!timeStr) return '';
    var parts = timeStr.split(' ');
    if (parts.length < 2) return timeStr;
    var timeParts = parts[1].split(':');
    if (timeParts.length >= 2) {
        return timeParts[0] + ':' + timeParts[1];
    }
    return parts[1];
}

function previewImage(src) {
    document.getElementById('previewImg').src = src;
    document.getElementById('imagePreview').classList.add('show');
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// ==================== 文件上传与发送 ====================
var _pendingFileUploads = {};

function uploadFile(input) {
    var file = input.files[0];
    if (!file) return;
    if (!currentConvId) { showToast('请先选择一个会话', 'warn'); input.value = ''; return; }

    if (file.size > 10 * 1024 * 1024) {
        showToast('文件大小不能超过10MB', 'warn');
        input.value = '';
        return;
    }

    var pendingId = 'fu_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
    _pendingFileUploads[pendingId] = { convId: currentConvId, fileData: null };

    var selfName = getCurrentUserName();
    var selfRole = (currentConvType === 'group') ? getCurrentUserRole() : '';
    var tempContent = JSON.stringify({
        filename: file.name,
        size: file.size
    });
    var tempEl = appendMessage('self', tempContent, selfName, true, '', 'file', selfRole);
    if (tempEl) {
        tempEl.setAttribute('data-pending-upload', pendingId);
        tempEl.classList.add('msg-sending');
    }

    var container = document.getElementById('chatMessages');
    container.scrollTop = container.scrollHeight;

    var formData = new FormData();
    formData.append('file', file);
    formData.append('_xsrf', getCsrfToken());

    var msgInput = document.getElementById('msgInput');
    msgInput.placeholder = '上传中...';

    fetch('/im/api/file/upload', {
        method: 'POST',
        body: formData
    }).then(function(r){return r.json()}).then(function(res){
        msgInput.placeholder = '输入消息...';
        input.value = '';

        if (res.code === 0) {
            var data = res.data;
            var pendingEl = container.querySelector('[data-pending-upload="' + pendingId + '"]');
            if (pendingEl) {
                pendingEl.setAttribute('data-file-url', data.url);
                pendingEl.setAttribute('data-file-id', data.file_id);
                var fileDiv = pendingEl.querySelector('.msg-file');
                if (fileDiv) {
                    fileDiv.setAttribute('data-download-url', data.url);
                }
            }
            _pendingFileUploads[pendingId].fileData = data;

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({
                    type: 'message',
                    conversation_id: currentConvId,
                    msg_type: data.type,
                    content: JSON.stringify({
                        file_id: data.file_id,
                        filename: data.filename,
                        url: data.url,
                        size: data.size
                    })
                }));
            }
        } else {
            showToast(res.msg || '上传失败', 'error');
            markPendingFileFailed(pendingId);
        }
    }).catch(function(){
        showToast('上传失败', 'error');
        msgInput.placeholder = '输入消息...';
        input.value = '';
        markPendingFileFailed(pendingId);
    });
}

function markPendingFileFailed(pendingId) {
    var el = document.querySelector('[data-pending-upload="' + pendingId + '"]');
    if (el) {
        el.classList.remove('msg-sending');
        el.classList.add('msg-failed');
        el.removeAttribute('data-pending-upload');
    }
    delete _pendingFileUploads[pendingId];
}

function insertMention(username) {
    var input = document.getElementById('msgInput');
    var value = input.value;
    // 找到最后一个 @ 的位置
    var atIndex = value.lastIndexOf('@');
    if (atIndex !== -1) {
        input.value = value.substring(0, atIndex) + '@' + username + ' ';
    } else {
        input.value += '@' + username + ' ';
    }
    input.focus();
    document.getElementById('mentionPanel').classList.remove('show');
}

// 监听输入框中的 @ 字符
document.getElementById('msgInput').addEventListener('input', function(e) {
    var value = e.target.value;
    var cursorPos = e.target.selectionStart;
    // 检查光标前是否有未完成的 @提及
    var textBeforeCursor = value.substring(0, cursorPos);
    var lastAtIndex = textBeforeCursor.lastIndexOf('@');
    if (lastAtIndex !== -1) {
        var afterAt = textBeforeCursor.substring(lastAtIndex + 1);
        // 如果 @ 后面没有空格，显示提及面板
        if (afterAt.indexOf(' ') === -1 && currentConvType === 'group') {
            renderMentionPanel(afterAt);
        } else {
            document.getElementById('mentionPanel').classList.remove('show');
        }
    } else {
        document.getElementById('mentionPanel').classList.remove('show');
    }
});

    if (!container) return;
    if (_cgSearchResults.length === 0) {
        container.innerHTML = '<div class="add-friend-empty">未找到用户</div>';
        container.classList.remove('show-scrollbar');
        return;
    }
    var html = '';
    _cgSearchResults.forEach(function(m){
        html += '<label class="add-friend-item cg-member-item" data-id="' + m.id + '">';
        html += '<input type="checkbox" value="' + m.id + '" onchange="updateCgCount()" style="display:none">';
        html += '<div class="cg-select-check">✓</div>';
        html += '<div class="add-friend-avatar">' + m.avatar + '</div>';
        html += '<div class="add-friend-info"><div class="add-friend-name">' + m.name + '</div></div>';
        html += '</label>';
    });
    container.innerHTML = html;
    requestAnimationFrame(function(){
        if (container.scrollHeight > container.clientHeight) {
            container.classList.add('show-scrollbar');
        } else {
            container.classList.remove('show-scrollbar');
        }
    });
    container.querySelectorAll('.cg-member-item').forEach(function(item){
        item.addEventListener('click', function(e){
            e.preventDefault();
            var cb = item.querySelector('input[type=checkbox]');
            var check = item.querySelector('.cg-select-check');
            cb.checked = !cb.checked;
            if (cb.checked) {
                item.classList.add('cg-item-selected');
                check.classList.add('checked');
            } else {
                item.classList.remove('cg-item-selected');
                check.classList.remove('checked');
            }
            updateCgCount();
        });
    });
}

function updateCgCount() {
    var count = document.querySelectorAll('.create-group-modal input[type=checkbox]:checked').length;
    var el = document.getElementById('cgSelectCount');
    if (el) el.textContent = count;
}

function createGroup() {
    var name = document.getElementById('groupName').value.trim();
    if (!name) { showToast('请输入群名称', 'warn'); return; }
    var checkboxes = document.querySelectorAll('.create-group-modal input[type=checkbox]:checked');
    var memberIds = [];
    checkboxes.forEach(function(cb){
        memberIds.push(parseInt(cb.value));
    });
    if (memberIds.length === 0) { showToast('请至少选择一个成员', 'warn'); return; }

    fetch('/im/api/group', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-XSRFToken': getCsrfToken()},
        body: JSON.stringify({name: name, member_ids: memberIds, assistant_ids: []})
    }).then(function(r){return r.json()}).then(function(res){
        if(res.code === 0){
            hideModal('createGroupModal');
            loadConversations();
            loadContacts();
            showToast('群聊创建成功，已向成员发送邀请', 'success');
        } else {
            showToast(res.msg || '创建失败', 'error');
        }
    });
}

function loadGmFiles() {
    var container = document.getElementById('gmFilesList');
    if (!container) return;
    container.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.2);font-size:13px">加载中...</div>';
    var gid = _gmData.group ? _gmData.group.id : currentConvId;
    if (!gid) return;
    fetch('/im/api/files?scope=group&group_id=' + gid + '&page_size=50').then(function(r){return r.json()}).then(function(res){
        if (res.code !== 0 || !res.data || res.data.length === 0) {
            container.innerHTML = '<div style="text-align:center;padding:30px;color:rgba(255,255,255,0.2);font-size:13px">暂无群文件</div>';
            return;
        }
        var html = '<div style="font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:8px">共 ' + res.data.length + ' 个文件</div>';
        res.data.forEach(function(f){
            var icon = getFileIcon(f.file_ext);
            var sizeStr = formatFileSize(f.file_size);
            var timeStr = formatFileTime(f.create_at);
            html += '<div class="file-item" style="padding:8px 10px">';
            html += '<div class="file-icon" style="font-size:18px;width:28px">' + icon + '</div>';
            html += '<div class="file-info">';
            html += '<div class="file-name" style="font-size:12px">' + escapeHtml(f.file_name) + '</div>';
            html += '<div class="file-meta">' + escapeHtml(f.uploader_name||'未知') + ' · ' + sizeStr + ' · ' + timeStr + '</div>';
            html += '</div>';
            html += '<button class="file-download" data-hash="' + f.file_hash + '" data-ext="' + f.file_ext + '" data-name="' + escapeHtml(f.file_name) + '">下载</button>';
            html += '</div>';
        });
        container.innerHTML = html;
        container.querySelectorAll('.file-download').forEach(function(btn){
            btn.addEventListener('click', function(){
                var hash = this.dataset.hash;
                var ext = this.dataset.ext;
                var name = this.dataset.name;
                downloadFile(hash + ext, name);
            });
        });
    });
}

function searchAddFriend() {
    var keyword = document.getElementById('addFriendSearch').value.trim();
    var list = document.getElementById('addFriendList');
    if (!keyword) {
        list.innerHTML = '<div class="add-friend-empty">输入用户名搜索</div>';
        return;
    }
    list.innerHTML = '<div class="add-friend-empty">搜索中...</div>';
    fetch('/im/api/global-search?keyword=' + encodeURIComponent(keyword)).then(function(r){return r.json()}).then(function(res){

            var users = res.data.users || [];
            if (users.length === 0) {
                list.innerHTML = '<div class="add-friend-empty">未找到匹配的用户</div>';
                return;
            }
            var html = '';
            var myId = getCurrentUserId();
            users.forEach(function(u){
                if (u.id === myId) return; // 跳过自己
                html += '<div class="add-friend-item">';
                html += '<div class="add-friend-avatar">' + u.username[0] + '</div>';
                html += '<div class="add-friend-info"><div class="add-friend-name">' + u.username + '</div></div>';

                html += '</div>';
            });
            list.innerHTML = html;
            // 先设置DOM，再异步检查每个用户的好友状态
            users.forEach(function(u){
                if (u.id === myId) return;
                checkFriendStatus(u.id, u.username);
            });
        }
    });

function checkFriendStatus(userId, userName) {
    var btnContainer = document.getElementById('addBtn_' + userId);
    if (!btnContainer) return;
    var safeName = userName.replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    var addBtnHTML = '<button class="add-friend-btn add" data-action="add-friend" data-id="' + userId + '" data-name="' + safeName + '">添加</button>';

    fetch('/im/api/friends')
        .then(function(r){ return r.json(); })
        .then(function(res){
            if(res.code === 0){
                var isFriend = (res.data || []).some(function(f){ return f.id === userId; });
                if (isFriend) {
                    if (btnContainer) btnContainer.innerHTML = '<button class="add-friend-btn disabled">已是好友</button>';
                    return;
                }
                return fetch('/im/api/friend/request?type=sent')
                    .then(function(r2){ return r2.json(); })
                    .then(function(res2){
                        if (!btnContainer) return;
                        if(res2.code === 0){
                            var hasPending = (res2.data || []).some(function(r){ return r.to_user_id === userId && r.status === 'pending'; });
                            if (hasPending) {
                                btnContainer.innerHTML = '<button class="add-friend-btn disabled">已发送申请</button>';
                            } else {
                                btnContainer.innerHTML = addBtnHTML;
                            }
                        } else {
                            btnContainer.innerHTML = addBtnHTML;
                        }
                    })
                    .catch(function(){
                        if (btnContainer) btnContainer.innerHTML = addBtnHTML;
                    });
            } else {
                if (btnContainer) btnContainer.innerHTML = addBtnHTML;
            }
        })
        .catch(function(){
            if (btnContainer) btnContainer.innerHTML = addBtnHTML;
        });
}

// 扩展事件委托处理添加好友按钮
document.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'add-friend') {
        var id = parseInt(btn.getAttribute('data-id'), 10);
        var name = btn.getAttribute('data-name');
        sendFriendRequest(id, name);
        return;
    }
    if (action === 'delete') {
        var friendReqList = document.getElementById('friendReqList');
        var groupInviteList = document.getElementById('groupInviteList');
        if (friendReqList && friendReqList.contains(btn)) {
            deleteFriendRequest(parseInt(btn.getAttribute('data-id'), 10));
        } else if (groupInviteList && groupInviteList.contains(btn)) {
            deleteGroupInvite(parseInt(btn.getAttribute('data-id'), 10));
        }
    } else if (action === 'accept') {
        var friendReqList = document.getElementById('friendReqList');
        var groupInviteList = document.getElementById('groupInviteList');
        if (friendReqList && friendReqList.contains(btn)) {
            handleFriendRequest(parseInt(btn.getAttribute('data-id'), 10), 'accepted');
        } else if (groupInviteList && groupInviteList.contains(btn)) {
            handleGroupInvite(parseInt(btn.getAttribute('data-id'), 10), 'accepted');
        }
    } else if (action === 'reject') {
        var friendReqList = document.getElementById('friendReqList');
        var groupInviteList = document.getElementById('groupInviteList');
        if (friendReqList && friendReqList.contains(btn)) {
            handleFriendRequest(parseInt(btn.getAttribute('data-id'), 10), 'rejected');
        } else if (groupInviteList && groupInviteList.contains(btn)) {
            handleGroupInvite(parseInt(btn.getAttribute('data-id'), 10), 'rejected');
        }
    }
});

function showPrompt(title, defaultValue) {
    return new Promise(function(resolve) {
        var overlay = document.createElement('div');
        overlay.className = 'my-confirm-overlay';
        overlay.innerHTML =
            '<div class="my-confirm-box">' +
            '<div class="cf-icon">✉️</div>' +
            '<div class="cf-msg">' + title + '</div>' +
            '<div style="margin-bottom:20px"><input id="promptInput" type="text" value="' + (defaultValue||'').replace(/"/g,'&quot;') + '" style="width:100%;height:44px;border-radius:10px;border:1.5px solid rgba(123,47,247,0.3);background:rgba(255,255,255,0.06);color:#f0f0f0;padding:0 14px;font-size:14px;outline:none;box-sizing:border-box"></div>' +
            '<div class="cf-btns">' +
            '<button class="cf-btn cf-cancel">取消</button>' +
            '<button class="cf-btn cf-ok">发送</button>' +
            '</div></div>';
        overlay.querySelector('.cf-cancel').onclick = function() { overlay.remove(); resolve(null); };
        overlay.querySelector('.cf-ok').onclick = function() {
            var val = document.getElementById('promptInput').value.trim();
            overlay.remove(); resolve(val || defaultValue);
        };
        overlay.addEventListener('click', function(e) { if(e.target === overlay){overlay.remove();resolve(null);} });
        document.body.appendChild(overlay);
        setTimeout(function(){
            var inp = document.getElementById('promptInput');
            if(inp){ inp.focus(); inp.select(); }
        }, 150);
    });
}

// 消息 ack 确认
var _pendingMessages = {};
function handleMsgAck(data) {
    var convId = data.conversation_id;
    if (_pendingMessages[convId]) {
        var tempEl = document.querySelector('.msg-row[data-pending-conv="' + convId + '"]');
        if (tempEl) {
            tempEl.removeAttribute('data-pending-conv');
            tempEl.classList.remove('msg-sending');
            // 更新消息中的名称和角色标识（确保与服务器一致）
            var senderEl = tempEl.querySelector('.msg-sender');
            if (senderEl && currentConvType === 'group') {
                var selfName = getCurrentUserName();
                var selfRole = getCurrentUserRole();
                var roleBadge = '';
                if (selfRole === 'owner') {
                    roleBadge = '<span class="role-badge role-owner">群主</span>';
                } else if (selfRole === 'admin') {
                    roleBadge = '<span class="role-badge role-admin">管理员</span>';
                }
                senderEl.innerHTML = selfName + roleBadge;
            }
        }
        delete _pendingMessages[convId];
    }
    // 清理文件pending状态
    var pendingFileEl = document.querySelector('[data-pending-upload]');
    if (pendingFileEl) {
        pendingFileEl.classList.remove('msg-sending');
        pendingFileEl.removeAttribute('data-pending-upload');
    }
}

                    var name = item.inviter_name;
                    var initial = (name || '?')[0];
                    html += '<div class="group-invite-card" data-invite-id="' + item.id + '">';
                    html += '<button class="group-invite-btn delete" data-action="delete" data-id="' + item.id + '" title="删除">×</button>';
                    html += '<div class="group-invite-avatar">' + initial + '</div>';
                    html += '<div class="group-invite-content">';
                    html += '<div class="group-invite-name">' + name + ' 邀请你入群</div>';
                    html += '<div class="group-invite-group">群：' + (item.group_name || '未知群') + '</div>';
                    html += '<div class="group-invite-msg">' + (item.message || '无附加消息') + '</div>';
                    html += '</div>';
                    if (item.status === 'pending') {
                        html += '<div class="group-invite-actions">';
                        html += '<button class="group-invite-btn accept" data-action="accept" data-id="' + item.id + '">同意</button>';
                        html += '<button class="group-invite-btn reject" data-action="reject" data-id="' + item.id + '">拒绝</button>';
                        html += '</div>';
                    } else {
                        var statusClass = item.status === 'accepted' ? 'accepted' : (item.status === 'rejected' ? 'rejected' : 'pending');
                        var statusText = item.status === 'accepted' ? '已同意' : (item.status === 'rejected' ? '已拒绝' : '待处理');
                        html += '<div class="group-invite-status"><span class="status-badge ' + statusClass + '">' + statusText + '</span></div>';
                    }
                    html += '</div>';
                } else {
                    var name = item.invitee_name;
                    var initial = (name || '?')[0];
                    html += '<div class="group-invite-card" data-invite-id="' + item.id + '">';
                    html += '<button class="group-invite-btn delete" data-action="delete" data-id="' + item.id + '" title="删除">×</button>';
                    html += '<div class="group-invite-avatar">' + initial + '</div>';
                    html += '<div class="group-invite-content">';
                    html += '<div class="group-invite-name">邀请 ' + name + ' 入群</div>';
                    html += '<div class="group-invite-group">群：' + (item.group_name || '未知群') + '</div>';
                    html += '<div class="group-invite-msg">' + (item.message || '无附加消息') + '</div>';
                    html += '</div>';
                    var statusClass = item.status === 'accepted' ? 'accepted' : (item.status === 'rejected' ? 'rejected' : 'pending');
                    var statusText = item.status === 'accepted' ? '已同意' : (item.status === 'rejected' ? '已拒绝' : '待处理');
                    html += '<div class="group-invite-status"><span class="status-badge ' + statusClass + '">' + statusText + '</span></div>';
                    html += '</div>';
                }
            });
            list.innerHTML = html;
        }
    });
}

function handleGroupInvite(inviteId, status) {
    fetch('/im/api/group/invite', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-XSRFToken': getCsrfToken()},
        body: JSON.stringify({action: 'handle', invite_id: inviteId, status: status})
    }).then(function(r){return r.json()}).then(function(res){
        if(res.code === 0){
            loadGroupInvites(_groupInviteTab);
            loadGroupInviteBadge();
            loadContacts();
            loadConversations();
        } else {
            showToast(res.msg || '操作失败', 'error');
        }
    }).catch(function(){
        showToast('网络错误，操作失败', 'error');
    });
}

function deleteGroupInvite(inviteId) {
    showConfirm('确定删除这条邀请记录吗？', '', '🗑️').then(function(ok){
    if (!ok) return;
    fetch('/im/api/group/invite', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-XSRFToken': getCsrfToken()},
        body: JSON.stringify({action: 'delete', invite_id: inviteId})
    }).then(function(r){return r.json()}).then(function(res){
        if(res.code === 0){
            loadGroupInvites(_groupInviteTab);
            loadGroupInviteBadge();
        } else {
            showToast(res.msg || '删除失败', 'error');
        }
    });
    });
}

function loadGroupInviteBadge() {
    fetch('/im/api/group/invite?type=received').then(function(r){return r.json()}).then(function(res){
        if(res.code === 0){
            var unread = res.unread || {};
            _groupInviteBadgeCount = (unread.received || 0) + (unread.sent || 0);
            renderGroupInviteBadge();
        }
    });
}

function renderGroupInviteBadge() {
    var items = document.querySelectorAll('.contact-item');
    for (var i = 0; i < items.length; i++) {
        var nameEl = items[i].querySelector('.name');
        if (nameEl && nameEl.textContent === '群邀请') {
            var oldBadge = items[i].querySelector('.group-invite-badge');
            if (oldBadge) oldBadge.remove();
            if (_groupInviteBadgeCount > 0) {
                var badge = document.createElement('span');
                badge.className = 'group-invite-badge';
                badge.textContent = _groupInviteBadgeCount > 99 ? '99+' : _groupInviteBadgeCount;
                items[i].style.position = 'relative';
                items[i].appendChild(badge);
            }
            break;
        }
    }
}

// 收到新的群邀请
function onNewGroupInvite(data) {
    loadGroupInviteBadge();
    if (document.getElementById('groupInviteModal').classList.contains('show')) {
        loadGroupInvites(_groupInviteTab);
    }
}

// 群邀请被同意
function onGroupInviteAccepted(data) {
    loadGroupInviteBadge();
    if (document.getElementById('groupInviteModal').classList.contains('show')) {
        loadGroupInvites(_groupInviteTab);
    }
}

// 群邀请被拒绝
function onGroupInviteRejected(data) {
    loadGroupInviteBadge();
    if (document.getElementById('groupInviteModal').classList.contains('show')) {
        loadGroupInvites(_groupInviteTab);
    }
}

// 加入群聊（邀请被同意后）
function onGroupJoined(data) {
    loadContacts();
    loadConversations();
}

// ==================== 群管理 WebSocket 事件 ====================
function onGroupInfoChanged(data) {
    if (data.group_id === currentConvId) {
        if (data.name) {
            document.getElementById('chatTitle').textContent = data.name;
        }
    }
    loadConversations();
}

function onMemberRemoved(data) {
    if (data.group_id === currentConvId) {
        appendSystemMessage(data.operator_name + ' 将 ' + data.member_name + ' 移出群聊');
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
}

function onMemberAdded(data) {
    if (data.group_id === currentConvId) {
        appendSystemMessage(data.operator_name + ' 邀请了新成员加入群聊');
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
}

function onMemberRoleChanged(data) {
    if (data.group_id === currentConvId) {
        var roleText = data.new_role === 'admin' ? '管理员' : '普通成员';
        appendSystemMessage(data.operator_name + ' 将 ' + data.member_name + ' ' + (data.new_role === 'admin' ? '设为' : '撤销') + roleText);
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
}

function onMemberMuted(data) {
    if (data.group_id === currentConvId) {
        if (data.mute_until) {
            appendSystemMessage(data.operator_name + ' 禁言了 ' + data.member_name);
        } else {
            appendSystemMessage(data.operator_name + ' 解除了 ' + data.member_name + ' 的禁言');
        }
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
}

function onGroupMuteAll(data) {
    if (data.group_id === currentConvId) {
        if (data.enabled) {
            appendSystemMessage(data.operator_name + ' 开启了全体禁言');
        } else {
            appendSystemMessage(data.operator_name + ' 关闭了全体禁言');
        }
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
}

function onGroupDismissed(data) {
    showToast('群聊 "' + (data.group_name || '') + '" 已被解散', 'error');
    if (data.group_id === currentConvId) {
        currentConvId = 0;
        currentConvType = '';
        document.getElementById('chatMessages').innerHTML = '<div class="chat-empty"><div class="placeholder"><div class="icon">💬</div><h3>暂无会话</h3><p>从左侧选择一个会话开始聊天</p></div></div>';
        document.getElementById('chatInput').style.display = 'none';
        document.getElementById('btnGroupManage').style.display = 'none';
    }
    loadConversations();
}

function onNewAnnouncement(data) {
    if (data.group_id === currentConvId) {
        appendSystemMessage('【群公告】' + data.content);
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
    // 弹出公告确认框（非发布者、非数字员工）
    var selfUserId = getCurrentUserId();
    if (data.publisher_id && selfUserId !== data.publisher_id) {
        setTimeout(function(){
            checkUnconfirmedAnnouncement(data.group_id);
        }, 500);
    }
}

function onAnnouncementDeleted(data) {
    if (data.group_id === currentConvId) {
        appendSystemMessage(data.operator_name + ' 删除了一条群公告');
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
}

function onYouRemoved(data) {
    showToast('你被 ' + data.operator_name + ' 移出群聊', 'error');
    if (data.group_id === currentConvId) {
        currentConvId = 0;
        currentConvType = '';
        document.getElementById('chatMessages').innerHTML = '<div class="chat-empty"><div class="placeholder"><div class="icon">💬</div><h3>暂无会话</h3><p>从左侧选择一个会话开始聊天</p></div></div>';
        document.getElementById('chatInput').style.display = 'none';
        document.getElementById('btnGroupManage').style.display = 'none';
    }
    loadConversations();
}

function onGroupTransferred(data) {
    if (data.group_id === currentConvId) {
        appendSystemMessage(data.old_owner_name + ' 将群主转让给了 ' + data.new_owner_name);
    }
    if (_gmData.group && _gmData.group.id === data.group_id) {
        showGroupModal();
    }
}

function onAnnouncementConfirmed(data) {
    if (data.group_id === currentConvId) {
        appendSystemMessage(data.username + ' 已确认公告');
    }
}

function checkUnconfirmedAnnouncement(groupId) {
    fetch('/im/api/announcement/unconfirmed?group_id=' + groupId)
        .then(function(r){return r.json()})
        .then(function(res){
            if (res.code === 0 && res.data && res.data.need_confirm && res.data.announcement && res.data.announcement.id) {
                showAnnounceConfirm(res.data.announcement);
            }
        });
}

function showAnnounceConfirm(announcement) {
    _pendingAnnounceConfirm = {id: announcement.id, group_id: currentConvId};
    document.getElementById('announceConfirmBody').textContent = announcement.content || '';
    showModal('announceConfirmModal');
}

function doConfirmAnnouncement() {
    if (!_pendingAnnounceConfirm) return;
    var data = _pendingAnnounceConfirm;
    _pendingAnnounceConfirm = null;
    fetch('/im/api/announcement/confirm', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-XSRFToken': getCsrfToken()},
        body: JSON.stringify({announcement_id: data.id, group_id: data.group_id})
    }).then(function(r){return r.json()}).then(function(res){
        if (res.code === 0) {
            hideModal('announceConfirmModal');
            showToast('已确认公告', 'success');
        } else {
            showToast(res.msg || '操作失败', 'error');
        }
    });
}

function closeAnnounceConfirm() {
    _pendingAnnounceConfirm = null;
    hideModal('announceConfirmModal');
}

function appendSystemMessage(text) {
    var container = document.getElementById('chatMessages');
    if (!container) return;
    var div = document.createElement('div');
    div.className = 'msg-divider';
    div.innerHTML = '<span>' + text + '</span>';
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

// 删除好友
function removeFriend(friendId, friendName) {
    showConfirm('确定删除好友 "' + friendName + '" 吗？\n\n删除后将同时清除与该好友的聊天记录和会话。', 'danger', '💔').then(function(ok){
    if (!ok) return;
    fetch('/im/api/friend/remove', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-XSRFToken': getCsrfToken()},
        body: JSON.stringify({friend_id: friendId})
    }).then(function(r){return r.json()}).then(function(res){
        if(res.code === 0){
            // 如果当前正在和该好友聊天，重置聊天窗口
            if (currentConvType === 'private') {
                // 需要检查当前会话是否是该好友的
                fetch('/im/api/members?conversation_id=' + currentConvId).then(function(r){return r.json()}).then(function(res2){
                    if(res2.code === 0){
                        var isCurrentChat = res2.data.some(function(m){return m.id === friendId});
                        if (isCurrentChat) {
                            document.getElementById('chatMessages').innerHTML = '<div class="chat-empty"><div class="placeholder"><div class="icon">💬</div><h3>暂无会话</h3><p>从左侧选择一个会话开始聊天</p></div></div>';
                            document.getElementById('chatTitle').textContent = '';
                            document.getElementById('chatMembers').textContent = '';
                            document.getElementById('chatInput').style.display = 'none';
                            document.getElementById('btnGroupManage').style.display = 'none';
                            currentConvId = 0;
                            currentConvType = '';
                        }
                    }
                });
            }
            loadContacts();
            loadConversations();
        } else {
            showToast(res.msg || '删除失败', 'error');
        }
    }).catch(function(){
        showToast('网络错误，删除失败', 'error');
    });
    });
}

        var btn = document.getElementById('backHomeBtn');
