{% extends "layout.html" %}
{% block extra_style %}
<style>
@keyframes gradientMove{0%{background-position:0% 50%}25%{background-position:50% 100%}50%{background-position:100% 50%}75%{background-position:50% 0%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-30px) rotate(180deg)}}
@keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
@keyframes cardFadeIn{from{opacity:0;transform:translateY(20px) scale(0.95)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes glow{0%,100%{box-shadow:0 0 20px rgba(0,212,255,0.2)}50%{box-shadow:0 0 40px rgba(0,212,255,0.4),0 0 60px rgba(123,47,247,0.2)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes scanDown{0%{top:-5px;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:100%;opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}

.sch-wrap{position:relative;margin:-24px;min-height:calc(100vh - 140px);background:linear-gradient(135deg,#050a14 0%,#0a1228 15%,#101838 30%,#1a1048 45%,#251560 55%,#1a1048 65%,#101838 80%,#0a1228 90%,#050a14 100%);background-size:600% 600%;animation:gradientMove 30s ease infinite;overflow:hidden;}
.sch-wrap::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 20%,rgba(0,212,255,.15) 0%,transparent 40%),radial-gradient(ellipse at 80% 20%,rgba(123,47,247,.15) 0%,transparent 40%),radial-gradient(ellipse at 50% 80%,rgba(255,0,128,.1) 0%,transparent 30%),radial-gradient(ellipse at 30% 50%,rgba(0,200,255,.08) 0%,transparent 25%);pointer-events:none;}

.sch-inner{position:relative;z-index:1;padding:24px;}

.sch-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;animation:cardFadeIn 0.8s ease-out;}
.sch-header h2{color:#fff;margin:0;font-size:22px;display:flex;align-items:center;gap:12px;letter-spacing:2px;}
.sch-header h2 i{color:#00d4ff;font-size:26px;text-shadow:0 0 20px rgba(0,212,255,0.5);}
.sch-header h2::after{content:'';width:60px;height:2px;background:linear-gradient(90deg,rgba(0,212,255,0.6),transparent);border-radius:2px;}
.sch-header .sch-actions{display:flex;gap:10px;}
.sch-header .sch-actions button{padding:8px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.8);font-size:13px;cursor:pointer;transition:all .3s;backdrop-filter:blur(10px);}
.sch-header .sch-actions button:hover{border-color:rgba(0,212,255,0.4);background:rgba(0,212,255,0.1);color:#fff;box-shadow:0 0 15px rgba(0,212,255,0.2);}
.sch-header .sch-actions .btn-primary{background:linear-gradient(135deg,rgba(0,212,255,0.2),rgba(123,47,247,0.2));border-color:rgba(0,212,255,0.3);color:#fff;}
.sch-header .sch-actions .btn-primary:hover{background:linear-gradient(135deg,rgba(0,212,255,0.4),rgba(123,47,247,0.4));box-shadow:0 0 25px rgba(0,212,255,0.3);}
.sch-header .sch-actions .btn-danger{color:rgba(255,100,100,0.8);border-color:rgba(255,100,100,0.2);}
.sch-header .sch-actions .btn-danger:hover{background:rgba(255,100,100,0.15);border-color:rgba(255,100,100,0.4);color:#ff6666;box-shadow:0 0 15px rgba(255,100,100,0.2);}

.sch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:18px;}

.sch-card{position:relative;background:rgba(255,255,255,0.03);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:22px;transition:all .35s;overflow:hidden;animation:cardFadeIn 0.6s ease-out forwards;opacity:0;}
.sch-card:nth-child(1){animation-delay:0s}.sch-card:nth-child(2){animation-delay:0.05s}.sch-card:nth-child(3){animation-delay:0.1s}.sch-card:nth-child(4){animation-delay:0.15s}.sch-card:nth-child(5){animation-delay:0.2s}.sch-card:nth-child(6){animation-delay:0.25s}.sch-card:nth-child(7){animation-delay:0.3s}.sch-card:nth-child(8){animation-delay:0.35s}.sch-card:nth-child(9){animation-delay:0.4s}.sch-card:nth-child(10){animation-delay:0.45s}.sch-card:nth-child(11){animation-delay:0.5s}.sch-card:nth-child(12){animation-delay:0.55s}
.sch-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,rgba(0,212,255,0.4),rgba(123,47,247,0.3),transparent);opacity:0;transition:opacity .35s;}
.sch-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,212,255,0.04),transparent 40%);opacity:0;transition:opacity .35s;pointer-events:none;}
.sch-card:hover{border-color:rgba(0,212,255,0.3);transform:translateY(-3px);box-shadow:0 8px 30px rgba(0,0,0,0.3),0 0 20px rgba(0,212,255,0.08);}
.sch-card:hover::before{opacity:1;}
.sch-card:hover::after{opacity:1;}
.sch-card.selected{border-color:rgba(0,212,255,0.5);background:rgba(0,212,255,0.06);box-shadow:0 0 0 2px rgba(0,212,255,0.15),0 0 25px rgba(0,212,255,0.1);}
.sch-card.selected::before{opacity:1;}

.sch-card .card-check{position:absolute;top:16px;right:16px;width:20px;height:20px;cursor:pointer;accent-color:#00d4ff;z-index:2;}

.sch-card .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;padding-right:32px;}
.sch-card .card-source{font-size:15px;font-weight:700;color:#fff;display:flex;align-items:center;gap:8px;}
.sch-card .card-source::before{content:'';width:4px;height:4px;border-radius:50%;background:#00d4ff;box-shadow:0 0 6px #00d4ff;}
.sch-card .card-badge{padding:3px 12px;border-radius:12px;font-size:11px;font-weight:600;flex-shrink:0;margin-left:10px;letter-spacing:0.5px;}
.sch-card .card-badge.on{background:rgba(46,204,113,0.15);color:#2ecc71;border:1px solid rgba(46,204,113,0.25);}
.sch-card .card-badge.on::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#2ecc71;margin-right:5px;animation:blink 1.5s ease-in-out infinite;}
.sch-card .card-badge.off{background:rgba(231,76,60,0.1);color:#e74c3c;border:1px solid rgba(231,76,60,0.2);}

.sch-card .card-meta{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.sch-card .card-meta-row{display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,0.55);}
.sch-card .card-meta-label{color:rgba(255,255,255,0.3);min-width:40px;font-size:11px;letter-spacing:1px;}
.sch-card .card-meta-value{color:rgba(255,255,255,0.75);font-weight:500;}
.sch-card .card-time{font-family:Consolas,'Courier New',monospace;color:#00d4ff;background:rgba(0,212,255,0.08);padding:3px 10px;border-radius:6px;font-size:12px;font-weight:600;letter-spacing:0.5px;border:1px solid rgba(0,212,255,0.15);}
.sch-card .card-kw{color:#ff9800;background:rgba(255,152,0,0.08);padding:2px 8px;border-radius:4px;font-size:11px;}
.sch-card .card-pages{color:rgba(255,255,255,0.5);font-size:11px;}

.sch-card .card-result{margin-top:12px;padding:10px 14px;border-radius:8px;font-size:12px;position:relative;overflow:hidden;}
.sch-card .card-result::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;border-radius:0 2px 2px 0;}
.sch-card .card-result.success{background:rgba(46,204,113,0.06);color:#2ecc71;border:1px solid rgba(46,204,113,0.15);}
.sch-card .card-result.success::before{background:#2ecc71;box-shadow:0 0 8px rgba(46,204,113,0.4);}
.sch-card .card-result.none{background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.35);border:1px solid rgba(255,255,255,0.05);}
.sch-card .card-result.none::before{background:rgba(255,255,255,0.15);}
.sch-card .card-result.error{background:rgba(231,76,60,0.06);color:#e74c3c;border:1px solid rgba(231,76,60,0.15);}
.sch-card .card-result.error::before{background:#e74c3c;box-shadow:0 0 8px rgba(231,76,60,0.4);}

.sch-card .card-footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06);}
.sch-card .card-create{font-size:11px;color:rgba(255,255,255,0.3);}
.sch-card .card-create strong{color:rgba(255,255,255,0.5);font-weight:500;}
.sch-card .card-actions{display:flex;gap:8px;}
.sch-card .card-actions button{padding:5px 14px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.6);font-size:11px;cursor:pointer;transition:all .25s;}
.sch-card .card-actions button:hover{border-color:rgba(0,212,255,0.3);background:rgba(0,212,255,0.1);color:#fff;}
.sch-card .card-actions .btn-danger:hover{border-color:rgba(255,100,100,0.4);background:rgba(255,100,100,0.15);color:#ff6666;}

.sch-empty{text-align:center;padding:100px 24px;color:rgba(255,255,255,0.2);font-size:14px;grid-column:1/-1;}
.sch-empty i{font-size:64px;display:block;margin-bottom:20px;color:rgba(255,255,255,0.08);}
.sch-empty p{font-size:13px;color:rgba(255,255,255,0.15);margin-top:8px;}

.sch-pagination{padding:24px 0;text-align:center;}

.cron-input-group{display:flex;gap:6px;}
.cron-input-item{flex:1;display:flex;align-items:center;}
.cron-input-item input{text-align:center;}
.cron-input-item .cron-unit{color:#8899b5;font-size:12px;margin-left:4px;white-space:nowrap;}
</style>
{% end %}

{% block body %}
<div class="sch-wrap">
<div class="sch-inner">
<div class="sch-header">
<h2><i class="layui-icon layui-icon-log"></i>定时采集任务</h2>
<div class="sch-actions">
<button id="btnSelectAll"><i class="layui-icon layui-icon-list"></i>全选</button>
<button class="btn-danger" id="btnBatchDel"><i class="layui-icon layui-icon-delete"></i>批量删除</button>
<button class="btn-primary" id="btnAdd"><i class="layui-icon layui-icon-add-1"></i>新增任务</button>
</div>
</div>
<div class="sch-grid" id="schGrid"></div>
<div class="sch-pagination" id="schPagination"></div>
</div>
</div>

<div id="formLayer" style="display:none;padding:20px;">
<form class="layui-form" lay-filter="schForm">
<input type="hidden" name="id">
<div class="layui-form-item"><label class="layui-form-label">数据源</label><div class="layui-input-block"><select name="source_id" lay-filter="sourceChange" lay-search><option value="0">请选择数据源</option></select></div></div>
<div class="layui-form-item"><label class="layui-form-label">数据源名称</label><div class="layui-input-block"><input type="text" name="source_name" class="layui-input" readonly></div></div>
<div class="layui-form-item"><label class="layui-form-label">关键词</label><div class="layui-input-block"><input type="text" name="keyword" class="layui-input" placeholder="可选，支持URL模板关键词替换"></div></div>
<div class="layui-form-item"><label class="layui-form-label">采集类型</label><div class="layui-input-block"><input type="radio" name="schedule_type" value="once" title="一次性" checked lay-filter="schedule_type"><input type="radio" name="schedule_type" value="daily" title="每日采集" lay-filter="schedule_type"></div></div>
<div class="layui-form-item" id="onceTimeGroup"><label class="layui-form-label">执行时间</label><div class="layui-input-block"><div class="cron-input-group"><div class="cron-input-item"><input type="number" name="sch_year" class="layui-input" placeholder="年" min="2026" max="2099"><span class="cron-unit">年</span></div><div class="cron-input-item"><input type="number" name="sch_month" class="layui-input" placeholder="月" min="1" max="12"><span class="cron-unit">月</span></div><div class="cron-input-item"><input type="number" name="sch_day" class="layui-input" placeholder="日" min="1" max="31"><span class="cron-unit">日</span></div><div class="cron-input-item"><input type="number" name="sch_hour" class="layui-input" placeholder="时" min="0" max="23"><span class="cron-unit">时</span></div><div class="cron-input-item"><input type="number" name="sch_minute" class="layui-input" placeholder="分" min="0" max="59"><span class="cron-unit">分</span></div></div></div></div>
<div class="layui-form-item" id="dailyTimeGroup" style="display:none"><label class="layui-form-label">每日时间</label><div class="layui-input-block"><div class="cron-input-group"><div class="cron-input-item"><input type="number" name="daily_hour" class="layui-input" placeholder="时" min="0" max="23"><span class="cron-unit">时</span></div><div class="cron-input-item"><input type="number" name="daily_minute" class="layui-input" placeholder="分" min="0" max="59"><span class="cron-unit">分</span></div></div></div></div>
<div class="layui-form-item"><label class="layui-form-label">采集页数</label><div class="layui-input-block"><input type="number" name="pages" value="1" class="layui-input" min="1"></div></div>
<div class="layui-form-item"><label class="layui-form-label">每页条数</label><div class="layui-input-block"><input type="number" name="per_page" value="10" class="layui-input" min="1"></div></div>
<div class="layui-form-item"><label class="layui-form-label">启用</label><div class="layui-input-block"><input type="checkbox" name="is_enabled" value="1" lay-skin="switch" lay-text="ON|OFF" checked></div></div>
<div class="layui-form-item" style="text-align:center;padding-top:10px;">
<button type="button" class="layui-btn layui-btn-primary" id="btnCancel">取消</button>
<button type="button" class="layui-btn" lay-submit lay-filter="schSubmit">确定</button>
</div>
</form>
</div>
{% end %}

{% block extra_script %}
<script>
layui.use(['form','layer','laypage'], function(){
	var form=layui.form, layer=layui.layer, laypage=layui.laypage, $=layui.$;
	var currentPage=1, pageSize=12, sourcesData=[], layerIdx;

	function getCsrfToken(){
		var cookies=document.cookie.split(';');
		for(var i=0;i<cookies.length;i++){
			var c=cookies[i].trim();
			if(c.indexOf('_xsrf=')===0) return decodeURIComponent(c.substring(6));
		}
		return '';
	}

	function utcToBeijing(utcStr){
		if(!utcStr) return '-';
		try{
			var parts=utcStr.split(' ');
			var dp=parts[0].split('-');
			var tp=parts[1].split(':');
			var d=new Date(Date.UTC(
				parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]),
				parseInt(tp[0])+8,parseInt(tp[1]),parseInt(tp[2])
			));
			var yy=d.getUTCFullYear();
			var mm=String(d.getUTCMonth()+1).padStart(2,'0');
			var dd=String(d.getUTCDate()).padStart(2,'0');
			var hh=String(d.getUTCHours()).padStart(2,'0');
			var mi=String(d.getUTCMinutes()).padStart(2,'0');
			var ss=String(d.getUTCSeconds()).padStart(2,'0');
			return yy+'-'+mm+'-'+dd+' '+hh+':'+mi+':'+ss;
		}catch(e){return utcStr;}
	}

	function loadSources(cb){
		$.get('/user/outlook/schedule/api?action=sources',function(res){
			if(res.code===0&&res.data){
				sourcesData=res.data;
				var sel=$('select[name=source_id]');
				sel.find('option:gt(0)').remove();
				sourcesData.forEach(function(s){ sel.append('<option value="'+s.id+'">'+escHtml(s.name)+' ('+escHtml(s.code)+')</option>'); });
				form.render('select');
			}
			if(cb) cb();
		});
	}
	loadSources();

	form.on('select(sourceChange)', function(data){
		var s=sourcesData.find(function(x){return x.id==data.value;});
		$('input[name=source_name]').val(s?s.name:'');
	});

	function escHtml(s){ var d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

	function formatCronDisplay(cron, type){
		if(!cron) return '未设置';
		if(type === 'daily'){
			var parts=cron.trim().split(/\s+/);
			var mn=parseInt(parts[0]), h=parseInt(parts[1]);
			if(isNaN(mn)||isNaN(h)) return escHtml(cron);
			return '每日 '+String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0');
		}
		var parts=cron.trim().split(/\s+/);
		if(parts.length<4) return escHtml(cron);
		var mn=parseInt(parts[0]), h=parseInt(parts[1]), d=parseInt(parts[2]), m=parseInt(parts[3]);
		if(isNaN(mn)||isNaN(h)||isNaN(d)||isNaN(m)) return escHtml(cron);
		return m+'月'+d+'日 '+String(h).padStart(2,'0')+':'+String(mn).padStart(2,'0');
	}

	function loadList(page){
		currentPage=page||1;
		$.get('/user/outlook/schedule/api',{page:currentPage,page_size:pageSize},function(res){
			if(res.code===0){
				var html='';
				if(!res.data||res.data.length===0){
					html='<div class="sch-empty"><i class="layui-icon layui-icon-log"></i>暂无定时采集任务<p>点击右上角「新增任务」来创建第一个</p></div>';
				}else{
					res.data.forEach(function(d){
						var badgeCls=d.is_enabled?'on':'off', badgeText=d.is_enabled?'运行中':'已停用';
						var srcLabel=d.source_display_name||d.source_name||('数据源#'+d.source_id);
						var resultCls='none', resultText='等待首次执行';
						if(d.last_run){
							resultText='上次执行: '+utcToBeijing(d.last_run);
							if(d.last_log_status==='completed'){ resultCls='success'; resultText += ' ✓ 采集成功'; }
							else if(d.last_log_status==='error'){ resultCls='error'; resultText += ' ✗ 采集失败'; }
						}
						html+='<div class="sch-card" data-id="'+d.id+'">';
						html+='<input type="checkbox" class="card-check" value="'+d.id+'">';
						html+='<div class="card-top"><span class="card-source">'+escHtml(srcLabel)+'</span><span class="card-badge '+badgeCls+'">'+badgeText+'</span></div>';
						html+='<div class="card-meta">';
						html+='<div class="card-meta-row"><span class="card-meta-label">执行</span><span class="card-time">'+formatCronDisplay(d.cron_expression||'', d.schedule_type)+'</span></div>';
						if(d.keyword) html+='<div class="card-meta-row"><span class="card-meta-label">关键词</span><span class="card-kw">'+escHtml(d.keyword)+'</span></div>';
						html+='<div class="card-meta-row"><span class="card-meta-label">采集</span><span class="card-pages">'+d.pages+' 页 × '+d.per_page+' 条/页</span></div>';
						html+='</div>';
						html+='<div class="card-result '+resultCls+'">'+resultText+'</div>';
						html+='<div class="card-footer"><div class="card-create">创建于 <strong>'+utcToBeijing(d.create_at||'')+'</strong></div>';
						html+='<div class="card-actions">';
						html+='<button onclick="editSch('+d.id+')">✎ 编辑</button>';
						html+='<button class="btn-danger" onclick="delSch('+d.id+')">✕ 删除</button>';
						html+='</div></div></div>';
					});
				}
				$('#schGrid').html(html);
				if(res.count>pageSize){
					laypage.render({elem:'schPagination',count:res.count,limit:pageSize,curr:currentPage,jump:function(obj,first){if(!first)loadList(obj.curr);}});
				}else{$('#schPagination').html('');}
			}
		});
	}
	loadList(1);

	$('#btnAdd').on('click', function(){
		layerIdx=layer.open({type:1,title:'新增定时任务',area:'580px',content:$('#formLayer')});
		var now=new Date();
		form.val('schForm',{id:'',source_id:'0',source_name:'',keyword:'',schedule_type:'once',sch_year:String(now.getFullYear()),sch_month:String(now.getMonth()+1),sch_day:String(now.getDate()),sch_hour:String(now.getHours()),sch_minute:String(now.getMinutes()),daily_hour:'08',daily_minute:'00',pages:'1',per_page:'10'});
		$('#formLayer input[name=is_enabled]').prop('checked',true);
		$('#onceTimeGroup').show();
		$('#dailyTimeGroup').hide();
		form.render();
		form.render('radio');
	});

	// 采集类型切换
	form.on('radio(schedule_type)', function(data){
		if(data.value === 'daily'){
			$('#onceTimeGroup').hide();
			$('#dailyTimeGroup').show();
		} else {
			$('#onceTimeGroup').show();
			$('#dailyTimeGroup').hide();
		}
	});

	window.editSch=function(id){
		$.get('/user/outlook/schedule/api?action=detail&id='+id,function(res){
			if(res.code===0&&res.data){
				layerIdx=layer.open({type:1,title:'编辑定时任务',area:'580px',content:$('#formLayer')});
				var d=res.data;
				var cronParts=(d.cron_expression||'').trim().split(/\s+/);
				var sch_month=cronParts.length>=4?parseInt(cronParts[3])||1:1;
				var sch_day=cronParts.length>=3?parseInt(cronParts[2])||1:1;
				var sch_hour=cronParts.length>=2?parseInt(cronParts[1])||0:0;
				var sch_minute=cronParts.length>=1?parseInt(cronParts[0])||0:0;
				var st = d.schedule_type || 'once';
				form.val('schForm',{id:d.id,source_id:String(d.source_id||''),source_name:d.source_name||'',keyword:d.keyword||'',schedule_type:st,sch_year:String(new Date().getFullYear()),sch_month:String(sch_month),sch_day:String(sch_day),sch_hour:String(sch_hour),sch_minute:String(sch_minute),daily_hour:String(sch_hour),daily_minute:String(sch_minute),pages:String(d.pages||1),per_page:String(d.per_page||10)});
				$('#formLayer input[name=is_enabled]').prop('checked',d.is_enabled==1);
				if(st === 'daily'){
					$('#onceTimeGroup').hide();
					$('#dailyTimeGroup').show();
				} else {
					$('#onceTimeGroup').show();
					$('#dailyTimeGroup').hide();
				}
				form.render();
				form.render('radio');
			}
		});
	};

	window.delSch=function(id){
		layer.confirm('确定删除该定时任务？',function(idx){
			$.ajax({url:'/user/outlook/schedule/api?id='+id+'&_xsrf='+getCsrfToken(),type:'DELETE',success:function(r){
				if(r.code===0){layer.msg('已删除');loadList(currentPage);}else{layer.msg(r.msg);}
			}});layer.close(idx);
		});
	};

	$('#btnSelectAll').on('click', function(){
		var allChecked=$('#schGrid .card-check:checked').length===0;
		$('#schGrid .card-check').each(function(){
			$(this).prop('checked',allChecked);
			$(this).closest('.sch-card').toggleClass('selected',allChecked);
		});
	});

	$(document).on('change','.card-check', function(){
		$(this).closest('.sch-card').toggleClass('selected',this.checked);
	});

	$('#btnBatchDel').on('click', function(){
		var ids=[];
		$('#schGrid .card-check:checked').each(function(){ ids.push($(this).val()); });
		if(ids.length===0){ layer.msg('请至少选择一项'); return; }
		layer.confirm('确定删除选中的 '+ids.length+' 个任务？',function(idx){
			$.ajax({url:'/user/outlook/schedule/api?ids='+ids.join(',')+'&_xsrf='+getCsrfToken(),type:'DELETE',success:function(r){
				if(r.code===0){layer.msg('批量删除成功');loadList(currentPage);}else{layer.msg(r.msg);}
			}});layer.close(idx);
		});
	});

	$('#btnCancel').on('click', function(){
		layer.close(layerIdx);
	});

	form.on('submit(schSubmit)',function(d){
		var data=d.field;
		data.is_enabled=data.is_enabled?1:0;
		data.pages=parseInt(data.pages)||1;
		data.per_page=parseInt(data.per_page)||10;
		data.source_id=parseInt(data.source_id)||0;
		if(!data.source_id){ layer.msg('请选择数据源'); return false; }

		if(data.schedule_type === 'daily'){
			var dh=parseInt($('input[name=daily_hour]').val());
			var dm=parseInt($('input[name=daily_minute]').val());
			if(isNaN(dh)||dh<0||dh>23){ layer.msg('请输入有效的小时(0-23)'); return false; }
			if(isNaN(dm)||dm<0||dm>59){ layer.msg('请输入有效的分钟(0-59)'); return false; }
			data.cron_expression=dm+' '+dh+' 0 0 0';
			data.sch_year=0;
		} else {
			var sch_year=parseInt($('input[name=sch_year]').val());
			var sch_month=parseInt($('input[name=sch_month]').val());
			var sch_day=parseInt($('input[name=sch_day]').val());
			var sch_hour=parseInt($('input[name=sch_hour]').val());
			var sch_minute=parseInt($('input[name=sch_minute]').val());
			if(isNaN(sch_year)||sch_year<2026||sch_year>2099){ layer.msg('请输入有效的年份(2026-2099)'); return false; }
			if(isNaN(sch_month)||sch_month<1||sch_month>12){ layer.msg('请输入有效的月份(1-12)'); return false; }
			if(isNaN(sch_day)||sch_day<1||sch_day>31){ layer.msg('请输入有效的日期(1-31)'); return false; }
			if(isNaN(sch_hour)||sch_hour<0||sch_hour>23){ layer.msg('请输入有效的小时(0-23)'); return false; }
			if(isNaN(sch_minute)||sch_minute<0||sch_minute>59){ layer.msg('请输入有效的分钟(0-59)'); return false; }
			data.cron_expression=sch_minute+' '+sch_hour+' '+sch_day+' '+sch_month+' *';
		}
		data._xsrf=getCsrfToken();
		var act=data.id?'edit':'add';
		$.post('/user/outlook/schedule/api?action='+act,data,function(r){
			if(r.code===0){ layer.msg(r.msg); layer.close(layerIdx); loadList(currentPage); }else{ layer.msg(r.msg); }
		}).fail(function(xhr,status,err){
			layer.msg('请求失败: '+status+(xhr.status?' ('+xhr.status+')':''));
		});
		return false;
	});
});
</script>
{% end %}
