{% extends "layout.html" %}
{% block body %}
<script>document.documentElement.setAttribute('data-theme','dark');document.documentElement.style.colorScheme='dark';document.querySelector('meta[name="color-scheme"]')&&document.querySelector('meta[name="color-scheme"]').setAttribute('content','dark');</script>
<style>
@keyframes gradientMove{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes borderPulse{0%,100%{box-shadow:0 0 0 rgba(0,212,255,0)}50%{box-shadow:0 0 20px rgba(0,212,255,.15)}}
@keyframes lineGlow{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

.outlook-page{
    background:#0a0e1a;
    min-height:100vh;
    padding:32px 24px 60px;
    position:relative;
}
.outlook-page::before{
    content:'';position:fixed;top:0;left:0;right:0;bottom:0;
    background:
        radial-gradient(ellipse at 20% 20%,rgba(0,212,255,.06) 0%,transparent 50%),
        radial-gradient(ellipse at 80% 80%,rgba(123,47,247,.06) 0%,transparent 50%);
    pointer-events:none;z-index:0;
}

.outlook-inner{
    max-width:1100px;margin:0 auto;position:relative;z-index:1;
}

/* 页面标题 */
.page-title-bar{
    display:flex;align-items:center;gap:16px;
    margin-bottom:40px;padding-bottom:24px;
    border-bottom:1px solid rgba(255,255,255,.06);
}
.page-title-icon{
    width:48px;height:48px;border-radius:12px;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(0,212,255,.3);
    animation:borderPulse 3s ease-in-out infinite;
}
.page-title-icon i{font-size:22px;color:#fff}
.page-title-text h1{
    font-size:24px;font-weight:700;color:#fff;margin:0;letter-spacing:2px;
}
.page-title-text p{
    font-size:12px;color:rgba(255,255,255,.35);margin:4px 0 0;letter-spacing:1px;
}

/* 通用深色卡片 */
.dark-card{
    background:linear-gradient(180deg,#111827,#0f1525);
    border:1px solid rgba(255,255,255,.07);
    border-radius:12px;
    padding:28px 24px;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
}
.dark-card::before{
    content:'';position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,transparent,#00d4ff,#7b2ff7,transparent);
}
.dark-card::after{
    content:'';position:absolute;top:0;left:0;
    width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(0,212,255,.02),transparent);
    transform:translateX(-100%);
    animation:shimmer 8s linear infinite;
    pointer-events:none;
}

.card-heading{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:22px;
}
.card-heading h2{
    font-size:16px;font-weight:600;color:#fff;margin:0;
    display:flex;align-items:center;gap:10px;
}
.card-heading h2 .accent-dot{
    width:8px;height:8px;border-radius:50%;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    box-shadow:0 0 8px rgba(0,212,255,.4);
}

/* 搜索栏 */
.search-bar{
    display:flex;gap:0;margin-bottom:20px;
}
.search-bar input{
    flex:1;height:48px;padding:0 18px;
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
    border-right:none;
    border-radius:10px 0 0 10px;
    color:#fff;font-size:15px;outline:none;transition:all .3s;
}
.search-bar input:focus{
    background:rgba(255,255,255,.06);
    border-color:rgba(0,212,255,.35);
}
.search-bar input::placeholder{color:rgba(255,255,255,.25)}
.search-bar button{
    height:48px;padding:0 24px;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    border:none;border-radius:0 10px 10px 0;
    color:#fff;font-size:14px;font-weight:600;letter-spacing:2px;
    cursor:pointer;transition:all .3s;white-space:nowrap;
}
.search-bar button:hover{box-shadow:0 4px 16px rgba(0,212,255,.3)}

/* 源标签选择 */
.source-chips-label{
    font-size:11px;color:rgba(255,255,255,.3);letter-spacing:2px;
    text-transform:uppercase;margin-bottom:10px;
}
.source-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.source-chip{
    display:flex;align-items:center;gap:8px;
    padding:7px 14px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    border-radius:8px;cursor:pointer;transition:all .3s;
    user-select:none;
}
.source-chip:hover{border-color:rgba(0,212,255,.2)}
.source-chip.active{
    border-color:rgba(0,212,255,.4);
    background:rgba(0,212,255,.08);
    box-shadow:0 0 12px rgba(0,212,255,.1);
}
.source-chip .chip-icon{
    width:22px;height:22px;border-radius:6px;
    background:linear-gradient(135deg,rgba(0,212,255,.15),rgba(123,47,247,.15));
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:#00d4ff;font-weight:700;
}
.source-chip .chip-name{font-size:12px;color:#fff}
.source-chip input{display:none}

/* 参数行 */
.param-row{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.param-box{
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    border-radius:8px;
}
.param-box label{font-size:12px;color:rgba(255,255,255,.4)}
.param-box input[type="number"]{
    width:64px;height:28px;
    background:rgba(0,0,0,.3);
    border:1px solid rgba(255,255,255,.08);
    border-radius:6px;color:#fff;font-size:13px;
    padding:0 6px;outline:none;text-align:center;
}
.param-box input[type="number"]:focus{border-color:rgba(0,212,255,.4)}

/* AI开关 */
.ai-switches{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.ai-switch{
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.06);
    border-radius:8px;
}
.ai-switch .sw-name{font-size:12px;color:#fff}
.ai-switch .sw-desc{font-size:10px;color:rgba(255,255,255,.3)}
.toggle{position:relative;width:36px;height:18px}
.toggle input{opacity:0;width:0;height:0}
.toggle .track{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background:rgba(255,255,255,.08);border-radius:22px;cursor:pointer;transition:.3s;
}
.toggle .track::before{
    content:'';position:absolute;height:12px;width:12px;
    left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;
}
.toggle input:checked+.track{
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    box-shadow:0 0 8px rgba(0,212,255,.3);
}
.toggle input:checked+.track::before{transform:translateX(18px)}

/* 采集按钮 */
.start-btn{
    width:100%;height:46px;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    color:#fff;border:none;border-radius:10px;
    font-size:14px;font-weight:600;letter-spacing:3px;
    cursor:pointer;transition:all .3s;
}
.start-btn:hover{box-shadow:0 6px 20px rgba(0,212,255,.3);transform:translateY(-1px)}
.start-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}

/* 加载与结果 */
.loading-area{display:none;justify-content:center;gap:6px;margin-top:16px}
.loading-area.active{display:flex}
.loading-area span{
    width:6px;height:6px;background:#00d4ff;border-radius:50%;
    animation:float .7s ease-in-out infinite;
}
.loading-area span:nth-child(2){animation-delay:.12s;background:#7b2ff7}
.loading-area span:nth-child(3){animation-delay:.24s;background:#ff0080}

.result-bar{
    margin-top:16px;padding:16px;
    background:rgba(0,212,255,.04);
    border:1px solid rgba(0,212,255,.1);
    border-radius:10px;text-align:center;display:none;
}
.result-bar.active{display:block}
.result-bar .num{
    font-size:28px;font-weight:800;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.result-bar .label{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px}

/* 分隔 */
.section-gap{height:28px;display:flex;align-items:center;justify-content:center}
.section-gap .gap-line{
    width:60%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(0,212,255,.15),transparent);
}

/* 新增按钮 */
.btn-new{
    height:34px;padding:0 16px;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    color:#fff;border:none;border-radius:8px;
    font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;
    transition:all .3s;
}
.btn-new:hover{box-shadow:0 4px 14px rgba(0,212,255,.25);transform:translateY(-1px)}

/* 数据源列表 */
.src-list{display:flex;flex-direction:column;gap:8px}

.src-item{
    display:flex;align-items:center;gap:16px;
    padding:16px 18px;
    background:rgba(255,255,255,.02);
    border:1px solid rgba(255,255,255,.05);
    border-radius:10px;
    transition:all .3s;
    position:relative;
}
.src-item::before{
    content:'';position:absolute;left:0;top:15%;bottom:15%;width:2px;
    background:linear-gradient(180deg,#00d4ff,#7b2ff7);
    opacity:0;transition:.3s;border-radius:1px;
}
.src-item:hover{
    border-color:rgba(0,212,255,.15);
    background:rgba(0,212,255,.03);
}
.src-item:hover::before{opacity:1}

.src-item .src-handle{
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    color:rgba(255,255,255,.12);cursor:grab;flex-shrink:0;
}
.src-item .src-handle i{font-size:16px}

.src-item .src-avatar{
    width:40px;height:40px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(123,47,247,.12));
    border:1px solid rgba(0,212,255,.1);
    display:flex;align-items:center;justify-content:center;
    font-size:16px;color:#00d4ff;font-weight:700;
}

.src-item .src-body{flex:1;min-width:0}
.src-item .src-name{
    font-size:15px;font-weight:600;color:#fff;margin-bottom:4px;
    display:flex;align-items:center;gap:8px;
}
.src-item .src-name .tag-code{
    font-size:10px;font-weight:400;
    color:rgba(0,212,255,.6);
    background:rgba(0,212,255,.08);
    padding:1px 8px;border-radius:4px;letter-spacing:.5px;
}
.src-item .src-url{
    font-family:'SF Mono','Cascadia Code',Consolas,monospace;
    font-size:11px;color:rgba(255,255,255,.28);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    max-width:420px;
}

.src-item .src-badges{display:flex;gap:6px;align-items:center;flex-shrink:0}
.badge{
    font-size:10px;padding:3px 8px;border-radius:6px;
    background:rgba(0,212,255,.06);color:rgba(0,212,255,.6);
    border:1px solid rgba(0,212,255,.08);
}
.badge.green{background:rgba(82,196,86,.06);color:#52c41a;border-color:rgba(82,196,86,.1)}
.badge.red{background:rgba(255,77,79,.06);color:#ff4d4f;border-color:rgba(255,77,79,.1)}

.src-item .src-ops{display:flex;gap:6px;flex-shrink:0}
.op-btn{
    width:32px;height:32px;border-radius:8px;
    border:1px solid rgba(255,255,255,.06);
    background:rgba(255,255,255,.02);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;transition:all .3s;
    color:rgba(255,255,255,.3);
}
.op-btn:hover{border-color:rgba(0,212,255,.25);background:rgba(0,212,255,.06);color:#00d4ff}
.op-btn.danger:hover{border-color:rgba(255,77,79,.25);background:rgba(255,77,79,.06);color:#ff4d4f}
.op-btn i{font-size:15px}

.empty-state{text-align:center;padding:48px 20px}
.empty-state i{font-size:40px;color:rgba(255,255,255,.08);display:block;margin-bottom:8px}
.empty-state p{font-size:13px;color:rgba(255,255,255,.25)}

/* 弹窗 */
.dark-layer{background:rgba(0,0,0,.75)!important}
.dark-layer .layui-layer-content{background:#111827!important;color:#fff!important}
</style>

<div class="outlook-page">
    <div class="outlook-inner">
        <!-- 标题 -->
        <div class="page-title-bar">
            <div class="page-title-icon"><i class="layui-icon layui-icon-read"></i></div>
            <div class="page-title-text">
                <h1>瞭望管理</h1>
                <p>AI 智能数据采集引擎</p>
            </div>
        </div>

        <!-- 采集区 -->
        <div class="dark-card">
            <div class="card-heading">
                <h2><span class="accent-dot"></span>数据采集</h2>
            </div>

            <div class="search-bar">
                <input type="text" id="keyword" placeholder="输入采集关键字" onkeypress="if(event.keyCode==13)startCollect()">
                <button onclick="startCollect()">开始采集</button>
            </div>

            <div class="source-chips-label">选择采集源</div>
            <div class="source-chips" id="sourcesMiniList"></div>

            <div class="param-row">
                <div class="param-box">
                    <label>页数</label>
                    <input type="number" id="pages" value="1" min="1" max="100">
                </div>
                <div class="param-box">
                    <label>分页步长</label>
                    <input type="number" id="pageSizeStep" value="10" min="1" max="500">
                </div>
            </div>

            <div class="ai-switches">
                <div class="ai-switch">
                    <label class="toggle">
                        <input type="checkbox" id="aiExpand">
                        <span class="track"></span>
                    </label>
                    <div>
                        <div class="sw-name">AI 关键词扩展</div>
                        <div class="sw-desc">大模型生成相关搜索词</div>
                    </div>
                </div>
                <div class="ai-switch">
                    <label class="toggle">
                        <input type="checkbox" id="aiClean">
                        <span class="track"></span>
                    </label>
                    <div>
                        <div class="sw-name">AI 数据清洗</div>
                        <div class="sw-desc">智能过滤噪声信息</div>
                    </div>
                </div>
            </div>

            <button class="start-btn" id="btnCollect" onclick="startCollect()">开始采集</button>
            <div class="loading-area" id="loadingWrap"><span></span><span></span><span></span></div>
            <div class="result-bar" id="resultPanel">
                <div class="num" id="resultCount">0</div>
                <div class="label">条数据已采集</div>
            </div>
        </div>

        <!-- 分隔 -->
        <div class="section-gap"><div class="gap-line"></div></div>

        <!-- 采集源管理 -->
        <div class="dark-card">
            <div class="card-heading">
                <h2><span class="accent-dot"></span>采集源管理</h2>
                <button class="btn-new" id="btnAddSource"><i class="layui-icon layui-icon-addition"></i> 新增</button>
            </div>
            <div class="src-list" id="sourceList"></div>
        </div>
    </div>
</div>

{% end %}

{% block extra_script %}
<script>
var allSources = [];

function getCsrfToken(){
    var cookies = document.cookie.split(';');
    for(var i=0;i<cookies.length;i++){
        var c = cookies[i].trim();
        if(c.indexOf('_xsrf=') === 0) return decodeURIComponent(c.substring(6));
    }
    return '';
}

layui.use(['layer','form'], function(){
    var layer = layui.layer;
    var form = layui.form;
    var $ = layui.$;

    function loadSources(){
        $.get('/user/outlook/sources/api', function(res){
            if(res.code === 0){
                allSources = res.data;
                renderSourcesMini();
                renderSourceList();
            }
        });
    }

    function renderSourcesMini(){
        var html = '';
        allSources.forEach(function(s){
            html += '<div class="source-chip" data-id="' + s.id + '" data-step="' + (s.page_size_step||10) + '">' +
                '<input type="checkbox" class="mini-check" value="' + s.id + '">' +
                '<div class="chip-icon">' + (s.name||'?')[0] + '</div>' +
                '<div class="chip-name">' + escapeHtml(s.name) + '</div>' +
            '</div>';
        });
        $('#sourcesMiniList').html(html);
    }

    function renderSourceList(){
        var html = '';
        if(allSources.length === 0){
            html = '<div class="empty-state"><i class="layui-icon layui-icon-face-surprised"></i><p>暂无采集源</p></div>';
        } else {
            allSources.forEach(function(s){
                var statusHtml = s.status == 1
                    ? '<span class="badge green">启用</span>'
                    : '<span class="badge red">禁用</span>';
                var tags = '';
                if(s.ai_expand_keyword) tags += '<span class="badge">AI扩词</span>';
                if(s.ai_clean_data) tags += '<span class="badge">AI清洗</span>';

                html += '<div class="src-item" data-id="' + s.id + '">' +
                    '<div class="src-handle"><i class="layui-icon layui-icon-diamond"></i></div>' +
                    '<div class="src-avatar">' + (s.name||'?')[0] + '</div>' +
                    '<div class="src-body">' +
                        '<div class="src-name">' +
                            '<span>' + escapeHtml(s.name) + '</span>' +
                            '<span class="tag-code">' + escapeHtml(s.code) + '</span>' +
                        '</div>' +
                        '<div class="src-url">' + escapeHtml(s.entry_url||'') + '</div>' +
                    '</div>' +
                    '<div class="src-badges">' + tags + statusHtml + '</div>' +
                    '<div class="src-ops">' +
                        '<div class="op-btn" onclick="editSource(' + s.id + ')" title="编辑"><i class="layui-icon layui-icon-edit"></i></div>' +
                        '<div class="op-btn danger" onclick="deleteSource(' + s.id + ')" title="删除"><i class="layui-icon layui-icon-delete"></i></div>' +
                    '</div>' +
                '</div>';
            });
        }
        $('#sourceList').html(html);
    }

    function escapeHtml(text){
        if(!text) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    $('#sourcesMiniList').on('click', '.source-chip', function(e){
        if(e.target.tagName !== 'INPUT'){
            var cb = $(this).find('.mini-check');
            cb.prop('checked', !cb.prop('checked'));
            $(this).toggleClass('active', cb.prop('checked'));
            if(cb.prop('checked')){
                var step = $(this).data('step');
                if(step) $('#pageSizeStep').val(step);
            }
        }
    });

    $('#btnAddSource').on('click', function(){ showSourceForm(); });

    window.editSource = function(id){
        var s = null;
        for(var i=0;i<allSources.length;i++){
            if(allSources[i].id == id){ s = allSources[i]; break; }
        }
        showSourceForm(s);
    };

    window.deleteSource = function(id){
        layer.confirm('确定要删除该采集源吗？', {skin:'dark-layer'}, function(index){
            $.post('/user/outlook/sources/delete', {id: id, _xsrf: getCsrfToken()}, function(res){
                if(res.code === 0){ layer.msg('删除成功', {icon:1}); loadSources(); }
                else { layer.msg(res.msg, {icon:2}); }
            });
            layer.close(index);
        });
    };

    window.showSourceForm = showSourceForm;
    function showSourceForm(s){
        s = s || {};
        var isEdit = !!s.id;
        var headers = s.request_headers || s.headers || '';
        try{ headers = JSON.stringify(JSON.parse(headers), null, 2); } catch(e){}

        var html = '<form class="layui-form" id="sourceForm" style="padding:16px;max-height:65vh;overflow-y:auto;">' +
            '<input type="hidden" name="_xsrf" value="' + getCsrfToken() + '">' +
            (isEdit ? '<input type="hidden" name="id" value="' + s.id + '">' : '') +
            '<fieldset class="layui-elem-field layui-field-title"><legend>基本配置</legend></fieldset>' +
            '<div class="layui-form-item"><label class="layui-form-label">名称</label><div class="layui-input-block"><input type="text" name="name" value="' + escapeHtml(s.name||'') + '" class="layui-input" required placeholder="如：百度新闻"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">编码</label><div class="layui-input-block"><input type="text" name="code" value="' + escapeHtml(s.code||'') + '" class="layui-input" required placeholder="如：baidu_news"' + (isEdit ? ' readonly style="background:#f5f5f5;"' : '') + '></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">入口URL</label><div class="layui-input-block"><input type="text" name="entry_url" value="' + escapeHtml(s.entry_url||'') + '" class="layui-input" required placeholder="支持{keyword}和{page}参数占位符"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">请求方法</label><div class="layui-input-block"><input type="radio" name="method" value="GET" title="GET" ' + ((s.method||'GET')!=='POST'?'checked':'') + '><input type="radio" name="method" value="POST" title="POST" ' + ((s.method||'GET')==='POST'?'checked':'') + '></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">请求头</label><div class="layui-input-block"><textarea name="request_headers" class="layui-textarea" rows="4" placeholder="JSON格式">' + escapeHtml(headers) + '</textarea></div></div>' +
            '<fieldset class="layui-elem-field layui-field-title" style="margin-top:16px;"><legend>HTML解析规则</legend></fieldset>' +
            '<div class="layui-form-item"><label class="layui-form-label">容器选择器</label><div class="layui-input-block"><input type="text" name="html_selector" value="' + escapeHtml(s.html_selector||'') + '" class="layui-input" placeholder="如：div.result"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">标题选择器</label><div class="layui-input-block"><input type="text" name="title_selector" value="' + escapeHtml(s.title_selector||'') + '" class="layui-input" placeholder="如：h3"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">链接选择器</label><div class="layui-input-block"><input type="text" name="url_selector" value="' + escapeHtml(s.url_selector||'') + '" class="layui-input" placeholder="如：h3 a"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">内容选择器</label><div class="layui-input-block"><input type="text" name="content_selector" value="' + escapeHtml(s.content_selector||'') + '" class="layui-input" placeholder="如：div.content"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">日期选择器</label><div class="layui-input-block"><input type="text" name="date_selector" value="' + escapeHtml(s.date_selector||'') + '" class="layui-input" placeholder="如：span.c-color-gray2"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">作者选择器</label><div class="layui-input-block"><input type="text" name="author_selector" value="' + escapeHtml(s.author_selector||'') + '" class="layui-input" placeholder="如：span.author"></div></div>' +
            '<fieldset class="layui-elem-field layui-field-title" style="margin-top:16px;"><legend>采集参数</legend></fieldset>' +
            '<div class="layui-form-item"><label class="layui-form-label">页面起始值</label><div class="layui-input-block"><input type="number" name="page_start" value="' + (s.page_start!=null?s.page_start:0) + '" class="layui-input"></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">分页步长</label><div class="layui-input-block"><input type="number" name="page_size_step" value="' + (s.page_size_step||10) + '" class="layui-input"></div></div>' +
            '<fieldset class="layui-elem-field layui-field-title" style="margin-top:16px;"><legend>AI配置</legend></fieldset>' +
            '<div class="layui-form-item"><label class="layui-form-label">AI扩词</label><div class="layui-input-block"><input type="checkbox" name="ai_expand_keyword" lay-skin="switch" lay-text="ON|OFF" ' + (s.ai_expand_keyword?'checked':'') + '></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">扩词Prompt</label><div class="layui-input-block"><textarea name="ai_expand_prompt" class="layui-textarea" rows="3" placeholder="留空则使用默认模板">' + escapeHtml(s.ai_expand_prompt||'') + '</textarea></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">AI清洗</label><div class="layui-input-block"><input type="checkbox" name="ai_clean_data" lay-skin="switch" lay-text="ON|OFF" ' + (s.ai_clean_data?'checked':'') + '></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">清洗Prompt</label><div class="layui-input-block"><textarea name="ai_clean_prompt" class="layui-textarea" rows="3" placeholder="留空则使用默认模板">' + escapeHtml(s.ai_clean_prompt||'') + '</textarea></div></div>' +
            '<fieldset class="layui-elem-field layui-field-title" style="margin-top:16px;"><legend>其他</legend></fieldset>' +
            '<div class="layui-form-item"><label class="layui-form-label">状态</label><div class="layui-input-block"><input type="radio" name="status" value="1" title="启用" ' + ((s.status||1)!=0?'checked':'') + '><input type="radio" name="status" value="0" title="禁用" ' + ((s.status||1)==0?'checked':'') + '></div></div>' +
            '<div class="layui-form-item"><label class="layui-form-label">描述</label><div class="layui-input-block"><textarea name="description" class="layui-textarea" rows="2" placeholder="采集源说明">' + escapeHtml(s.description||'') + '</textarea></div></div>' +
            '<div class="layui-form-item" style="margin-top:20px;text-align:center;">' +
                '<button type="button" class="layui-btn" style="background:linear-gradient(135deg,#00d4ff,#7b2ff7);border:none;" lay-submit lay-filter="submitSource">确 定</button>' +
            '</div>' +
        '</form>';

        layer.open({
            type: 1,
            title: isEdit ? '编辑采集源' : '新增采集源',
            area: ['700px', '80%'],
            content: html,
            success: function(){
                form.render();
                form.on('submit(submitSource)', function(data){
                    var url = isEdit ? '/user/outlook/sources/edit' : '/user/outlook/sources/add';
                    $.post(url, data.field, function(res){
                        if(res.code === 0){ layer.msg(res.msg, {icon:1}); layer.closeAll(); loadSources(); }
                        else { layer.msg(res.msg, {icon:2}); }
                    });
                    return false;
                });
            }
        });
    }

    window.startCollect = function(){
        var keyword = $.trim($('#keyword').val());
        if(!keyword){ layer.msg('请输入采集关键词', {icon:0}); return; }

        var selectedSources = [];
        $('.mini-check:checked').each(function(){ selectedSources.push($(this).val()); });
        if(selectedSources.length === 0){ layer.msg('请至少选择一个采集源', {icon:0}); return; }

        var pages = parseInt($('#pages').val()) || 1;
        var pageSizeStep = parseInt($('#pageSizeStep').val()) || 0;
        var aiExpand = $('#aiExpand').prop('checked') ? '1' : '0';
        var aiClean = $('#aiClean').prop('checked') ? '1' : '0';

        $('#btnCollect').prop('disabled', true).text('采集中...');
        $('#loadingWrap').addClass('active');
        $('#resultPanel').removeClass('active');

        var allCount = 0;
        var idx = 0;

        function collectNext(){
            if(idx >= selectedSources.length){
                $('#btnCollect').prop('disabled', false).text('开始采集');
                $('#loadingWrap').removeClass('active');
                $('#resultCount').text(allCount);
                $('#resultPanel').addClass('active');
                layer.msg('采集完成，共获取 ' + allCount + ' 条数据', {icon:1});
                return;
            }
            var sid = selectedSources[idx];
            idx++;
            $.ajax({
                url: '/user/outlook/collect/do',
                type: 'POST',
                data: {
                    source_id: sid, keyword: keyword, pages: pages,
                    page_size_step: pageSizeStep, ai_expand: aiExpand, ai_clean: aiClean,
                    _xsrf: getCsrfToken()
                },
                timeout: 300000,
                success: function(res){
                    if(res.code === 0){
                        allCount += res.count || 0;
                        $('#resultCount').text(allCount);
                        layer.msg('采集源完成: ' + (res.count||0) + ' 条', {icon:1});
                    } else {
                        layer.msg('采集源失败: ' + res.msg, {icon:2});
                    }
                    collectNext();
                },
                error: function(){ layer.msg('网络错误', {icon:2}); collectNext(); }
            });
        }
        collectNext();
    };

    loadSources();
});
</script>
{% end %}
