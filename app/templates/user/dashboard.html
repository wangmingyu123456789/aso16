<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数智大屏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory;overflow-y:scroll;height:100vh;}
body{background:#070b1a;color:#fff;font-family:'Microsoft YaHei',sans-serif;}

.full-page{width:100%;height:100vh;scroll-snap-align:start;position:relative;overflow:hidden;}

.page-dashboard{background:linear-gradient(180deg,#070b1a 0%,#0a0e27 40%,#0d1235 100%);}
.dashboard-wrap{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto 1fr 1fr;gap:12px;padding:12px 16px;height:100vh;max-width:1600px;margin:0 auto;}
.dash-header{grid-column:1/-1;text-align:center;padding:8px 0 4px;font-size:26px;font-weight:700;letter-spacing:6px;background:linear-gradient(135deg,#1890ff,#52c41a,#faad14);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.dash-header .sub{font-size:11px;letter-spacing:3px;color:#445;display:block;margin-top:2px;}

.stats-row{grid-column:1/-1;display:flex;gap:12px;padding:0;}
.stat-item{flex:1;min-width:100px;text-align:center;background:rgba(24,144,255,.06);border:1px solid rgba(24,144,255,.12);border-radius:10px;padding:14px 8px;transition:all .3s;}
.stat-item:hover{border-color:rgba(24,144,255,.35);box-shadow:0 0 20px rgba(24,144,255,.1);}
.stat-item .num{font-size:38px;font-weight:bold;color:#1890ff;line-height:1.1;}
.stat-item .num.green{color:#52c41a;}
.stat-item .num.orange{color:#faad14;}
.stat-item .num.purple{color:#a855f7;}
.stat-item .label{font-size:11px;color:#556;margin-top:6px;letter-spacing:1px;}

.chart-box{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:10px;padding:10px;position:relative;overflow:hidden;min-height:0;}
.chart-box::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(24,144,255,.2),transparent);}
.chart-box .chart-title{font-size:12px;color:#556;margin-bottom:6px;letter-spacing:2px;padding-left:4px;}
.chart-container{width:100%;height:calc(100% - 24px);min-height:120px;}

#chartRecent{overflow-y:auto;padding:6px 8px;color:#8899bb;font-size:12px;line-height:1.6;}
#chartRecent::-webkit-scrollbar{width:4px;}
#chartRecent::-webkit-scrollbar-track{background:rgba(255,255,255,.02);border-radius:2px;}
#chartRecent::-webkit-scrollbar-thumb{background:rgba(24,144,255,.3);border-radius:2px;}
#chartRecent::-webkit-scrollbar-thumb:hover{background:rgba(24,144,255,.5);}

.recent-item{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04);transition:all .2s;border-radius:4px;}
.recent-item:hover{background:rgba(24,144,255,.06);}
.recent-item .recent-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px;color:#aab;}
.recent-item .recent-time{font-size:10px;color:#556;white-space:nowrap;}
.recent-empty{text-align:center;color:#445;padding:30px;font-size:13px;}

.refresh-bar{position:absolute;top:0;left:0;right:0;height:3px;z-index:10;}
.refresh-bar::after{content:'';display:block;width:100%;height:100%;background:linear-gradient(90deg,#1890ff,#52c41a);transform:scaleX(0);transform-origin:left;transition:transform .5s ease;}

.page-earth{background:radial-gradient(ellipse at center,#0a1030 0%,#060a18 50%,#020408 100%);}
#earthCanvas{width:100%;height:100%;display:block;}
.earth-hint{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.25);font-size:12px;letter-spacing:3px;z-index:10;pointer-events:none;animation:pulse-hint 2s ease-in-out infinite;}
@keyframes pulse-hint{0%,100%{opacity:.2}50%{opacity:.45}}

.page-nav{position:fixed;right:20px;top:50%;transform:translateY(-50%);z-index:100;display:flex;flex-direction:column;gap:12px;}
.page-nav .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .3s;border:1px solid rgba(255,255,255,.1);}
.page-nav .dot.active{background:#1890ff;box-shadow:0 0 12px rgba(24,144,255,.5);transform:scale(1.3);}
.page-nav .dot:hover{background:rgba(255,255,255,.4);}

.back-btn{position:fixed;top:16px;left:16px;z-index:200;display:flex;align-items:center;gap:6px;padding:8px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:8px;color:rgba(255,255,255,.6);font-size:13px;cursor:pointer;text-decoration:none;transition:all .3s;backdrop-filter:blur(8px);}
.back-btn:hover{background:rgba(24,144,255,.15);border-color:rgba(24,144,255,.3);color:#fff;}
.back-btn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;}

/* 词云页 */
.page-wordcloud{background:linear-gradient(180deg,#070b1a 0%,#0d1035 50%,#070b1a 100%);}
.page-wordcloud::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 30% 50%,rgba(24,144,255,.06) 0%,transparent 60%),radial-gradient(ellipse at 70% 20%,rgba(123,47,247,.06) 0%,transparent 60%),radial-gradient(ellipse at 50% 80%,rgba(82,196,26,.04) 0%,transparent 50%);z-index:0;pointer-events:none;}
.wordcloud-inner{position:relative;z-index:1;width:100%;height:100vh;display:flex;flex-direction:column;padding:0;}
.wordcloud-header{text-align:center;padding:28px 0 0;flex-shrink:0;}
.wordcloud-header h1{font-size:28px;font-weight:700;letter-spacing:6px;background:linear-gradient(135deg,#00d4ff,#7b2ff7,#00d4ff);background-size:200% 100%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:gradientShift 4s ease infinite;}
.wordcloud-header .sub{font-size:12px;color:rgba(255,255,255,.3);letter-spacing:3px;margin-top:4px;display:block;}
@keyframes gradientShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#wordcloudChart{flex:1;width:100%;min-height:0;}
.wordcloud-footer{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:16px;align-items:center;}
.wordcloud-footer .refresh-btn{padding:8px 20px;border-radius:20px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;transition:all .3s;backdrop-filter:blur(8px);}
.wordcloud-footer .refresh-btn:hover{background:rgba(24,144,255,.12);border-color:rgba(24,144,255,.3);color:#fff;}
.wordcloud-footer .hint{font-size:11px;color:rgba(255,255,255,.2);letter-spacing:1px;}

@media(max-width:900px){
	.dashboard-wrap{grid-template-columns:1fr;grid-template-rows:auto auto auto auto auto auto auto;}
	.chart-container{min-height:160px;}
	.stat-item .num{font-size:28px;}
}
</style>
<script src="/static/dist/echarts-5.5.0.min.js"></script>
<script src="/static/dist/echarts-wordcloud.min.js"></script>
</head>
<body>
{% include '../components/gesture_panel.html' %}
<a class="back-btn" href="/home">
	<svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>返回首页
</a>

<div class="page-nav">
	<div class="dot active" onclick="document.querySelector('.page-dashboard').scrollIntoView({behavior:'smooth'})" title="数据监控"></div>
	<div class="dot" onclick="document.querySelector('.page-wordcloud').scrollIntoView({behavior:'smooth'})" title="热点词云"></div>
	<div class="dot" onclick="document.querySelector('.page-earth').scrollIntoView({behavior:'smooth'})" title="3D地球"></div>
</div>

<div class="full-page page-dashboard">
	<div class="refresh-bar" id="refreshBar"></div>
	<div class="dashboard-wrap">
		<div class="dash-header">数智大屏<span class="sub">DATA INTELLIGENCE MONITORING CENTER</span></div>
		<div class="stats-row" id="statsRow">
			<div class="stat-item"><div class="num green">-</div><div class="label">今日采集</div></div>
			<div class="stat-item"><div class="num">-</div><div class="label">累计采集</div></div>
			<div class="stat-item"><div class="num purple">-</div><div class="label">数据源</div></div>
			<div class="stat-item"><div class="num orange">-</div><div class="label">任务数</div></div>
		</div>
		<div class="chart-box"><div class="chart-title">采集趋势（近7天）</div><div class="chart-container" id="chartTrend"></div></div>
		<div class="chart-box"><div class="chart-title">数据源分布</div><div class="chart-container" id="chartSource"></div></div>
		<div class="chart-box"><div class="chart-title">数据采集状态</div><div class="chart-container" id="chartStatus"></div></div>
		<div class="chart-box"><div class="chart-title">最新数据（每日23:00刷新）</div><div class="chart-container" id="chartRecent"></div></div>
	</div>
</div>

<div class="full-page page-wordcloud">
	<div class="wordcloud-inner">
		<div class="wordcloud-header">
			<h1>热点词云</h1>
			<span class="sub">HOT TOPIC WORD CLOUD</span>
		</div>
		<div id="wordcloudChart"></div>
	</div>
	<div class="wordcloud-footer">
		<button class="refresh-btn" onclick="window.refreshWordCloud()">🔄 刷新</button>
		<span class="hint">基于瞭望采集数据自动生成</span>
	</div>
</div>

<div class="full-page page-earth">
	<canvas id="earthCanvas"></canvas>
	<div class="earth-hint">拖拽旋转 · 滚轮缩放 · 右键平移</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
	var trendChart=null, sourceChart=null, statusChart=null;
	var wordcloudChart=null;

	function initCharts(){
		trendChart=echarts.init(document.getElementById('chartTrend'));
		sourceChart=echarts.init(document.getElementById('chartSource'));
		statusChart=echarts.init(document.getElementById('chartStatus'));

		function resizeAll(){
			trendChart&&trendChart.resize();
			sourceChart&&sourceChart.resize();
			statusChart&&statusChart.resize();
		}
		window.addEventListener('resize',resizeAll);
		setTimeout(resizeAll,300);
	}

	var dateLabels=[];
	for(var i=6;i>=0;i--){
		var d=new Date();d.setDate(d.getDate()-i);
		dateLabels.push((d.getMonth()+1)+'/'+d.getDate());
	}

	function setEmptyCharts(){
		if(!trendChart)return;
		trendChart.setOption({
			tooltip:{trigger:'axis'},
			grid:{left:'12%',right:'6%',top:'18%',bottom:'12%'},
			xAxis:{type:'category',data:dateLabels,axisLine:{lineStyle:{color:'#2a2a4a'}},axisLabel:{color:'#556',fontSize:10}},
			yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'#1a1a30'}},axisLabel:{color:'#556',fontSize:10}},
			series:[{type:'line',smooth:true,data:[0,0,0,0,0,0,0],lineStyle:{color:'#1890ff',width:2},itemStyle:{color:'#1890ff'},areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:'rgba(24,144,255,.35)'},{offset:1,color:'rgba(24,144,255,.02)'}])}}]
		});
		sourceChart.setOption({
			tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
			series:[{type:'pie',radius:['45%','72%'],center:['50%','55%'],label:{color:'#8899bb',fontSize:10},emphasis:{label:{fontSize:16,fontWeight:'bold'}},data:[{value:1,name:'加载中...',itemStyle:{color:'#1890ff'}}]}]
		});
		statusChart.setOption({
			tooltip:{trigger:'axis'},
			grid:{left:'14%',right:'8%',top:'15%',bottom:'12%'},
			xAxis:{type:'category',data:['成功','失败','处理中'],axisLabel:{color:'#667',fontSize:11},axisLine:{lineStyle:{color:'#2a2a4a'}}},
			yAxis:{type:'value',axisLine:{show:false},splitLine:{lineStyle:{color:'#1a1a30'}},axisLabel:{color:'#556',fontSize:10}},
			series:[{type:'bar',barWidth:'36%',data:[{value:0,itemStyle:{color:'#52c41a'}},{value:0,itemStyle:{color:'#ff4d4f'}},{value:0,itemStyle:{color:'#faad14'}}]}]
		});
	}

	function animateNumber(id,target){
		var el=document.getElementById(id);if(!el)return;
		var cur=parseInt(el.textContent)||0;
		var step=Math.max(1,Math.ceil(Math.abs(target-cur)/25));
		var timer=setInterval(function(){
			if(cur<target){cur+=step;if(cur>=target){cur=target;clearInterval(timer);}}
			else if(cur>target){cur-=step;if(cur<=target){cur=target;clearInterval(timer);}}
			else{clearInterval(timer);}
			el.textContent=cur.toLocaleString();
		},30);
	}

	function loadData(){
		fetch('/api/dashboard/stats').then(function(r){return r.json();}).then(function(res){
			if(res.code===0){
				var d=res.data;
				var nums=document.getElementById('statsRow').querySelectorAll('.num');
				if(nums.length>=4){
					nums[0].textContent=d.today_collect;
					nums[1].textContent=d.total_collect;
					nums[2].textContent=d.data_source;
					nums[3].textContent=d.total_tasks;
				}
				if(trendChart){
					var trendData=[0,0,0,0,0,0,0];trendData[6]=d.today_collect;
					trendChart.setOption({series:[{data:trendData}]});
				}
				if(sourceChart){
					sourceChart.setOption({series:[{data:[{value:Math.max(1,d.data_source),name:'活跃数据源',itemStyle:{color:'#1890ff'}},{value:Math.max(1,d.total_tasks),name:'采集任务',itemStyle:{color:'#a855f7'}}]}]});
				}
				if(statusChart){
					var failCount=d.fail_count||0;
					var processCount=d.process_count||0;
					statusChart.setOption({series:[{data:[{value:d.today_collect,itemStyle:{color:'#52c41a'}},{value:failCount,itemStyle:{color:'#ff4d4f'}},{value:processCount,itemStyle:{color:'#faad14'}}]}]});
				}
				if(d.recent&&d.recent.length){
					var html='';
					for(var i=0;i<d.recent.length;i++){
						var item=d.recent[i];
						html+='<div class="recent-item"><span class="recent-title" title="'+escapeHtml(item.title||'')+'">'+(item.title||'无标题')+'</span><span class="recent-time">'+formatTime(item.create_at)+'</span></div>';
					}
					document.getElementById('chartRecent').innerHTML=html;
				}else{
					document.getElementById('chartRecent').innerHTML='<div class="recent-empty">暂无数据</div>';
				}
				setTimeout(function(){
					if(window.SpeechManager&&window.SpeechManager.isEnabled()){
						window.SpeechManager.speak('数智大屏数据已更新，今日采集'+d.today_collect+'条，累计'+d.total_collect+'条');
					}
				},600);
			}
		}).catch(function(err){console.log('Dashboard stats fetch error:',err);});
	}

	function escapeHtml(text){var div=document.createElement('div');div.appendChild(document.createTextNode(text||''));return div.innerHTML;}
	function formatTime(t){if(!t||t.length<16)return t||'';return t.substring(5,16);}

	var lastRefreshDay=null;
	function checkDailyRefresh(){
		var now=new Date();
		var dayKey=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
		var hour=now.getHours();
		var minute=now.getMinutes();
		if(hour===23&&minute===0&&lastRefreshDay!==dayKey){
			lastRefreshDay=dayKey;
			document.getElementById('chartRecent').innerHTML='<div class="recent-empty" style="color:#faad14;">数据刷新中...</div>';
			var bar=document.getElementById('refreshBar');
			setTimeout(function(){bar.style.setProperty('--scale','0');},800);
			setTimeout(loadData,600);
		}
	}

	function initDashboard(){
		initCharts();
		setEmptyCharts();
		var now=new Date();
		lastRefreshDay=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
		loadData();
		var dashTimer=null;
		function startTimer(){
			if(dashTimer)clearInterval(dashTimer);
			dashTimer=setInterval(function(){
				loadData();
				checkDailyRefresh();
			},30000);
		}
		startTimer();
		document.addEventListener("visibilitychange",function(){
			if(document.hidden){if(dashTimer){clearInterval(dashTimer);dashTimer=null;}}
			else{if(!dashTimer){loadData();startTimer();}}
		});
		window.addEventListener("beforeunload",function(){if(dashTimer)clearInterval(dashTimer);});
	}
	setTimeout(initDashboard,200);

	function initWordCloud(){
 		var el=document.getElementById('wordcloudChart');
 		if(!el||typeof echarts==='undefined')return;
 		if(wordcloudChart){wordcloudChart.resize();return;}

 		wordcloudChart=echarts.init(el);
 		loadWordCloudData();
 	}

 	function loadWordCloudData(){
 		if(!wordcloudChart)return;
 		wordcloudChart.showLoading();
 		fetch('/api/wordcloud').then(function(r){return r.json();}).then(function(res){
 			wordcloudChart.hideLoading();
 			if(res.code!==0||!res.data||!res.data.length){
 				wordcloudChart.setOption({title:{text:'暂无词云数据，请先进行瞭望采集',textStyle:{color:'rgba(255,255,255,.3)'},left:'center',top:'center'}});
 				return;
 			}
 			var colors=['#00d4ff','#7b2ff7','#52c41a','#ff4d4f','#ffc107','#1890ff','#f5222d','#722ed1','#13c2c2','#fa8c16','#eb2f96','#00ff87','#ff6b6b','#4ecdc4','#ffe66d','#a29bfe'];
 			wordcloudChart.setOption({
  				tooltip:{show:true,formatter:function(p){return p.name+'：'+p.value+' 次';},backgroundColor:'rgba(0,0,0,.7)',borderColor:'rgba(24,144,255,.3)',borderWidth:1,textStyle:{color:'#fff',fontSize:13}},
  				series:[{
  					type:'wordCloud',shape:'circle',width:'92%',height:'88%',top:'center',left:'center',
  					sizeRange:[24,96],rotationRange:[-90,90],rotationStep:45,gridSize:12,drawOutOfBound:false,layoutAnimation:true,
  					textStyle:{color:function(){return colors[Math.floor(Math.random()*colors.length)];},fontFamily:'Microsoft YaHei',fontWeight:'bold'},
  					emphasis:{focus:'self',textStyle:{textShadowBlur:16,textShadowColor:'rgba(0,0,0,.5)'}},
 					data:res.data
 				}]
 			});
 			window.addEventListener('resize',function(){wordcloudChart&&wordcloudChart.resize();});
 		}).catch(function(err){wordcloudChart.hideLoading();console.error('词云加载失败:',err);});
 	}

 	window.refreshWordCloud=function(){
  		if(wordcloudChart){wordcloudChart.dispose();wordcloudChart=null;}
  		var el=document.getElementById('wordcloudChart');
  		if(el){wordcloudChart=echarts.init(el);}
  		loadWordCloudData();
  	};

 	initWordCloud();

	function initEarth(){
		var canvas=document.getElementById('earthCanvas');
		if(!canvas)return;

		var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
		renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
		renderer.setSize(window.innerWidth,window.innerHeight);
		renderer.shadowMap.enabled=true;
		renderer.shadowMap.type=THREE.PCFSoftShadowMap;

		var scene=new THREE.Scene();
		var camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,0.1,1000);
		camera.position.set(0,0.5,7);

		var hemiLight=new THREE.HemisphereLight(0x6677aa,0x1a1a33,0.8);
		scene.add(hemiLight);
		var ambientLight=new THREE.AmbientLight(0x333355,0.9);
		scene.add(ambientLight);
		var sunLight=new THREE.DirectionalLight(0xfffff0,1.5);
		sunLight.position.set(5,3,5);
		sunLight.castShadow=true;
		sunLight.shadow.mapSize.width=1024;
		sunLight.shadow.mapSize.height=1024;
		scene.add(sunLight);
		var fillLight=new THREE.DirectionalLight(0x6677aa,0.4);
		fillLight.position.set(-3,1,-3);
		scene.add(fillLight);

		var earthGroup=new THREE.Group();
		scene.add(earthGroup);

		var earthGeom=new THREE.SphereGeometry(2,64,64);
		var textureLoader=new THREE.TextureLoader();
		var earthMat=new THREE.MeshPhongMaterial({
			map:textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'),
			specularMap:textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'),
			specular:new THREE.Color(0x333333),
			shininess:5,
			normalMap:textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'),
			normalScale:new THREE.Vector2(0.8,0.8)
		});
		var earthMesh=new THREE.Mesh(earthGeom,earthMat);
		earthMesh.castShadow=true;
		earthMesh.receiveShadow=true;
		earthGroup.add(earthMesh);

		var cloudGeom=new THREE.SphereGeometry(2.03,64,64);
		var cloudMat=new THREE.MeshPhongMaterial({
			map:textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'),
			transparent:true,
			opacity:0.4,
			blending:THREE.AdditiveBlending,
			depthWrite:false
		});
		var cloudMesh=new THREE.Mesh(cloudGeom,cloudMat);
		cloudMesh.renderOrder=1;
		cloudMesh.material.depthTest=true;
		cloudMesh.material.depthWrite=false;
		earthGroup.add(cloudMesh);

		var glowGeom=new THREE.SphereGeometry(2.08,64,64);
		var glowMat=new THREE.ShaderMaterial({
			vertexShader:'varying vec3 vNormal;void main(){vNormal=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
			fragmentShader:'varying vec3 vNormal;void main(){float intensity=pow(0.65-dot(vNormal,vec3(0.0,0.0,1.0)),3.0);gl_FragColor=vec4(0.3,0.6,1.0,1.0)*intensity*0.35;}',
			blending:THREE.AdditiveBlending,
			side:THREE.FrontSide,
			transparent:true,
			depthWrite:false
		});
		var glowMesh=new THREE.Mesh(glowGeom,glowMat);
		glowMesh.renderOrder=2;
		glowMesh.material.depthTest=true;
		glowMesh.material.depthWrite=false;
		earthGroup.add(glowMesh);

		var starsGeom=new THREE.BufferGeometry();
		var starsCount=3000;
		var starsPositions=new Float32Array(starsCount*3);
		var starsColors=new Float32Array(starsCount*3);
		for(var i=0;i<starsCount*3;i+=3){
			var r=30+Math.random()*70;
			var theta=Math.random()*Math.PI*2;
			var phi=Math.acos(2*Math.random()-1);
			starsPositions[i]=r*Math.sin(phi)*Math.cos(theta);
			starsPositions[i+1]=r*Math.sin(phi)*Math.sin(theta);
			starsPositions[i+2]=r*Math.cos(phi);
			var bright=0.5+Math.random()*0.5;
			var tint=Math.random();
			if(tint<0.1){starsColors[i]=0.8;starsColors[i+1]=0.9;starsColors[i+2]=1.0;}
			else if(tint<0.2){starsColors[i]=1.0;starsColors[i+1]=0.85;starsColors[i+2]=0.7;}
			else{starsColors[i]=bright;starsColors[i+1]=bright;starsColors[i+2]=bright;}
		}
		starsGeom.setAttribute('position',new THREE.BufferAttribute(starsPositions,3));
		starsGeom.setAttribute('color',new THREE.BufferAttribute(starsColors,3));
		var starsMat=new THREE.PointsMaterial({size:0.15,vertexColors:true,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true,opacity:0.9});
		var starsPoints=new THREE.Points(starsGeom,starsMat);
		scene.add(starsPoints);

		var controls=new THREE.OrbitControls(camera,renderer.domElement);
		controls.enableDamping=true;
		controls.dampingFactor=0.08;
		controls.minDistance=3.5;
		controls.maxDistance=15;
		controls.target.set(0,0,0);
		controls.autoRotate=true;
		controls.autoRotateSpeed=0.3;
		controls.update();

		canvas.addEventListener('pointerdown',function(){controls.autoRotate=false;});
		canvas.addEventListener('pointerup',function(){setTimeout(function(){controls.autoRotate=true;},1500);});

		window.addEventListener('resize',function(){
			camera.aspect=window.innerWidth/window.innerHeight;
			camera.updateProjectionMatrix();
			renderer.setSize(window.innerWidth,window.innerHeight);
		});

		function animate(){
			requestAnimationFrame(animate);
			cloudMesh.rotation.y+=0.0003;
			starsPoints.rotation.y+=0.0001;
			starsPoints.rotation.x+=0.00005;
			controls.update();
			renderer.render(scene,camera);
		}
		animate();

		var touchTimeout;
		canvas.addEventListener('touchstart',function(){controls.autoRotate=false;if(touchTimeout)clearTimeout(touchTimeout);});
		canvas.addEventListener('touchend',function(){touchTimeout=setTimeout(function(){controls.autoRotate=true;},2000);});
	}

	setTimeout(initEarth,500);

	var pageNavDots=document.querySelectorAll('.page-nav .dot');
	function updateNav(){
		var scrollTop=document.documentElement.scrollTop||document.body.scrollTop;
		var vh=window.innerHeight;
		var idx=Math.round(scrollTop/vh);
		pageNavDots.forEach(function(d,i){d.classList.toggle('active',i===idx);});
	}
	window.addEventListener('scroll',updateNav);
	window.addEventListener('resize',updateNav);

})();
</script>
