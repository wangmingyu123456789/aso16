<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;background:#0a0e1a;color:#e0e0e0;height:100vh;overflow:hidden}
        .app{display:flex;height:100vh}

        /* === 左侧导航栏 === */
        .sidebar{width:260px;background:#0d1321;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);flex-shrink:0}
        .sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,0.06)}
        .sidebar-header .logo{font-size:18px;font-weight:700;color:#fff}

        .nav-list{flex:1;padding:16px 12px;overflow-y:auto}
        .nav-section-title{font-size:11px;color:rgba(255,255,255,0.3);text-transform:uppercase;letter-spacing:1px;padding:8px 12px;margin-bottom:4px}

        .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;cursor:pointer;margin-bottom:4px;transition:all .2s;font-size:14px;color:rgba(255,255,255,0.6);text-decoration:none}
        .nav-item:hover{background:rgba(255,255,255,0.04);color:#fff}
        .nav-item.active{background:rgba(123,47,247,0.1);color:#a78bfa}
        .nav-item .nav-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
        .nav-item .nav-icon.qa{background:rgba(0,212,255,0.15);color:#00d4ff}
        .nav-item .nav-icon.im{background:rgba(123,47,247,0.15);color:#a78bfa}
        .nav-item .nav-label{flex:1}
        .nav-item .nav-badge{font-size:11px;padding:2px 8px;border-radius:10px;background:rgba(255,77,79,0.2);color:#ff4d4f}

        .sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,0.06)}

        /* === 右侧内容区 === */
        .main{flex:1;display:flex;flex-direction:column;min-width:0}
        .content-header{padding:16px 24px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between;min-height:57px}
        .content-header h3{font-size:15px;color:#fff;font-weight:500}

        /* === 右上角用户区 === */
        .user-bar{display:flex;align-items:center;gap:12px}
        .user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#7b2ff7,#00d4ff);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;flex-shrink:0}
        .user-name{font-size:13px;color:rgba(255,255,255,0.7);font-weight:500}
        .user-divider{width:1px;height:16px;background:rgba(255,255,255,0.1)}
        .btn-logout{padding:6px 16px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;transition:all .2s;text-decoration:none;white-space:nowrap}
        .btn-logout:hover{background:rgba(255,77,79,0.1);border-color:rgba(255,77,79,0.3);color:#ff4d4f}

        .content-area{flex:1;display:flex;align-items:center;justify-content:center}
        .welcome-box{text-align:center;max-width:500px;padding:40px}
        .welcome-box .welcome-icon{font-size:48px;margin-bottom:16px;opacity:0.6}
        .welcome-box h2{font-size:22px;color:#fff;margin-bottom:8px}
        .welcome-box p{color:rgba(255,255,255,0.4);font-size:14px;line-height:1.6;margin-bottom:24px}
        .welcome-box .quick-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
        .welcome-box .quick-btn{padding:10px 20px;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.03);color:rgba(255,255,255,0.7);font-size:13px;cursor:pointer;transition:all .2s;text-decoration:none;display:flex;align-items:center;gap:6px}
        .welcome-box .quick-btn:hover{background:rgba(123,47,247,0.1);border-color:rgba(123,47,247,0.3);color:#a78bfa}

        /* Scrollbar */
        ::-webkit-scrollbar{width:6px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}
        ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.15)}
    </style>
</head>
<body>
<div class="app">
    <!-- 左侧导航栏 -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="logo">用户侧</div>
        </div>

        <div class="nav-list">
            <div class="nav-section-title">功能模块</div>

            <a href="/qa" class="nav-item" target="_blank">
                <div class="nav-icon qa">💬</div>
                <span class="nav-label">智能问数</span>
            </a>

            <a href="/im" class="nav-item" target="_blank">
                <div class="nav-icon im">👥</div>
                <span class="nav-label">智能聊天</span>
                <span class="nav-badge">即将上线</span>
            </a>
        </div>

        <div class="sidebar-footer"></div>
    </div>

    <!-- 右侧内容区 -->
    <div class="main">
        <div class="content-header">
            <h3>欢迎使用 cnAgentOS</h3>
            <div class="user-bar">
                <div class="user-avatar">{{ username[0] }}</div>
                <span class="user-name">{{ username }}</span>
                <div class="user-divider"></div>
                <a href="javascript:logout()" class="btn-logout">退出</a>
            </div>
        </div>
        <div class="content-area">
            <div class="welcome-box">
                <div class="welcome-icon">🚀</div>
                <h2>欢迎回来，{{ username }}</h2>
                <p>请选择左侧功能模块开始使用，或直接点击下方快捷入口</p>
                <div class="quick-actions">
                    <a href="/qa" class="quick-btn" target="_blank">💬 智能问数</a>
                    <a href="/im" class="quick-btn" target="_blank">👥 智能聊天</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function logout() {
    if (!confirm('确定要退出登录吗？')) return;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/auth/logout', true);
    xhr.onload = function() {
        window.location.href = '/auth/login';
    };
    xhr.send();
}
</script>
</body>
</html>
