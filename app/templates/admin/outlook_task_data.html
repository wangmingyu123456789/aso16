<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务数据详情</title>
    <link rel="stylesheet" href="/static/dist/layui-v2.13.6/layui-v2.13.6/layui/css/layui.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#0a0e1a;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
        /* 强制layui弹窗背景为深色 */
        .layui-layer{background:#0f1525 !important;}
        .layui-layer .layui-layer-content{background:#0f1525 !important;}
        .layui-layer .layui-layer-title{background:#111827 !important;color:#fff !important;border-bottom:1px solid rgba(255,255,255,.07) !important;}
        /* 关闭按钮（X）改为浅色 */
        .layui-layer .layui-layer-close{color:#fff !important;}
        .layui-layer .layui-layer-close i{color:#fff !important;}
        .layui-layer .layui-layer-close1{background:url(data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTYiIGhlaWdodD0iMTYiIHZpZXdCb3g9IjAgMCAxNiAxNiIgZmlsbD0ibm9uZSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48cGF0aCBkPSJNMyAzTDEzIDEzTTEzIDNMMyAxMyIgc3Ryb2tlPSIjZmZmIiBzdHJva2Utd2lkdGg9IjIiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCIvPjwvc3ZnPg==) no-repeat center !important;background-size:contain !important;}
        .task-info{background:linear-gradient(180deg,#111827,#0f1525);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:20px 24px;margin:16px;position:relative}
        .task-info::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00d4ff,#7b2ff7,transparent)}
        .task-info h3{color:#fff;font-size:18px;margin-bottom:12px}
        .task-info .info-row{display:flex;gap:24px;flex-wrap:wrap;margin-bottom:8px}
        .task-info .info-item{font-size:13px;color:rgba(255,255,255,.5)}
        .task-info .info-item strong{color:#fff;font-weight:500}
        .toolbar-bar{padding:12px 16px;display:flex;align-items:center;gap:12px}
        .btn-deep{background:linear-gradient(135deg,#7b2ff7,#00d4ff);border:none;color:#fff;padding:8px 20px;border-radius:8px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
        .btn-deep:hover{opacity:.85;transform:translateY(-1px)}
        .btn-deep:disabled{opacity:.4;cursor:not-allowed;transform:none}
        .selected-count{color:rgba(255,255,255,.5);font-size:13px}
        .selected-count strong{color:#00d4ff}
        /* 进度弹窗 */
        .deep-progress-dialog{background:#111827;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:0;overflow:hidden}
        .deep-progress-header{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.07);display:flex;justify-content:space-between;align-items:center}
        .deep-progress-header h4{color:#fff;font-size:15px}
        .deep-progress-body{padding:16px 20px;max-height:400px;overflow-y:auto}
        .progress-bar-container{background:rgba(255,255,255,.07);border-radius:8px;height:8px;margin-bottom:12px;overflow:hidden}
        .progress-bar-fill{height:100%;background:linear-gradient(90deg,#7b2ff7,#00d4ff);border-radius:8px;transition:width .3s}
        .progress-stats{display:flex;gap:20px;margin-bottom:12px}
        .progress-stat{text-align:center}
        .progress-stat .stat-value{font-size:20px;font-weight:600;color:#fff}
        .progress-stat .stat-label{font-size:12px;color:rgba(255,255,255,.4);margin-top:2px}
        .progress-log{font-size:13px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:8px;line-height:1.6}
        .progress-log .log-time{color:rgba(255,255,255,.3);white-space:nowrap;min-width:60px}
        .progress-log .log-msg{color:rgba(255,255,255,.88)}
        .progress-log .log-msg.success{color:#52c41a}
        .progress-log .log-msg.failed{color:#ff4444}
        .progress-log .log-msg.processing{color:#00d4ff}
    </style>
</head>
<body>
    <div class="task-info">
        <h3>{{ task.get('keyword', '') }}</h3>
        <div class="info-row">
            <span class="info-item">采集源：<strong>{{ task.get('source_names', '') }}</strong></span>
            <span class="info-item">页数：<strong>{{ task.get('pages', 1) }}</strong></span>
            <span class="info-item">步长：<strong>{{ task.get('page_size_step', 10) }}</strong></span>
            <span class="info-item">数据量：<strong>{{ task.get('total_count', 0) }} 条</strong></span>
            <span class="info-item">时间：<strong id="taskTimeDisplay">{{ task.get('create_at', '') }}</strong></span>
        </div>
    </div>
    <div class="toolbar-bar">
        <button class="btn-deep" id="btnDeepCollect" disabled>
            <i class="layui-icon layui-icon-star"></i> AI深度采集
        </button>
        <span class="selected-count">已选 <strong id="selectedCount">0</strong> 条</span>
    </div>
    <input type="hidden" id="taskIdInput" value="{{ task.get('id', 0) }}">
    <table id="dataTable" lay-filter="dataTable"></table>

    <script type="text/html" id="deleteBar">
        <a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="del">删除</a>
    </script>

    <script type="text/html" id="deepBar">
        {% raw '{{# if(d.deep_status == "success"){ }}' %}
            <a class="layui-btn layui-btn-xs" lay-event="viewDeep" style="background:#7b2ff7;border-color:#7b2ff7;">查看</a>
        {% raw '{{# } else { }}' %}
            <a class="layui-btn layui-btn-xs" lay-event="deepSingle" style="background:linear-gradient(135deg,#7b2ff7,#00d4ff);border:none;">深度采集</a>
        {% raw '{{# } }}' %}
    </script>

    <script src="/static/dist/layui-v2.13.6/layui-v2.13.6/layui/layui.js"></script>
    <script>
    function getCsrfToken(){
        var cookies = document.cookie.split(';');
        for(var i=0;i<cookies.length;i++){
            var c = cookies[i].trim();
            if(c.indexOf('_xsrf=') === 0) return decodeURIComponent(c.substring(6));
        }
        return '';
    }

    function escapeHtml(str){
        if(!str) return '';
        return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    var taskId = parseInt(document.getElementById('taskIdInput').value) || 0;
    var selectedIds = [];

    function convertToUTC8(timeStr){
        if(!timeStr) return '';
        try {
            var parts = timeStr.split(' ');
            var dateParts = parts[0].split('-');
            var timeParts = parts[1].split(':');
            var d = new Date(Date.UTC(
                parseInt(dateParts[0]), parseInt(dateParts[1])-1, parseInt(dateParts[2]),
                parseInt(timeParts[0]), parseInt(timeParts[1]), parseInt(timeParts[2])
            ));
            d.setHours(d.getHours() + 8);
            var y = d.getUTCFullYear();
            var m = String(d.getUTCMonth()+1).padStart(2,'0');
            var day = String(d.getUTCDate()).padStart(2,'0');
            var h = String(d.getUTCHours()).padStart(2,'0');
            var min = String(d.getUTCMinutes()).padStart(2,'0');
            var s = String(d.getUTCSeconds()).padStart(2,'0');
            return y+'-'+m+'-'+day+' '+h+':'+min+':'+s;
        } catch(e) { return timeStr; }
    }

    layui.use(['table','layer','jquery'], function(){
        var table = layui.table;
        var layer = layui.layer;
        var $ = layui.$;

        var rawTime = $('#taskTimeDisplay').text();
        if(rawTime) $('#taskTimeDisplay').text(convertToUTC8(rawTime));

        // 启动深度采集
        function startDeepCollect(dataIds){
            var layerIdx = layer.load(1, {shade:[0.3,'#000']});
            $.post('/admin/outlook/deep/collect', {
                data_ids: dataIds.join(','),
                _xsrf: getCsrfToken()
            }, function(res){
                layer.close(layerIdx);
                if(res.code === 0){
                    showProgressDialog(res.task_id, dataIds.length);
                } else {
                    layer.msg(res.msg, {icon:2});
                }
            }).fail(function(xhr){
                layer.close(layerIdx);
                layer.msg('请求失败: ' + (xhr.statusText || '网络错误'), {icon:2});
            });
        }

        // 显示进度弹窗
        function showProgressDialog(taskId, total){
            var dialogHtml = '<div class="deep-progress-dialog">'
                + '<div class="deep-progress-header"><h4>AI深度采集中...</h4></div>'
                + '<div class="deep-progress-body">'
                + '<div class="progress-bar-container"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>'
                + '<div class="progress-stats">'
                + '<div class="progress-stat"><div class="stat-value" id="statTotal">'+total+'</div><div class="stat-label">总数</div></div>'
                + '<div class="progress-stat"><div class="stat-value" style="color:#52c41a" id="statSuccess">0</div><div class="stat-label">成功</div></div>'
                + '<div class="progress-stat"><div class="stat-value" style="color:#ff4444" id="statFailed">0</div><div class="stat-label">失败</div></div>'
                + '</div>'
                + '<div id="logContainer" style="max-height:250px;overflow-y:auto"></div>'
                + '<div id="closeBtnContainer" style="display:none;text-align:center;padding:16px 0 8px;">'
                + '<button onclick="closeProgressDialog()" style="background:linear-gradient(135deg,#7b2ff7,#00d4ff);border:none;color:#fff;padding:10px 40px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;">关 闭</button>'
                + '</div>'
                + '</div></div>';

            var layerIdx = layer.open({
                type: 1,
                title: false,
                area: ['520px', 'auto'],
                content: dialogHtml,
                shade: 0.5,
                closeBtn: 1,
                success: function(){
                    pollProgress(taskId);
                },
                cancel: function(){
                    if(deepPollTimer){ clearInterval(deepPollTimer); deepPollTimer=null; }
                },
                end: function(){
                    if(deepPollTimer){ clearInterval(deepPollTimer); deepPollTimer=null; }
                }
            });
        }

        var deepPollTimer = null;

        // 关闭进度弹窗
        window.closeProgressDialog = function(){
            if(deepPollTimer){ clearInterval(deepPollTimer); deepPollTimer=null; }
            layer.closeAll();
        };

        // 轮询进度
        function pollProgress(taskId){
            if(deepPollTimer) clearInterval(deepPollTimer);
            deepPollTimer = setInterval(function(){
                $.get('/admin/outlook/deep/collect/status', {task_id: taskId}, function(res){
                    if(res.code !== 0 || !res.data) return;
                    var data = res.data;
                    var pct = Math.round((data.current / data.total) * 100);
                    $('#progressFill').css('width', pct + '%');
                    $('#statSuccess').text(data.success || 0);
                    $('#statFailed').text(data.failed || 0);

                    // 更新日志
                    var logHtml = '';
                    var logs = data.logs || [];
                    for(var i = logs.length - 1; i >= 0; i--){
                        var log = logs[i];
                        var cls = log.status || '';
                        logHtml += '<div class="progress-log"><span class="log-msg '+cls+'">'+escapeHtml(log.msg)+'</span></div>';
                    }
                    $('#logContainer').html(logHtml);

                    // 更新标题
                    if(data.status === 'completed'){
                        clearInterval(deepPollTimer); deepPollTimer=null;
                        $('.deep-progress-header h4').text('AI深度采集完成 - 成功 '+data.success+' 条，失败 '+data.failed+' 条');
                        $('#closeBtnContainer').show();
                        // 刷新表格
                        setTimeout(function(){
                            table.reload('dataTable');
                        }, 500);
                    } else if(data.status === 'error'){
                        clearInterval(deepPollTimer); deepPollTimer=null;
                        $('.deep-progress-header h4').text('AI深度采集出错');
                        $('#closeBtnContainer').show();
                    }
                });
            }, 1000);
        }

        // 查看深度采集详情
        function viewDeepDetail(dataId){
            $.get('/admin/outlook/deep/detail', {data_id: dataId}, function(res){
                if(res.code !== 0){
                    layer.msg(res.msg, {icon:2});
                    return;
                }
                var d = res.data;
                var statusHtml = d.status === 'success'
                    ? '<span style="color:#52c41a;font-weight:600;">成功</span>'
                    : '<span style="color:#ff4444;font-weight:600;">失败</span>';
                if(d.status === 'failed' && d.error_msg){
                    statusHtml += ' <span style="color:#999;font-size:12px;">('+escapeHtml(d.error_msg)+')</span>';
                }

                var contentLen = (d.deep_content||'').length;
                var rawLen = (d.raw_content||'').length;

                var html = '<div style="padding:0;background:#0f1525;color:rgba(255,255,255,.92);font-size:15px;line-height:1.8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;">'
                    // 顶部信息区
                    + '<div style="background:linear-gradient(180deg,#111827,#0f1525);padding:20px 24px;border-bottom:1px solid rgba(255,255,255,.07)">'
                    + '<h3 style="margin:0 0 12px 0;font-size:17px;color:#fff;font-weight:600;">'+escapeHtml(d.title||'')+'</h3>'
                    + '<div style="display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:rgba(255,255,255,.75)">'
                    + '<span>来源：<strong style="color:#fff">'+escapeHtml(d.source_name||'-')+'</strong></span>'
                    + '<span>模型：<strong style="color:#fff">'+escapeHtml(d.model_used||'-')+'</strong></span>'
                    + '<span>状态：'+statusHtml+'</span>'
                    + '<span>清洗后内容：<strong style="color:#00d4ff">'+contentLen+'</strong> 字符</span>'
                    + '<span>原始HTML：<strong style="color:#00d4ff">'+rawLen+'</strong> 字符</span>'
                    + '</div>'
                    + (d.url ? '<div style="margin-top:8px;font-size:12px;"><a href="'+escapeHtml(d.url)+'" target="_blank" style="color:#00d4ff;text-decoration:none;">'+escapeHtml(d.url)+'</a></div>' : '')
                    + '</div>'

                    // Tab切换
                    + '<div style="display:flex;border-bottom:1px solid rgba(255,255,255,.07);">'
                    + '<button id="tabSummary" onclick="switchDetailTab(\'summary\')" style="flex:1;padding:14px;background:rgba(0,212,255,.1);border:none;color:#00d4ff;cursor:pointer;font-size:14px;font-weight:600;">摘要与要点</button>'
                    + '<button id="tabContent" onclick="switchDetailTab(\'content\')" style="flex:1;padding:14px;background:transparent;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:14px;">清洗后正文</button>'
                    + '<button id="tabRaw" onclick="switchDetailTab(\'raw\')" style="flex:1;padding:14px;background:transparent;border:none;color:rgba(255,255,255,.6);cursor:pointer;font-size:14px;">原始HTML</button>'
                    + '</div>'

                    // 摘要与要点
                    + '<div id="panelSummary" style="padding:24px;max-height:500px;overflow-y:auto;">'
                    + '<div style="margin-bottom:20px;">'
                    + '<h4 style="color:#00d4ff;font-size:15px;margin:0 0 10px 0;font-weight:600;">摘要</h4>'
                    + '<div style="background:rgba(255,255,255,.05);padding:16px;border-radius:8px;color:rgba(255,255,255,.92);font-size:14px;line-height:1.9;">'+escapeHtml(d.summary||'暂无')+'</div>'
                    + '</div>'
                    + '<div>'
                    + '<h4 style="color:#00d4ff;font-size:15px;margin:0 0 10px 0;font-weight:600;">关键要点</h4>'
                    + '<div style="background:rgba(255,255,255,.05);padding:16px;border-radius:8px;color:rgba(255,255,255,.92);font-size:14px;line-height:2.2;">'+formatKeyPoints(d.key_points)+'</div>'
                    + '</div>'
                    + '</div>'

                    // 清洗后正文
                    + '<div id="panelContent" style="padding:24px;max-height:550px;overflow-y:auto;display:none;">'
                    + '<div style="background:rgba(255,255,255,.05);padding:18px;border-radius:8px;white-space:pre-wrap;word-break:break-word;color:rgba(255,255,255,.92);font-size:14px;line-height:2;">'+escapeHtml(d.deep_content||'暂无')+'</div>'
                    + '</div>'

                    // 原始HTML
                    + '<div id="panelRaw" style="padding:24px;max-height:550px;overflow-y:auto;display:none;">'
                    + '<div style="background:#0a0e1a;padding:16px;border-radius:8px;font-family:Consolas,Monaco,"Courier New",monospace;font-size:12px;line-height:1.6;color:rgba(255,255,255,.7);white-space:pre-wrap;word-break:break-all;max-height:500px;overflow-y:auto;">'+escapeHtml(d.raw_content||'暂无')+'</div>'
                    + '</div>'

                    + '</div>';

                layer.open({
                    type:1,
                    title:'深度采集详情',
                    area:['900px','650px'],
                    content:html,
                    shade:0.5,
                    success: function(){
                        window._detailData = d;
                    }
                });
            });
        }

        // 切换Tab
        window.switchDetailTab = function(tab){
            var tabs = ['summary','content','raw'];
            var panels = {summary:'panelSummary',content:'panelContent',raw:'panelRaw'};
            var tabBtns = {summary:'tabSummary',content:'tabContent',raw:'tabRaw'};

            for(var i=0;i<tabs.length;i++){
                var t = tabs[i];
                var panel = document.getElementById(panels[t]);
                var btn = document.getElementById(tabBtns[t]);
                if(t === tab){
                    panel.style.display = 'block';
                    btn.style.background = 'rgba(0,212,255,.1)';
                    btn.style.color = '#00d4ff';
                    btn.style.fontWeight = '600';
                } else {
                    panel.style.display = 'none';
                    btn.style.background = 'transparent';
                    btn.style.color = 'rgba(255,255,255,.5)';
                    btn.style.fontWeight = 'normal';
                }
            }
        };

        // 格式化关键要点
        function formatKeyPoints(text){
            if(!text) return '暂无';
            var points = text.split(/[,;，；]/);
            var html = '';
            for(var i=0;i<points.length;i++){
                var p = points[i].trim();
                if(p) html += '<div style="padding:4px 0;border-bottom:1px solid rgba(255,255,255,.05);"><span style="color:#7b2ff7;font-weight:600;margin-right:8px;">'+(i+1)+'.</span>'+escapeHtml(p)+'</div>';
            }
            return html || '暂无';
        }

        var tableIns;
        tableIns = table.render({
            elem: '#dataTable',
            url: '/admin/outlook/task/data/api',
            where: {task_id: taskId},
            page: {
                curr: 1,
                prevText: '上一页',
                nextText: '下一页',
                layout: ['prev', 'page', 'next', 'skip', 'count', 'limit'],
                limits: [20, 50, 100],
                limit: 20
            },
            cols: [[
                {type:'checkbox',width:50,align:'center'},
                {field:'_seq',title:'序号',width:70,align:'center'},
                {field:'source_name',title:'来源',width:110,align:'center'},
                {field:'title',title:'标题',align:'left'},
                {field:'author',title:'作者',width:100,align:'center'},
                {field:'publish_date',title:'发布日期',width:120,align:'center'},
                {field:'ai_processed',title:'处理',width:60,align:'center',templet:function(d){
                    if(d.ai_deep_status == 1){
                        return '<span style="color:#52c41a;font-weight:600;">已采集</span>';
                    }
                    return '<span style="color:#999;">否</span>';
                }},
                {field:'deep_status',title:'深度',width:70,align:'center',templet:function(d){
                    if(d.deep_status === 'success'){
                        return '<span style="color:#52c41a;font-weight:600;">成功</span>';
                    } else if(d.deep_status === 'failed'){
                        return '<span style="color:#ff4444;font-weight:600;">失败</span>';
                    } else {
                        return '<span style="color:#999;">无</span>';
                    }
                }},
                {field:'url',title:'链接',width:80,align:'center',templet:function(d){
                    return d.url ? '<a href="'+d.url+'" target="_blank" style="color:#00d4ff;">查看</a>' : '-';
                }},
                {field:'create_at',title:'采集时间',width:160,align:'center',templet:function(d){
                    if(!d.create_at) return '-';
                    try {
                        var parts = d.create_at.split(' ');
                        var dateParts = parts[0].split('-');
                        var timeParts = parts[1].split(':');
                        var utc = new Date(Date.UTC(
                            parseInt(dateParts[0]), parseInt(dateParts[1])-1, parseInt(dateParts[2]),
                            parseInt(timeParts[0]), parseInt(timeParts[1]), parseInt(timeParts[2])
                        ));
                        utc.setHours(utc.getHours() + 8);
                        var y = utc.getUTCFullYear();
                        var m = String(utc.getUTCMonth()+1).padStart(2,'0');
                        var day = String(utc.getUTCDate()).padStart(2,'0');
                        var h = String(utc.getUTCHours()).padStart(2,'0');
                        var min = String(utc.getUTCMinutes()).padStart(2,'0');
                        var s = String(utc.getUTCSeconds()).padStart(2,'0');
                        return y+'-'+m+'-'+day+' '+h+':'+min+':'+s;
                    } catch(e) { return d.create_at; }
                }},
                {title:'操作',width:120,align:'center',toolbar:'#deepBar'}
            ]],
            skin: 'line'
        });

        // 监听复选框
        table.on('checkbox(dataTable)', function(obj){
            var checkStatus = table.checkStatus('dataTable');
            selectedIds = checkStatus.data.map(function(d){ return d.id; });
            $('#selectedCount').text(selectedIds.length);
            $('#btnDeepCollect').prop('disabled', selectedIds.length === 0);
        });

        // 批量深度采集
        $('#btnDeepCollect').on('click', function(){
            if(selectedIds.length === 0) return;
            startDeepCollect(selectedIds);
        });

        // 工具栏事件
        table.on('tool(dataTable)', function(obj){
            if(obj.event === 'del'){
                layer.confirm('确定要删除该数据吗？', function(index){
                    $.post('/admin/outlook/data/delete', {ids: obj.data.id, _xsrf: getCsrfToken()}, function(res){
                        if(res.code === 0){ layer.msg('删除成功', {icon:1}); obj.del(); }
                        else { layer.msg(res.msg, {icon:2}); }
                    });
                    layer.close(index);
                });
            } else if(obj.event === 'deepSingle'){
                startDeepCollect([obj.data.id]);
            } else if(obj.event === 'viewDeep'){
                viewDeepDetail(obj.data.id);
            }
        });
    });
    </script>
</body>
</html>
