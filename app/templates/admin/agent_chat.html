{% extends "layout.html" %}
{% block body %}
<style>
.agent-chat-wrap { display:flex; height:calc(100vh - 120px); }
.agent-chat-side { width:220px; background:#f5f5f5; border-right:1px solid #e0e0e0; overflow-y:auto; padding:10px 0; }
.agent-chat-side .agent-item { padding:12px 20px; cursor:pointer; transition:background .2s; display:flex;align-items:center;gap:8px; font-size:14px; }
.agent-chat-side .agent-item:hover { background:#e6f7ff; }
.agent-chat-side .agent-item.active { background:#1890ff; color:#fff; }
.agent-chat-main { flex:1; display:flex; flex-direction:column; }
.agent-chat-messages { flex:1; overflow-y:auto; padding:20px; }
.agent-chat-messages .msg { margin-bottom:16px; display:flex; }
.agent-chat-messages .msg.user { justify-content:flex-end; }
.agent-chat-messages .msg .bubble { max-width:70%; padding:10px 16px; border-radius:8px; line-height:1.6; font-size:14px; }
.agent-chat-messages .msg.assistant .bubble { background:#f0f0f0; }
.agent-chat-messages .msg.user .bubble { background:#1890ff; color:#fff; }
.agent-chat-input { border-top:1px solid #e0e0e0; padding:16px; display:flex; gap:10px; }
.agent-chat-input textarea { flex:1; border:1px solid #d9d9d9; border-radius:6px; padding:10px; resize:none; font-size:14px; outline:none; }
.agent-chat-input button { padding:8px 24px; background:#1890ff; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
</style>
<div class="agent-chat-wrap">
<div class="agent-chat-side">
{% for a in assistants %}
<div class="agent-item {% if loop.first %}active{% end %}" data-id="{{ a['id'] }}"><i class="layui-icon {{ a.get('icon','layui-icon-user') }}"></i>{{ a['assistant_name'] }}</div>
{% end %}
{% if not assistants %}
<div style="padding:20px;color:#999;text-align:center;">请先创建数字员工</div>
{% end %}
</div>
<div class="agent-chat-main">
<div class="agent-chat-messages" id="chatMessages"><div style="text-align:center;color:#999;padding-top:100px;">选择一个数字员工开始对话</div></div>
<div class="agent-chat-input">
<textarea id="chatInput" rows="2" placeholder="输入消息..." onkeydown="if(event.keyCode===13&&!event.shiftKey){event.preventDefault();sendMsg();}"></textarea>
<button onclick="sendMsg()">发送</button>
</div>
</div>
</div>
{% end %}
{% block extra_script %}
<script>
var currentAssistantId=null;
$(function(){
	var $items=$('.agent-item');
	if($items.length){clickAssistant($items.first());}
	$('.agent-item').click(function(){clickAssistant($(this));});
});
function clickAssistant($el){
	$('.agent-item').removeClass('active');
	$el.addClass('active');
	currentAssistantId=$el.data('id');
	$('#chatInput').focus();
	loadHistory();
}
function loadHistory(){
	if(!currentAssistantId)return;
	$.get('/api/admin/chat/history?assistant_id='+currentAssistantId,function(res){
		var html='';
		if(res.data&&res.data.length){
			$.each(res.data,function(i,m){
				var cls=m.role=='user'?'user':'assistant';
				html+='<div class="msg '+cls+'"><div class="bubble">'+escapeHtml(m.content)+'</div></div>';
			});
		}
		$('#chatMessages').html(html||'<div style="text-align:center;color:#999;padding-top:100px;">开始新的对话</div>');
		scrollBottom();
	});
}
function sendMsg(){
	var content=$('#chatInput').val().trim();
	if(!content||!currentAssistantId)return;
	$('#chatInput').val('').focus();
	$('#chatMessages').append('<div class="msg user"><div class="bubble">'+escapeHtml(content)+'</div></div>');
	var $msgDiv=$('#chatMessages').append('<div class="msg assistant"><div class="bubble" id="streaming"></div></div>');
	scrollBottom();
	$.ajax({
		url:'/api/admin/chat/send', type:'POST', data:$.param({content:content,assistant_id:currentAssistantId}),
		xhrFields:{onprogress:function(e){
			var text=e.currentTarget.responseText;
			var lines=text.split('\n');
			var full='';
			for(var i=0;i<lines.length;i++){
				var line=lines[i].trim();
				if(line.startsWith('data: ')&&line!=='data: [DONE]'){
					try{var d=JSON.parse(line.substring(6));if(d.content)full+=d.content;}catch(e){}
				}
			}
			$('#streaming').html(markedText(full));
			scrollBottom();
		}},
		success:function(){}
	});
	setTimeout(function(){$('#streaming').removeAttr('id');},30000);
}
function scrollBottom(){var $el=$('#chatMessages');$el.scrollTop($el[0].scrollHeight);}
function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g,'<br>');}
function markedText(s){return escapeHtml(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/```([\s\S]*?)```/g,'<pre><code>$1</code></pre>');}
</script>
{% end %}
