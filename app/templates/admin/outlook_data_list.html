{% extends "layout.html" %}
{% block body %}
<style>
.outlook-page{background:#0a0e1a;min-height:100vh;padding:32px 24px 60px;position:relative}
.outlook-page::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(ellipse at 20% 20%,rgba(0,212,255,.06) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(123,47,247,.06) 0%,transparent 50%);pointer-events:none;z-index:0}
.outlook-inner{max-width:1200px;margin:0 auto;position:relative;z-index:1}
.page-title-bar{display:flex;align-items:center;gap:16px;margin-bottom:40px;padding-bottom:24px;border-bottom:1px solid rgba(255,255,255,.06)}
.page-title-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,212,255,.3)}
.page-title-icon i{font-size:22px;color:#fff}
.page-title-text h1{font-size:24px;font-weight:700;color:#fff;margin:0;letter-spacing:2px}
.page-title-text p{font-size:12px;color:rgba(255,255,255,.35);margin:4px 0 0}
.dark-card{background:linear-gradient(180deg,#111827,#0f1525);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:28px 24px;position:relative;overflow:hidden}
.dark-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00d4ff,#7b2ff7,transparent)}
.card-heading{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.card-heading h2{font-size:16px;font-weight:600;color:#fff;margin:0;display:flex;align-items:center;gap:10px}
.accent-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#00d4ff,#7b2ff7);box-shadow:0 0 8px rgba(0,212,255,.4)}
.search-bar{display:flex;gap:0;margin-bottom:20px}
.search-bar input{flex:1;height:44px;padding:0 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-right:none;border-radius:8px 0 0 8px;color:#fff;font-size:14px;outline:none}
.search-bar input:focus{background:rgba(255,255,255,.06);border-color:rgba(0,212,255,.35)}
.search-bar input::placeholder{color:rgba(255,255,255,.25)}
.search-bar button{height:44px;padding:0 18px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);border:none;border-radius:0 8px 8px 0;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.task-list{display:flex;flex-direction:column;gap:10px}
.task-item{display:flex;align-items:center;gap:16px;padding:18px 20px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:10px;transition:all .3s;cursor:pointer}
.task-item:hover{border-color:rgba(0,212,255,.15);background:rgba(0,212,255,.03)}
.task-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,rgba(0,212,255,.12),rgba(123,47,247,.12));border:1px solid rgba(0,212,255,.1);display:flex;align-items:center;justify-content:center;font-size:20px;color:#00d4ff;flex-shrink:0}
.task-body{flex:1;min-width:0}
.task-keyword{font-size:16px;font-weight:600;color:#fff;margin-bottom:4px}
.task-meta{font-size:12px;color:rgba(255,255,255,.3);display:flex;gap:16px;flex-wrap:wrap}
.task-meta span{display:flex;align-items:center;gap:4px}
.task-count{text-align:center;flex-shrink:0;min-width:80px}
.task-count .num{font-size:24px;font-weight:800;background:linear-gradient(135deg,#00d4ff,#7b2ff7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.task-count .label{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
.task-status{flex-shrink:0}
.status-badge{font-size:10px;padding:4px 12px;border-radius:6px;font-weight:500}
.status-done{background:rgba(82,196,86,.08);color:#52c41a;border:1px solid rgba(82,196,86,.1)}
.status-fail{background:rgba(255,77,79,.08);color:#ff4d4f;border:1px solid rgba(255,77,79,.1)}
.task-ops{display:flex;gap:6px;flex-shrink:0}
.op-btn{width:32px;height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;color:rgba(255,255,255,.3)}
.op-btn:hover{border-color:rgba(0,212,255,.25);background:rgba(0,212,255,.06);color:#00d4ff}
.op-btn.danger:hover{border-color:rgba(255,77,79,.25);background:rgba(255,77,79,.06);color:#ff4d4f}
.op-btn i{font-size:15px}
.empty-state{text-align:center;padding:48px 20px}
.empty-state i{font-size:40px;color:rgba(255,255,255,.08);display:block;margin-bottom:8px}
.empty-state p{font-size:13px;color:rgba(255,255,255,.25)}
.dark-layer{background:rgba(0,0,0,.75)!important}
</style>

<div class="outlook-page">
    <div class="outlook-inner">
        <div class="page-title-bar">
            <div class="page-title-icon"><i class="layui-icon layui-icon-table"></i></div>
            <div class="page-title-text">
                <h1>数据仓库</h1>
                <p>所有采集任务数据汇总管理</p>
            </div>
        </div>

        <div class="dark-card">
            <div class="card-heading">
                <h2><span class="accent-dot"></span>采集任务列表</h2>
            </div>
            <div class="search-bar">
                <input type="text" id="searchKeyword" placeholder="搜索任务关键词...">
                <button onclick="loadTasks()">搜索</button>
            </div>
            <div class="task-list" id="taskList"></div>
        </div>
    </div>
</div>

<script type="text/html" id="taskItemTpl">
    {{# if(d.data.length === 0){ }}
    <div class="empty-state"><i class="layui-icon layui-icon-face-surprised"></i><p>暂无采集任务，请先进行一次采集</p></div>
    {{# } else { }}
    {{# layui.each(d.data, function(i, task){ }}
    <div class="task-item" onclick="viewTaskData({{ task.id }})">
        <div class="task-icon"><i class="layui-icon layui-icon-download-circle"></i></div>
        <div class="task-body">
            <div class="task-keyword">{{ task.keyword }}</div>
            <div class="task-meta">
                <span><i class="layui-icon layui-icon-source"></i> {{ task.source_names }}</span>
                <span><i class="layui-icon layui-icon-time"></i> {{ task.pages }}页 x {{ task.page_size_step }}条</span>
                <span><i class="layui-icon layui-icon-date"></i> {{ task.create_at }}</span>
                {{# if(task.ai_expand){ }}<span style="color:#00d4ff"><i class="layui-icon layui-icon-star"></i> AI扩词</span>{{# } }}
                {{# if(task.ai_clean){ }}<span style="color:#7b2ff7"><i class="layui-icon layui-icon-star-fill"></i> AI清洗</span>{{# } }}
            </div>
        </div>
        <div class="task-count">
            <div class="num">{{ task.total_count }}</div>
            <div class="label">条数据</div>
        </div>
        <div class="task-status">
            {{# if(task.status === 'completed'){ }}
                <span class="status-badge status-done">已完成</span>
            {{# } else { }}
                <span class="status-badge status-fail">失败</span>
            {{# } }}
        </div>
        <div class="task-ops">
            <div class="op-btn" onclick="event.stopPropagation();viewTaskData({{ task.id }})" title="查看数据"><i class="layui-icon layui-icon-read"></i></div>
            <div class="op-btn danger" onclick="event.stopPropagation();deleteTask({{ task.id }})" title="删除"><i class="layui-icon layui-icon-delete"></i></div>
        </div>
    </div>
    {{# }); }}
    {{# } }}
</script>

{% end %}

{% block extra_script %}
<script>
layui.use(['layer','laytpl'], function(){
    var layer = layui.layer;
    var laytpl = layui.laytpl;
    var $ = layui.$;

    var currentPage = 1;
    var totalTasks = 0;

    window.loadTasks = function(page){
        if(page) currentPage = page;
        var keyword = $.trim($('#searchKeyword').val());
        $.get('/admin/outlook/tasks/api', {page: currentPage, limit: 20, keyword: keyword}, function(res){
            if(res.code === 0){
                totalTasks = res.count;
                var html = laytpl($('#taskItemTpl').html()).render(res);
                $('#taskList').html(html);
                renderPagination();
            }
        });
    };

    function renderPagination(){
        var totalPages = Math.ceil(totalTasks / 20);
        if(totalPages <= 1) return;
        var html = '<div style="text-align:center;margin-top:24px"><ul class="layui-laypage layui-laypage-default">';
        html += '<li class="layui-laypage-prev'+(currentPage<=1?' layui-disabled':'')+'" onclick="'+(currentPage>1?'loadTasks('+(currentPage-1)+')':'')+'"><a>上一页</a></li>';
        for(var i=1;i<=totalPages;i++){
            if(Math.abs(i-currentPage)>3) continue;
            html += '<li class="'+(i===currentPage?'layui-laypage-curr':'')+'"><a href="javascript:;" onclick="loadTasks('+i+')" style="'+(i===currentPage?'background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff':'')+'">'+i+'</a></li>';
        }
        html += '<li class="layui-laypage-next'+(currentPage>=totalPages?' layui-disabled':'')+'" onclick="'+(currentPage<totalPages?'loadTasks('+(currentPage+1)+')':'')+'"><a>下一页</a></li>';
        html += '<span class="layui-laypage-count">共 '+totalTasks+' 条</span>';
        html += '</ul></div>';
        $('#taskList').append(html);
    }

    window.viewTaskData = function(taskId){
        layer.open({
            type: 2,
            title: '任务数据详情',
            area: ['90%', '85%'],
            content: '/admin/outlook/task/data?task_id=' + taskId
        });
    };

    window.deleteTask = function(taskId){
        layer.confirm('确定要删除该任务及所有关联数据吗？', {skin:'dark-layer'}, function(index){
            $.post('/admin/outlook/task/delete', {task_id: taskId, _xsrf: getCsrfToken()}, function(res){
                if(res.code === 0){ layer.msg('删除成功', {icon:1}); loadTasks(); }
                else { layer.msg(res.msg, {icon:2}); }
            });
            layer.close(index);
        });
    };

    function getCsrfToken(){
        var cookies = document.cookie.split(';');
        for(var i=0;i<cookies.length;i++){
            var c = cookies[i].trim();
            if(c.indexOf('_xsrf=') === 0) return decodeURIComponent(c.substring(6));
        }
        return '';
    }

    loadTasks();
});
</script>
{% end %}
