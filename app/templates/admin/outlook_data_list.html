{% extends "layout.html" %}
{% block body %}
<style>
.warehouse-page{
    position:relative;min-height:calc(100vh - 160px);
    background:linear-gradient(135deg,#050810 0%,#0a0e1a 50%,#050810 100%);
    border-radius:12px;overflow:hidden;padding:24px;
}
.warehouse-bg{
    position:absolute;top:0;left:0;right:0;bottom:0;z-index:0;
    background:
        radial-gradient(circle at 15% 20%, rgba(0,212,255,.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 30%, rgba(123,47,247,.08) 0%, transparent 40%),
        radial-gradient(circle at 50% 80%, rgba(0,212,255,.05) 0%, transparent 50%);
    animation: bgPulse 8s ease-in-out infinite alternate;
}
@keyframes bgPulse{
    0%{opacity:.8;transform:scale(1)}
    100%{opacity:1;transform:scale(1.05)}
}
.warehouse-grid{
    position:absolute;top:0;left:0;right:0;bottom:0;
    background:
        linear-gradient(rgba(0,212,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,.03) 1px, transparent 1px);
    background-size:50px 50px;
    animation:gridMove 20s linear infinite;
}
@keyframes gridMove{
    0%{transform:translateY(0)}
    100%{transform:translateY(50px)}
}
.warehouse-particles{
    position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;z-index:1;
}
.particle{
    position:absolute;width:2px;height:2px;background:#00d4ff;border-radius:50%;
    box-shadow:0 0 6px #00d4ff,0 0 12px #00d4ff;
    animation: particleFloat 15s linear infinite;
    opacity:0;
}
@keyframes particleFloat{
    0%{transform:translateY(100%) translateX(0);opacity:0}
    10%{opacity:.6}
    90%{opacity:.6}
    100%{transform:translateY(-100%) translateX(100px);opacity:0}
}
.warehouse-content{
    position:relative;z-index:2;display:flex;flex-direction:column;
}
.warehouse-header{
    text-align:center;margin-bottom:24px;position:relative;
}
.warehouse-title{
    font-size:36px;font-weight:900;letter-spacing:6px;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7,#00d4ff);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:titleShine 3s linear infinite;
    text-shadow:0 0 30px rgba(0,212,255,.3),0 0 60px rgba(123,47,247,.2);
    margin:0;
}
@keyframes titleShine{
    0%{background-position:0% center}
    100%{background-position:200% center}
}
.warehouse-subtitle{
    font-size:12px;color:rgba(255,255,255,.35);letter-spacing:3px;margin-top:6px;
}
.warehouse-stats{
    display:flex;justify-content:center;gap:30px;margin-top:16px;
}
.stat-item{
    text-align:center;padding:12px 24px;
    background:rgba(0,212,255,.03);border:1px solid rgba(0,212,255,.1);border-radius:10px;
    position:relative;overflow:hidden;min-width:120px;
}
.stat-item::before{
    content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
    background:conic-gradient(from 0deg,transparent,rgba(0,212,255,.1),transparent);
    animation:statRotate 4s linear infinite;
}
@keyframes statRotate{
    0%{transform:rotate(0deg)}
    100%{transform:rotate(360deg)}
}
.stat-number{
    font-size:28px;font-weight:800;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    position:relative;z-index:1;
}
.stat-label{
    font-size:10px;color:rgba(255,255,255,.4);margin-top:4px;letter-spacing:2px;
    position:relative;z-index:1;
}
.warehouse-main{
    background:linear-gradient(180deg,rgba(17,24,39,.8),rgba(10,14,26,.9));
    border:1px solid rgba(0,212,255,.15);border-radius:16px;padding:16px;
    position:relative;overflow:hidden;
}
.warehouse-main::before{
    content:'';position:absolute;top:0;left:0;right:0;height:3px;
    background:linear-gradient(90deg,transparent,#00d4ff,#7b2ff7,#00d4ff,transparent);
    animation:borderFlow 3s linear infinite;
}
@keyframes borderFlow{
    0%{background-position:-200% center}
    100%{background-position:200% center}
}
.warehouse-toolbar{
    display:flex;gap:12px;margin-bottom:16px;align-items:center;
}
.search-input{
    flex:1;height:40px;padding:0 16px;
    background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.2);border-radius:8px;
    color:#fff;font-size:13px;outline:none;transition:all .3s;
}
.search-input:focus{
    border-color:#00d4ff;box-shadow:0 0 20px rgba(0,212,255,.2);
    background:rgba(0,212,255,.08);
}
.search-input::placeholder{color:rgba(255,255,255,.25)}
.search-btn{
    height:40px;padding:0 20px;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);border:none;border-radius:8px;
    color:#fff;font-size:13px;font-weight:600;cursor:pointer;
    transition:all .3s;position:relative;overflow:hidden;
}
.search-btn::before{
    content:'';position:absolute;top:50%;left:50%;width:0;height:0;
    background:rgba(255,255,255,.2);border-radius:50%;
    transform:translate(-50%,-50%);transition:width .6s,height .6s;
}
.search-btn:hover::before{width:300px;height:300px}
.search-btn:hover{box-shadow:0 0 25px rgba(0,212,255,.4);transform:translateY(-2px)}
.warehouse-table{
    max-height:500px;overflow-y:auto;overflow-x:hidden;
}
.warehouse-table::-webkit-scrollbar{width:6px}
.warehouse-table::-webkit-scrollbar-track{background:rgba(0,212,255,.03);border-radius:3px}
.warehouse-table::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#00d4ff,#7b2ff7);border-radius:3px}
.data-row{
    display:grid;grid-template-columns:70px 130px 1fr 100px 90px 110px 90px;
    gap:12px;align-items:center;padding:12px 16px;margin-bottom:6px;
    background:rgba(0,212,255,.02);border:1px solid rgba(0,212,255,.08);border-radius:10px;
    transition:all .3s;cursor:pointer;position:relative;overflow:hidden;
}
.data-row::before{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(0,212,255,.1),transparent);
    transition:left .5s;
}
.data-row:hover::before{left:100%}
.data-row:hover{
    border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.05);
    transform:translateX(5px);box-shadow:0 5px 20px rgba(0,212,255,.15);
}
.data-row.header{
    background:rgba(0,212,255,.08);border-color:rgba(0,212,255,.2);
    cursor:default;font-weight:600;
}
.data-row.header:hover{transform:none;box-shadow:none}
.cell{color:rgba(255,255,255,.7);font-size:12px}
.cell-id{color:rgba(255,255,255,.3);font-family:monospace;font-size:11px}
.cell-source{
    color:#00d4ff;font-weight:500;padding:3px 8px;
    background:rgba(0,212,255,.1);border-radius:5px;display:inline-block;
}
.cell-keyword{color:#fff;font-weight:500;font-size:13px}
.cell-count{
    font-weight:700;font-size:16px;
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.cell-time{color:rgba(255,255,255,.4);font-size:11px}
.status-badge{
    padding:3px 10px;border-radius:5px;font-size:10px;font-weight:500;display:inline-block;
}
.status-done{background:rgba(82,196,86,.1);color:#52c41a;border:1px solid rgba(82,196,86,.2)}
.status-ai{
    display:inline-flex;align-items:center;gap:3px;padding:2px 8px;
    background:linear-gradient(135deg,rgba(0,212,255,.1),rgba(123,47,247,.1));
    border:1px solid rgba(123,47,247,.2);border-radius:5px;font-size:10px;color:#7b2ff7;
}
.view-btn{
    padding:5px 14px;background:linear-gradient(135deg,#00d4ff,#7b2ff7);
    border:none;border-radius:5px;color:#fff;font-size:11px;cursor:pointer;
    transition:all .3s;
}
.view-btn:hover{box-shadow:0 0 15px rgba(0,212,255,.4);transform:scale(1.05)}
.empty-container{
    text-align:center;padding:60px 20px;
}
.empty-icon{
    font-size:48px;color:rgba(0,212,255,.2);margin-bottom:12px;
    animation:emptyPulse 2s ease-in-out infinite;
}
@keyframes emptyPulse{
    0%,100%{transform:scale(1);opacity:.3}
    50%{transform:scale(1.1);opacity:.5}
}
.empty-text{color:rgba(255,255,255,.3);font-size:13px;letter-spacing:2px}
.warehouse-pagination{
    display:flex;justify-content:center;align-items:center;gap:8px;margin-top:16px;padding-top:16px;
    border-top:1px solid rgba(0,212,255,.1);
}
.page-btn{
    padding:6px 14px;background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.15);
    border-radius:6px;color:rgba(255,255,255,.6);cursor:pointer;transition:all .3s;font-size:12px;
}
.page-btn:hover:not(.disabled){
    border-color:#00d4ff;color:#00d4ff;background:rgba(0,212,255,.1);
}
.page-btn.active{
    background:linear-gradient(135deg,#00d4ff,#7b2ff7);border-color:transparent;color:#fff;
}
.page-btn.disabled{opacity:.3;cursor:not-allowed}
.page-info{color:rgba(255,255,255,.4);font-size:12px}
</style>

<div class="warehouse-page">
    <div class="warehouse-bg"></div>
    <div class="warehouse-grid"></div>
    <div class="warehouse-particles" id="particles"></div>
    <div class="warehouse-content">
        <div class="warehouse-header">
            <h1 class="warehouse-title">数 据 仓 库</h1>
            <p class="warehouse-subtitle">DATA WAREHOUSE | 采集任务数据中心</p>
            <div class="warehouse-stats">
                <div class="stat-item">
                    <div class="stat-number" id="statTasks">0</div>
                    <div class="stat-label">采集任务</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statData">0</div>
                    <div class="stat-label">数据总量</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="statSources">0</div>
                    <div class="stat-label">数据源</div>
                </div>
            </div>
        </div>
        <div class="warehouse-main">
            <div class="warehouse-toolbar">
                <input type="text" class="search-input" id="searchKeyword" placeholder="搜索任务关键词 / 数据源...">
                <button class="search-btn" onclick="loadTasks()"><i class="layui-icon layui-icon-search"></i> 搜 索</button>
            </div>
            <div class="warehouse-table">
                <div class="data-row header">
                    <div class="cell">ID</div>
                    <div class="cell">数据源</div>
                    <div class="cell">关键词</div>
                    <div class="cell">数据量</div>
                    <div class="cell">AI处理</div>
                    <div class="cell">采集时间</div>
                    <div class="cell">操作</div>
                </div>
                <div id="taskList"></div>
            </div>
            <div class="warehouse-pagination" id="pagination"></div>
        </div>
    </div>
</div>

<script src="/static/dist/layui-v2.13.6/layui-v2.13.6/layui/layui.js"></script>
<script>
layui.use(['layer'], function(){
    var layer = layui.layer;
    var $ = layui.$;

    var currentPage = 1;
    var totalTasks = 0;
    var totalDataCount = 0;
    var totalSources = 0;

    function createParticles(){
        var container = document.getElementById('particles');
        for(var i = 0; i < 20; i++){
            var p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDelay = Math.random() * 15 + 's';
            p.style.animationDuration = (10 + Math.random() * 10) + 's';
            container.appendChild(p);
        }
    }

    function loadStats(){
        $.get('/admin/outlook/tasks/api', {page: 1, limit: 1000}, function(res){
            if(res.code === 0){
                totalTasks = res.count;
                var dataCount = 0;
                var sources = {};
                for(var i = 0; i < res.data.length; i++){
                    dataCount += (res.data[i].total_count || 0);
                    var sns = res.data[i].source_names || '';
                    sns.split(',').forEach(function(s){
                        if(s.trim()) sources[s.trim()] = true;
                    });
                }
                totalDataCount = dataCount;
                totalSources = Object.keys(sources).length;
                animateNumber('statTasks', totalTasks);
                animateNumber('statData', totalDataCount);
                animateNumber('statSources', totalSources);
            }
        });
    }

    function animateNumber(id, target){
        var el = document.getElementById(id);
        var current = 0;
        var step = Math.ceil(target / 50);
        var timer = setInterval(function(){
            current += step;
            if(current >= target){
                current = target;
                clearInterval(timer);
            }
            el.textContent = current.toLocaleString();
        }, 30);
    }

    window.loadTasks = function(page){
        if(page) currentPage = page;
        var keyword = $.trim($('#searchKeyword').val());
        $.get('/admin/outlook/tasks/api', {page: currentPage, limit: 20, keyword: keyword}, function(res){
            if(res.code === 0){
                totalTasks = res.count;
                if(res.data.length === 0){
                    $('#taskList').html('<div class="empty-container"><div class="empty-icon"><i class="layui-icon layui-icon-face-surprised"></i></div><div class="empty-text">暂无采集任务，请先进行数据采集</div></div>');
                } else {
                    var html = '';
                    for(var i = 0; i < res.data.length; i++){
                        html += renderTaskRow(res.data[i]);
                    }
                    $('#taskList').html(html);
                    renderPagination();
                }
            }
        });
    };

    function renderTaskRow(task){
        var aiTags = '';
        if(task.ai_expand && task.ai_clean){
            aiTags = '<span class="status-ai"><i class="layui-icon layui-icon-star-fill"></i> 扩词+清洗</span>';
        } else if(task.ai_expand){
            aiTags = '<span class="status-ai"><i class="layui-icon layui-icon-star"></i> AI扩词</span>';
        } else if(task.ai_clean){
            aiTags = '<span class="status-ai"><i class="layui-icon layui-icon-star-fill"></i> AI清洗</span>';
        } else {
            aiTags = '<span style="color:rgba(255,255,255,.2)">无</span>';
        }

        return '<div class="data-row" ondblclick="viewTaskData(' + task.id + ')">'
            + '<div class="cell cell-id">' + task.id + '</div>'
            + '<div class="cell"><span class="cell-source">' + task.source_names + '</span></div>'
            + '<div class="cell cell-keyword">' + task.keyword + '</div>'
            + '<div class="cell cell-count">' + task.total_count + '</div>'
            + '<div class="cell">' + aiTags + '</div>'
            + '<div class="cell cell-time">' + task.create_at + '</div>'
            + '<div class="cell"><button class="view-btn" onclick="event.stopPropagation();viewTaskData(' + task.id + ')">查看数据 <i class="layui-icon layui-icon-right"></i></button></div>'
        + '</div>';
    }

    function renderPagination(){
        var totalPages = Math.ceil(totalTasks / 20);
        if(totalPages <= 1){
            $('#pagination').html('<div class="page-info">共 ' + totalTasks + ' 个任务</div>');
            return;
        }
        var html = '';
        html += '<div class="page-btn ' + (currentPage <= 1 ? 'disabled' : '') + '" onclick="' + (currentPage > 1 ? 'loadTasks(' + (currentPage - 1) + ')' : '') + '">上一页</div>';
        for(var i = 1; i <= totalPages; i++){
            if(i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)){
                html += '<div class="page-btn ' + (i === currentPage ? 'active' : '') + '" onclick="loadTasks(' + i + ')">' + i + '</div>';
            } else if(i === currentPage - 3 || i === currentPage + 3){
                html += '<div class="page-btn disabled">...</div>';
            }
        }
        html += '<div class="page-btn ' + (currentPage >= totalPages ? 'disabled' : '') + '" onclick="' + (currentPage < totalPages ? 'loadTasks(' + (currentPage + 1) + ')' : '') + '">下一页</div>';
        html += '<div class="page-info">共 ' + totalTasks + ' 个任务</div>';
        $('#pagination').html(html);
    }

    window.viewTaskData = function(taskId){
        layer.open({
            type: 2,
            title: false,
            area: ['95%', '90%'],
            content: '/admin/outlook/task/data?task_id=' + taskId,
            shadeClose: true
        });
    };

    createParticles();
    loadStats();
    loadTasks();
});
</script>
{% end %}
