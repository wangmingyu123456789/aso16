{% extends "layout.html" %}
{% block body %}
<div class="page-header">
    <h3>欢迎使用 智能瞭望与问数系统（管理侧）</h3>
    <p>后台管理系统 - 管理员：{{ username }}</p>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-icon" style="background:var(--gradient-primary);">
            <i class="fa fa-database"></i>
        </div>
        <div class="stat-info">
            <div class="stat-value" id="totalData">0</div>
            <div class="stat-label">总采集数据</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon" style="background:var(--gradient-processing);">
            <i class="fa fa-rss"></i>
        </div>
        <div class="stat-info">
            <div class="stat-value" id="totalSources">0</div>
            <div class="stat-label">数据源数量</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon" style="background:var(--gradient-success);">
            <i class="fa fa-tasks"></i>
        </div>
        <div class="stat-info">
            <div class="stat-value" id="totalTasks">0</div>
            <div class="stat-label">采集任务</div>
        </div>
    </div>
    <div class="stat-card">
        <div class="stat-icon" style="background:var(--gradient-purple);">
            <i class="fa fa-robot"></i>
        </div>
        <div class="stat-info">
            <div class="stat-value" id="deepProcessed">0</div>
            <div class="stat-label">深度处理完成</div>
        </div>
    </div>
</div>

<div class="dashboard-grid">
    <div class="dashboard-card">
        <div class="card-header">
            <h4><i class="fa fa-clock"></i> 最近采集数据</h4>
            <a href="/admin/outlook/data" class="card-link">查看全部</a>
        </div>
        <div class="card-body">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>标题</th>
                        <th>来源</th>
                        <th>时间</th>
                    </tr>
                </thead>
                <tbody id="recentData">
                    <tr><td colspan="3" class="empty-state">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="dashboard-card">
        <div class="card-header">
            <h4><i class="fa fa-bolt"></i> 快捷操作</h4>
        </div>
        <div class="card-body">
            <div class="quick-actions">
                <a href="/admin/outlook" class="action-btn">
                    <i class="fa fa-play-circle"></i>
                    <span>启动采集</span>
                </a>
                <a href="/admin/outlook/data" class="action-btn">
                    <i class="fa fa-table"></i>
                    <span>数据仓库</span>
                </a>
                <a href="/admin/agent" class="action-btn">
                    <i class="fa fa-robot"></i>
                    <span>数字员工</span>
                </a>
                <a href="/dashboard" class="action-btn">
                    <i class="fa fa-chart-line"></i>
                    <span>数智大屏</span>
                </a>
            </div>
        </div>
    </div>
</div>

<style>
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 20px;
    margin-bottom: 24px;
}
.stat-card {
    background: var(--bg-surface);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border: 1px solid var(--border);
    transition: all .3s;
}
.stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    border-color: var(--border-hover);
}
.stat-icon {
    width: 56px;
    height: 56px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #fff;
}
.stat-info { flex: 1; }
.stat-value {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    line-height: 1.2;
}
.stat-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 4px;
}
.dashboard-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 20px;
}
.dashboard-card {
    background: var(--bg-surface);
    border-radius: 12px;
    border: 1px solid var(--border);
    overflow: hidden;
}
.card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.card-header h4 {
    font-size: 15px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
}
.card-header h4 i { color: var(--accent); }
.card-link {
    font-size: 12px;
    color: var(--accent);
    text-decoration: none;
}
.card-body { padding: 16px 20px; }
.data-table {
    width: 100%;
    border-collapse: collapse;
}
.data-table th, .data-table td {
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
}
.data-table th {
    color: var(--text-secondary);
    font-weight: 500;
}
.data-table td { color: var(--text-primary); }
.data-table tbody tr:hover { background: rgba(255,255,255,0.02); }
.empty-state {
    text-align: center;
    color: var(--text-muted);
    padding: 30px !important;
}
.quick-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.action-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px 12px;
    background: var(--bg-tag);
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text-primary);
    transition: all .2s;
}
.action-btn:hover {
    background: var(--status-info-bg);
    border-color: var(--status-info-border);
    transform: translateY(-2px);
}
.action-btn i {
    font-size: 28px;
    color: var(--accent);
}
.action-btn span {
    font-size: 13px;
    color: var(--text-secondary);
}
@media (max-width: 900px) {
    .dashboard-grid { grid-template-columns: 1fr; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 600px) {
    .stats-grid { grid-template-columns: 1fr; }
    .quick-actions { grid-template-columns: 1fr; }
}
[data-theme="light"] .data-table tbody tr:hover { background: rgba(0,0,0,0.03); }
[data-theme="light"] .stat-icon { color: #ffffff; }
</style>
{% end %}

{% block extra_script %}
<script>
console.log('[index.html] 页面脚本开始执行');
console.log('[index.html] 检查DOM元素: #totalData=', document.getElementById('totalData'), ' #totalSources=', document.getElementById('totalSources'), ' #totalTasks=', document.getElementById('totalTasks'), ' #deepProcessed=', document.getElementById('deepProcessed'), ' #recentData=', document.getElementById('recentData'));

layui.use(['jquery'], function(){
    var $ = layui.$;
    console.log('[index.html] layui.use 回调开始, 准备发起AJAX请求到 /api/dashboard/stats');
    console.log('[index.html] 当前页面URL:', window.location.href);
    
    $.ajax({
        url: '/api/dashboard/stats',
        type: 'GET',
        dataType: 'json',
        success: function(res){
            console.log('[index.html] AJAX success, 原始返回:', JSON.stringify(res));
            if(res.code === 0){
                var d = res.data;
                console.log('[index.html] 解析data:', JSON.stringify(d));
                console.log('[index.html] 设置DOM: total_collect=' + d.total_collect + ' data_source=' + d.data_source + ' total_tasks=' + d.total_tasks + ' deep_processed=' + d.deep_processed);
                $('#totalData').text(d.total_collect || 0);
                $('#totalSources').text(d.data_source || 0);
                $('#totalTasks').text(d.total_tasks || 0);
                $('#deepProcessed').text(d.deep_processed || 0);
                console.log('[index.html] DOM元素更新后的值: #totalData=' + $('#totalData').text() + ' #totalSources=' + $('#totalSources').text() + ' #totalTasks=' + $('#totalTasks').text() + ' #deepProcessed=' + $('#deepProcessed').text());
                
                if(d.recent && d.recent.length){
                    console.log('[index.html] 最近数据: ' + d.recent.length + ' 条');
                    var html = '';
                    for(var i=0;i<d.recent.length;i++){
                        var r = d.recent[i];
                        html += '<tr><td>' + escapeHtml(r.title) + '</td><td>' + escapeHtml(r.source_name||'') + '</td><td>' + formatTime(r.create_at) + '</td></tr>';
                    }
                    $('#recentData').html(html);
                    console.log('[index.html] 最近数据表格已渲染完成');
                } else {
                    console.log('[index.html] 最近数据为空 (d.recent 不存在或长度为0), d.recent=', d.recent);
                }
            } else {
                console.error('[index.html] 后端返回错误 code=' + res.code + ' msg=' + (res.msg || '无'));
            }
        },
        error: function(xhr, status, err){
            console.error('[index.html] AJAX请求失败! HTTP状态码=' + xhr.status + ' status=' + status + ' err=' + err);
            console.error('[index.html] 响应内容:', xhr.responseText);
        },
        complete: function(){
            console.log('[index.html] AJAX请求完成');
        }
    });
});
function escapeHtml(t){ if(!t) return ''; var d=document.createElement('div'); d.appendChild(document.createTextNode(t)); return d.innerHTML; }
function formatTime(t){ if(!t) return ''; try { var p=t.split(' '), dp=p[0].split('-'), tp=p[1].split(':'); var d=new Date(Date.UTC(parseInt(dp[0]),parseInt(dp[1])-1,parseInt(dp[2]),parseInt(tp[0])+8,parseInt(tp[1]),parseInt(tp[2]))); return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')+':'+String(d.getUTCSeconds()).padStart(2,'0'); } catch(e){ return t; } }
</script>
{% end %}
