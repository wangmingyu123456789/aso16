{% extends "layout.html" %}
{% block body %}
<style>
.usage-wrap{margin:-24px;background:var(--bg-primary);min-height:calc(100vh - 100px);padding:20px 24px;}
.usage-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.usage-header h2{color:var(--text-heading);font-size:20px;display:flex;align-items:center;gap:10px;}
.usage-header h2 i{color:var(--status-processing);}
.usage-back{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--btn-secondary-bg);border:1px solid var(--btn-secondary-border);border-radius:8px;color:var(--text-secondary);font-size:13px;cursor:pointer;text-decoration:none;transition:all .3s;}
.usage-back:hover{background:var(--status-processing-bg);border-color:var(--status-processing-border);color:var(--status-processing);}
.stat-cards{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px;}
.stat-card{flex:1;min-width:180px;background:var(--bg-card);border:1px solid var(--border-color);border-radius:12px;padding:20px;text-align:center;transition:all .3s;}
.stat-card:hover{border-color:var(--status-processing);box-shadow:var(--shadow-glow);}
.stat-card .card-value{font-size:32px;font-weight:bold;color:var(--status-processing);line-height:1.2;}
.stat-card .card-value.green{color:var(--status-success);}
.stat-card .card-value.blue{color:var(--status-info);}
.stat-card .card-label{font-size:12px;color:var(--text-muted);margin-top:6px;}
.usage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;}
.usage-card{background:var(--bg-card);border:1px solid var(--border-color);border-radius:14px;padding:20px;position:relative;overflow:hidden;transition:all .3s;}
.usage-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--gradient-primary);}
.usage-card:hover{border-color:var(--status-processing);transform:translateY(-2px);box-shadow:var(--shadow-glow);}
.usage-card-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.usage-card-icon{width:44px;height:44px;border-radius:10px;background:var(--gradient-primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;flex-shrink:0;}
.usage-card-name{font-size:16px;font-weight:600;color:var(--text-heading);}
.usage-card-code{font-size:11px;color:var(--status-processing);margin-top:2px;}
.usage-card-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.usage-stat{background:var(--bg-tag);border-radius:8px;padding:12px;text-align:center;}
.usage-stat .stat-num{font-size:22px;font-weight:bold;line-height:1.2;}
.usage-stat .stat-num.green{color:var(--status-success);}
.usage-stat .stat-num.purple{color:var(--status-processing);}
.usage-stat .stat-num.orange{color:var(--status-warning);}
.usage-stat .stat-num.red{color:var(--status-error);}
.usage-stat .stat-label{font-size:10px;color:var(--text-muted);margin-top:4px;}
.usage-empty{grid-column:1/-1;text-align:center;color:var(--text-muted);padding:60px 20px;font-size:14px;}
</style>
<div class="usage-wrap">
<div class="usage-header">
<h2><i class="layui-icon layui-icon-chart"></i>数字员工调用统计</h2>
<a href="/admin/agent" class="usage-back"><i class="layui-icon layui-icon-prev"></i>返回</a>
</div>
<div class="stat-cards" id="statCards"></div>
<div class="usage-grid" id="usageGrid"></div>
</div>
{% end %}
{% block extra_script %}
<script>
layui.use(['layer'],function(){
	var $=layui.$;

	function loadUsage(){
		$.get('/admin/assistant/api?action=stats',function(res){
			if(res.code===0&&res.data){
				var data=res.data, cardsHtml='', gridHtml='';
				var totalCalls=0, totalTokens=0, enabledCount=0;
				$.each(data,function(i,a){
					totalCalls+=(a.call_count||0);
					totalTokens+=(a.total_tokens||0);
					enabledCount++;
				});
				cardsHtml+='<div class="stat-card"><div class="card-value">'+enabledCount+'</div><div class="card-label">助手总数</div></div>';
				cardsHtml+='<div class="stat-card"><div class="card-value">'+totalCalls.toLocaleString()+'</div><div class="card-label">总调用次数</div></div>';
				cardsHtml+='<div class="stat-card"><div class="card-value blue">'+totalTokens.toLocaleString()+'</div><div class="card-label">Token总消耗</div></div>';
				$('#statCards').html(cardsHtml);

				if(data.length===0){
					$('#usageGrid').html('<div class="usage-empty">暂无调用记录</div>');
					return;
				}
				$.each(data,function(i,a){
					gridHtml+='<div class="usage-card">';
					gridHtml+='<div class="usage-card-header">';
					gridHtml+='<div class="usage-card-icon"><i class="layui-icon '+(a.icon||'layui-icon-user')+'"></i></div>';
					gridHtml+='<div>';
					gridHtml+='<div class="usage-card-name">'+(a.assistant_name||'未知')+'</div>';
					gridHtml+='<div class="usage-card-code">@'+(a.assistant_code||'')+'</div>';
					gridHtml+='</div></div>';
					gridHtml+='<div class="usage-card-stats">';
					gridHtml+='<div class="usage-stat"><div class="stat-num green">'+(a.call_count||0)+'</div><div class="stat-label">调用次数</div></div>';
					gridHtml+='<div class="usage-stat"><div class="stat-num purple">'+(a.total_tokens||0)+'</div><div class="stat-label">总Token</div></div>';
					gridHtml+='<div class="usage-stat"><div class="stat-num orange">'+(a.prompt_tokens||0)+'</div><div class="stat-label">输入Token</div></div>';
					gridHtml+='<div class="usage-stat"><div class="stat-num red">'+(a.completion_tokens||0)+'</div><div class="stat-label">输出Token</div></div>';
					gridHtml+='</div></div>';
				});
				$('#usageGrid').html(gridHtml);
			}
		});
	}
	loadUsage();
});
</script>
{% end %}
