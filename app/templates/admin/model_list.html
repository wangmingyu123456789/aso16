{% extends "layout.html" %}
{% block body %}
<style>
.model-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
.model-header h3{font-size:20px;font-weight:600;color:#333;margin:0;}
.model-toolbar{display:flex;gap:8px;align-items:center;}
.model-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px;}
@media(max-width:1200px){.model-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:768px){.model-grid{grid-template-columns:1fr;}}
.model-card{background:linear-gradient(145deg,#0f1923,#16213e);border:1px solid rgba(0,212,255,0.15);border-radius:16px;padding:24px;position:relative;overflow:hidden;transition:all 0.3s;cursor:pointer;}
.model-card:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(0,212,255,0.2);border-color:rgba(0,212,255,0.4);}
.model-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,#00d4ff,#7b2ff7,#ff0080);opacity:0.8;}
.model-card.is-default::before{opacity:1;height:4px;background:linear-gradient(90deg,#00ff88,#00d4ff,#7b2ff7);}
.model-card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
.model-name{font-size:18px;font-weight:600;color:#fff;margin-bottom:4px;}
.model-code{font-size:12px;color:#00d4ff;font-family:monospace;background:rgba(0,212,255,0.1);padding:2px 8px;border-radius:4px;display:inline-block;}
.model-status{position:absolute;top:12px;right:12px;}
.badge-status{font-size:10px;padding:3px 8px;border-radius:10px;font-weight:500;}
.badge-active{background:rgba(0,255,136,0.15);color:#00ff88;}
.badge-disabled{background:rgba(255,255,255,0.1);color:#999;}
.badge-default{background:rgba(255,170,0,0.15);color:#ffaa00;}
.model-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;padding:12px;background:rgba(0,0,0,0.2);border-radius:10px;}
.stat-item{text-align:center;}
.stat-value{font-size:18px;font-weight:700;color:#00d4ff;font-family:monospace;}
.stat-label{font-size:11px;color:#666;margin-top:2px;}
.model-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;}
.model-actions .btn{flex:1;min-width:80px;padding:8px 12px;border:none;border-radius:8px;font-size:12px;cursor:pointer;transition:all 0.3s;text-align:center;}
.btn-edit{background:rgba(0,212,255,0.15);color:#00d4ff;}
.btn-edit:hover{background:rgba(0,212,255,0.3);}
.btn-test{background:rgba(123,47,247,0.15);color:#a78bfa;}
.btn-test:hover{background:rgba(123,47,247,0.3);}
.btn-default{background:rgba(255,170,0,0.15);color:#ffaa00;}
.btn-default:hover{background:rgba(255,170,0,0.3);}
.btn-delete{background:rgba(255,68,68,0.15);color:#ff4444;}
.btn-delete:hover{background:rgba(255,68,68,0.3);}
.btn-add{background:linear-gradient(135deg,#00d4ff,#7b2ff7);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:14px;cursor:pointer;transition:all 0.3s;font-weight:500;}
.btn-add:hover{opacity:0.9;transform:translateY(-1px);}
.btn-search{background:rgba(0,212,255,0.15);color:#00d4ff;border:1px solid rgba(0,212,255,0.3);padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;transition:all 0.3s;}
.btn-search:hover{background:rgba(0,212,255,0.25);}
.model-empty{text-align:center;padding:80px 20px;color:#666;}
.model-empty i{font-size:64px;color:#333;margin-bottom:16px;display:block;}
.model-page-bar{display:flex;justify-content:center;margin-top:24px;padding:16px 0;}
</style>

<div class="model-header">
    <div>
        <h3><i class="layui-icon layui-icon-engine" style="font-size:22px;"></i> 模型引擎</h3>
        <p style="color:#999;font-size:13px;margin-top:4px;">管理AI模型服务，支持OpenAI-API范式接入</p>
    </div>
    <div class="model-toolbar">
        <input type="text" id="searchKeyword" placeholder="搜索模型..." style="width:200px;height:34px;padding:0 12px;border:1px solid rgba(0,212,255,0.3);border-radius:8px;background:rgba(0,0,0,0.2);color:#fff;font-size:13px;">
        <button class="btn-search" id="btnSearch"><i class="layui-icon layui-icon-search"></i> 搜索</button>
        <button class="btn-add" id="btnAdd"><i class="layui-icon layui-icon-addition"></i> 新增模型</button>
    </div>
</div>

<div id="modelGrid" class="model-grid"></div>
<div id="pageContainer" class="model-page-bar"></div>
{% end %}

{% block extra_script %}
<script>
var currentPage = 1;
var pageSize = 6;
var currentKeyword = '';

function getCsrfToken(){
    var cookies = document.cookie.split(';');
    for(var i=0;i<cookies.length;i++){
        var c = cookies[i].trim();
        if(c.indexOf('_xsrf=') === 0) return decodeURIComponent(c.substring(6));
    }
    return '';
}

layui.use(['layer','laypage','form'], function(){
    var layer = layui.layer;
    var laypage = layui.laypage;
    var $ = layui.$;
    var loadingIndex = null;

    function loadData(page, keyword){
        page = page || 1;
        keyword = keyword || '';
        var url = '/admin/models/api?page=' + page + '&page_size=' + pageSize + '&keyword=' + encodeURIComponent(keyword);
        loadingIndex = layer.load(1, {shade: [0.3, '#000']});
        $.get(url, function(res){
            if(loadingIndex) layer.close(loadingIndex);
            loadingIndex = null;
            if(res.code === 0){
                renderGrid(res.data, res.count, page);
            }
        }).fail(function(){
            if(loadingIndex) layer.close(loadingIndex);
            loadingIndex = null;
        });
    }

    function renderGrid(data, total, page){
        var html = '';
        if(data.length === 0){
            html = '<div class="model-empty" style="grid-column:1/-1;"><i class="layui-icon layui-icon-face-surprised"></i><p>暂无模型数据</p><button class="btn-add" onclick="showAddForm()" style="margin-top:16px;"><i class="layui-icon layui-icon-addition"></i> 新增模型</button></div>';
        } else {
            data.forEach(function(m){
                var statusBadge = m.status == 1 ? '<span class="badge-status badge-active">运行中</span>' : '<span class="badge-status badge-disabled">已禁用</span>';
                var defaultBadge = m.is_system_default == 1 ? '<span class="badge-status badge-default">系统默认</span>' : '';
                var statusHtml = statusBadge + (defaultBadge ? ' ' + defaultBadge : '');
                
                html += '<div class="model-card' + (m.is_system_default == 1 ? ' is-default' : '') + '" data-id="' + m.id + '">' +
                    '<div class="model-status">' + statusHtml + '</div>' +
                    '<div class="model-card-header">' +
                        '<div>' +
                            '<div class="model-name">' + escapeHtml(m.name) + '</div>' +
                            '<span class="model-code">' + escapeHtml(m.code) + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="model-stats">' +
                        '<div class="stat-item"><div class="stat-value">' + m.total_requests + '</div><div class="stat-label">请求次数</div></div>' +
                        '<div class="stat-item"><div class="stat-value">' + formatTokens(m.total_tokens) + '</div><div class="stat-label">总Token</div></div>' +
                        '<div class="stat-item"><div class="stat-value">' + formatTokens(m.prompt_tokens) + '/' + formatTokens(m.completion_tokens) + '</div><div class="stat-label">P/C Token</div></div>' +
                    '</div>' +
                    '<div style="font-size:11px;color:#555;margin-bottom:8px;word-break:break-all;">' + escapeHtml(m.api_url || '') + '</div>' +
                    '<div class="model-actions">' +
                        '<button class="btn btn-edit" onclick="showEditForm(' + m.id + ')"><i class="layui-icon layui-icon-edit"></i> 编辑</button>' +
                        '<button class="btn btn-test" onclick="showChatTest(' + m.id + ',\'' + escapeHtml(m.code) + '\')"><i class="layui-icon layui-icon-dialogue"></i> 测试</button>' +
                        (m.is_system_default != 1 ? '<button class="btn btn-default" onclick="setDefault(' + m.id + ')"><i class="layui-icon layui-icon-star"></i> 设为默认</button>' : '<button class="btn btn-default" disabled style="opacity:0.3;"><i class="layui-icon layui-icon-star-fill"></i> 默认中</button>') +
                        '<button class="btn btn-delete" onclick="deleteModel(' + m.id + ')"><i class="layui-icon layui-icon-delete"></i> 删除</button>' +
                    '</div>' +
                '</div>';
            });
        }
        $('#modelGrid').html(html);

        laypage.render({
            elem: 'pageContainer',
            count: total,
            limit: pageSize,
            curr: page,
            layout: ['prev', 'page', 'next', 'skip', 'count'],
            limits: [6, 12, 24],
            jump: function(obj, first){
                if(!first){
                    pageSize = obj.limit;
                    currentPage = obj.curr;
                    loadData(obj.curr, currentKeyword);
                }
            }
        });
    }

    function escapeHtml(text){
        if(!text) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    function formatTokens(n){
        if(!n || n == 0) return '0';
        if(n >= 1000000) return (n/1000000).toFixed(1) + 'M';
        if(n >= 1000) return (n/1000).toFixed(1) + 'K';
        return n.toString();
    }

    window.showAddForm = function(){
        showForm();
    };

    window.showEditForm = function(modelId){
        $.get('/admin/models/api?page=1&page_size=100', function(res){
            if(res.code === 0){
                var model = null;
                for(var i=0; i<res.data.length; i++){
                    if(res.data[i].id == modelId){
                        model = res.data[i];
                        break;
                    }
                }
                if(model) showForm(model);
                else layer.msg('模型数据不存在', {icon:2});
            }
        });
    };

    function showForm(m){
        m = m || {};
        var isEdit = !!m.id;
        var title = isEdit ? '编辑模型' : '新增模型';

        var html = '<form class="layui-form" id="modelForm" style="padding:20px;">' +
            '<input type="hidden" name="_xsrf" value="' + getCsrfToken() + '">' +
            (isEdit ? '<input type="hidden" name="id" value="' + m.id + '">' : '') +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">模型名称</label>' +
                '<div class="layui-input-block">' +
                    '<input type="text" name="name" value="' + escapeHtml(m.name || '') + '" class="layui-input" required lay-verify="required" placeholder="如：DeepSeek V3">' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">模型编码</label>' +
                '<div class="layui-input-block">' +
                    '<input type="text" name="code" value="' + escapeHtml(m.code || '') + '" class="layui-input" required lay-verify="required" placeholder="如：deepseek-v3"' + (isEdit ? ' readonly style="background:#f5f5f5;"' : '') + '>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">API地址</label>' +
                '<div class="layui-input-block">' +
                    '<input type="text" name="api_url" value="' + escapeHtml(m.api_url || 'https://aigc-api.aitoolcore.com/api/v1/chat/completions') + '" class="layui-input" placeholder="OpenAI-API兼容地址">' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">API Key</label>' +
                '<div class="layui-input-block">' +
                    '<input type="text" name="api_key" value="' + escapeHtml(m.api_key || '') + '" class="layui-input" placeholder="Bearer Token">' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">状态</label>' +
                '<div class="layui-input-block">' +
                    '<input type="radio" name="status" value="1" title="启用" ' + (m.status != 0 ? 'checked' : '') + '>' +
                    '<input type="radio" name="status" value="0" title="禁用" ' + (m.status == 0 ? 'checked' : '') + '>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item" style="text-align:right;margin-bottom:0;">' +
                '<button type="button" class="layui-btn layui-btn-normal" id="submitModelBtn">保存</button>' +
                '<button type="button" class="layui-btn layui-btn-primary" id="cancelModelBtn">取消</button>' +
            '</div>' +
        '</form>';

        layer.open({
            type: 1,
            title: title,
            area: ['550px', '480px'],
            content: html,
            success: function(){
                layui.form.render();
                $('#submitModelBtn').on('click', function(){
                    var formData = $('#modelForm').serialize();
                    var url = isEdit ? '/admin/models/edit' : '/admin/models/add';
                    $.post(url, formData, function(res){
                        if(res.code === 0){
                            layer.msg(isEdit ? '修改成功' : '新增成功', {icon:1});
                            layer.closeAll();
                            loadData(currentPage, currentKeyword);
                        } else {
                            layer.msg(res.msg, {icon:2});
                        }
                    });
                });
                $('#cancelModelBtn').on('click', function(){
                    layer.closeAll();
                });
            }
        });
    }

    window.deleteModel = function(id){
        layer.confirm('确定要删除该模型吗？', function(index){
            $.post('/admin/models/delete', {id: id, _xsrf: getCsrfToken()}, function(res){
                if(res.code === 0){
                    layer.msg('删除成功', {icon:1});
                    loadData(currentPage, currentKeyword);
                } else {
                    layer.msg(res.msg, {icon:2});
                }
            });
            layer.close(index);
        });
    };

    window.setDefault = function(id){
        layer.confirm('确定要将该模型设置为系统默认吗？设置后全局优先调用该模型。', function(index){
            $.post('/admin/models/set_default', {id: id, _xsrf: getCsrfToken()}, function(res){
                if(res.code === 0){
                    layer.msg('设置成功', {icon:1});
                    loadData(currentPage, currentKeyword);
                } else {
                    layer.msg(res.msg, {icon:2});
                }
            });
            layer.close(index);
        });
    };

    window.showChatTest = function(modelId, modelCode){
        var testHtml = '<div style="padding:16px;">' +
            '<div style="margin-bottom:12px;color:#666;font-size:13px;">测试模型：<span style="color:#00d4ff;">' + escapeHtml(modelCode) + '</span></div>' +
            '<div id="chatMessages" style="height:300px;overflow-y:auto;background:#0f1923;border-radius:8px;padding:12px;margin-bottom:12px;"></div>' +
            '<div style="display:flex;gap:8px;">' +
                '<input type="text" id="chatInput" placeholder="输入测试消息..." style="flex:1;height:36px;padding:0 12px;border:1px solid rgba(0,212,255,0.3);border-radius:8px;background:rgba(0,0,0,0.2);color:#fff;font-size:13px;" onkeypress="if(event.keyCode==13)sendChatTest(' + modelId + ')">' +
                '<button class="layui-btn layui-btn-sm layui-btn-normal" id="btnSendChat" onclick="sendChatTest(' + modelId + ')"><i class="layui-icon layui-icon-release"></i> 发送</button>' +
            '</div>' +
        '</div>';

        layer.open({
            type: 1,
            title: '<i class="layui-icon layui-icon-dialogue"></i> 模型对话测试',
            area: ['600px', '500px'],
            content: testHtml,
            success: function(){
                addChatMessage('system', '模型测试已就绪，请输入消息进行测试。');
                $('#chatInput').focus();
            }
        });
    };

    window.sendChatTest = function(modelId){
        var input = $('#chatInput');
        var msg = input.val().trim();
        if(!msg) return;
        input.val('');
        addChatMessage('user', msg);
        addChatMessage('loading', '思考中...');

        $.post('/admin/models/chat_test', {model_id: modelId, message: msg, _xsrf: getCsrfToken()}, function(res){
            $('#chatMessages .chat-msg:last').remove();
            if(res.code === 0){
                var usage = res.data.usage;
                var usageHtml = '<div style="font-size:11px;color:#666;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.1);">Token: ' + usage.prompt_tokens + ' (prompt) + ' + usage.completion_tokens + ' (completion) = ' + usage.total_tokens + ' (total)</div>';
                addChatMessage('assistant', escapeHtml(res.data.content) + usageHtml, true);
            } else {
                addChatMessage('error', '错误：' + res.msg);
            }
        }).fail(function(){
            $('#chatMessages .chat-msg:last').remove();
            addChatMessage('error', '请求失败，请检查网络连接');
        });
    };

    function addChatMessage(role, content, rawHtml){
        var color = '#fff';
        var bg = 'rgba(0,212,255,0.1)';
        var align = 'flex-start';
        var label = '';
        if(role === 'user'){
            color = '#00d4ff';
            bg = 'rgba(0,212,255,0.15)';
            align = 'flex-end';
            label = '我';
        } else if(role === 'assistant'){
            color = '#a78bfa';
            bg = 'rgba(123,47,247,0.15)';
            label = 'AI';
        } else if(role === 'error'){
            color = '#ff4444';
            bg = 'rgba(255,68,68,0.15)';
            label = '错误';
        } else if(role === 'loading'){
            color = '#666';
            bg = 'rgba(255,255,255,0.05)';
            label = '加载中';
        } else {
            color = '#00ff88';
            bg = 'rgba(0,255,136,0.1)';
            label = '系统';
        }
        var displayContent = rawHtml ? content : escapeHtml(content);
        var html = '<div class="chat-msg" style="display:flex;flex-direction:column;align-items:' + align + ';margin-bottom:12px;">' +
            '<div style="font-size:11px;color:#555;margin-bottom:4px;">' + label + '</div>' +
            '<div style="background:' + bg + ';color:' + color + ';padding:10px 14px;border-radius:10px;max-width:85%;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;">' + displayContent + '</div>' +
        '</div>';
        var container = document.getElementById('chatMessages');
        container.insertAdjacentHTML('beforeend', html);
        container.scrollTop = container.scrollHeight;
    }

    $('#btnSearch').on('click', function(){
        currentKeyword = $('#searchKeyword').val();
        loadData(1, currentKeyword);
    });

    $('#btnAdd').on('click', function(){
        showAddForm();
    });

    loadData(1, '');
});
</script>
{% end %}
