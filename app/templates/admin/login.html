<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{static_url('dist/layui-v2.13.6/layui-v2.13.6/layui/css/layui.css')}}">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        html,body{height:100%;width:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;}
        body{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#e8f4f8 0%,#b8d4e8 30%,#4a9bd9 60%,#1a6fb5 100%);position:relative;overflow:hidden;}
        .bg-layer{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
        .bg-shape{position:absolute;background:rgba(255,255,255,0.08);}
        .bg-shape-1{width:600px;height:600px;top:-200px;right:-150px;transform:rotate(35deg);border-radius:30px;background:linear-gradient(135deg,rgba(255,255,255,0.12),rgba(255,255,255,0.03));}
        .bg-shape-2{width:450px;height:450px;bottom:-120px;left:-100px;transform:rotate(50deg);border-radius:25px;background:linear-gradient(135deg,rgba(255,255,255,0.1),rgba(255,255,255,0.04));}
        .bg-shape-3{width:350px;height:350px;top:30%;left:15%;transform:rotate(25deg);border-radius:20px;background:linear-gradient(135deg,rgba(255,255,255,0.08),rgba(255,255,255,0.02));}
        .bg-shape-4{width:200px;height:200px;top:10%;right:30%;transform:rotate(60deg);border-radius:15px;background:rgba(255,255,255,0.06);}
        .bg-shape-5{width:150px;height:150px;bottom:20%;right:20%;transform:rotate(40deg);border-radius:12px;background:rgba(255,255,255,0.05);}
        .bg-line{position:absolute;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.12),transparent);height:2px;}
        .bg-line-1{width:200px;top:25%;right:10%;transform:rotate(-30deg);}
        .bg-line-2{width:150px;bottom:35%;left:8%;transform:rotate(20deg);}
        .bg-dot{position:absolute;width:6px;height:6px;background:rgba(255,255,255,0.25);border-radius:50%;}
        .bg-dot-1{top:12%;right:28%;}
        .bg-dot-2{top:70%;right:40%;}
        .bg-dot-3{bottom:15%;left:35%;}
        .login-card{position:relative;z-index:10;width:420px;max-width:90vw;background:#ffffff;border-radius:10px;padding:44px 40px;box-shadow:0 12px 40px rgba(0,0,0,0.12),0 4px 12px rgba(0,0,0,0.06);}
        .login-title{text-align:center;margin-bottom:32px;}
        .login-title h2{font-size:20px;font-weight:600;color:#1a1a2e;margin-bottom:4px;letter-spacing:1px;}
        .login-title p{font-size:12px;color:#a0a8b8;letter-spacing:1px;}
        .form-item{margin-bottom:18px;}
        .form-item .f-input{width:100%;height:44px;padding:0 14px;border:1.5px solid #b0d4f1;border-radius:8px;font-size:14px;color:#333;background:#f9fcff;outline:none;transition:all .25s;}
        .form-item .f-input:focus{border-color:#4a9bd9;background:#fff;box-shadow:0 0 0 3px rgba(74,155,217,0.12);}
        .form-item .f-input::placeholder{color:#b0bec5;}
        .role-option{display:flex;align-items:center;margin-bottom:22px;padding:0 2px;}
        .role-option label{display:flex;align-items:center;cursor:pointer;user-select:none;}
        .role-option input[type="radio"]{display:none;}
        .role-dot{width:14px;height:14px;border:2px solid #c8d6e0;border-radius:50%;margin-right:8px;position:relative;transition:all .25s;}
        .role-option input:checked+.role-dot{border-color:#4a9bd9;}
        .role-option input:checked+.role-dot::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:7px;height:7px;background:#4a9bd9;border-radius:50%;}
        .role-text{font-size:13px;color:#7a8a9e;}
        .role-option input:checked~.role-text{color:#4a9bd9;}
        .login-btn{width:100%;height:44px;background:linear-gradient(135deg,#2fb8c8 0%,#1ea8b8 100%);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:500;letter-spacing:3px;cursor:pointer;transition:all .3s;position:relative;overflow:hidden;}
        .login-btn:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 6px 20px rgba(47,184,200,0.3);}
        .login-btn:active{transform:translateY(0);}
        .reg-link{text-align:center;margin-top:16px;}
        .reg-link a{font-size:12px;color:#a0a8b8;text-decoration:none;transition:color .25s;}
        .reg-link a:hover{color:#4a9bd9;}
        .error-tip{background:#fff5f5;border:1px solid #ffe0e0;border-radius:8px;padding:10px 14px;margin-bottom:16px;color:#e53e3e;font-size:13px;display:none;}
        .error-tip.show{display:block;}
        .login-footer{position:fixed;bottom:20px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.4);font-size:11px;letter-spacing:1px;z-index:10;}
        @media(max-width:480px){.login-card{padding:32px 24px;border-radius:8px;}.login-title h2{font-size:18px;}}
    </style>
</head>
<body>
    <div class="bg-layer">
        <div class="bg-shape bg-shape-1"></div>
        <div class="bg-shape bg-shape-2"></div>
        <div class="bg-shape bg-shape-3"></div>
        <div class="bg-shape bg-shape-4"></div>
        <div class="bg-shape bg-shape-5"></div>
        <div class="bg-line bg-line-1"></div>
        <div class="bg-line bg-line-2"></div>
        <div class="bg-dot bg-dot-1"></div>
        <div class="bg-dot bg-dot-2"></div>
        <div class="bg-dot bg-dot-3"></div>
    </div>

    <div class="login-card">
        <div class="login-title">
            <h2>AI智能瞭望系统</h2>
            <p>管理后台登录</p>
        </div>

        {% if error %}
        <div class="error-tip show">{{ error }}</div>
        {% end %}

        <form method="post" action="/admin/login">
            {% module xsrf_form_html() %}

            <div class="form-item">
                <input type="text" name="username" class="f-input" placeholder="请输入账号" autocomplete="off">
            </div>

            <div class="form-item">
                <input type="password" name="password" class="f-input" placeholder="请输入密码" autocomplete="off">
            </div>

            <div class="role-option">
                <label>
                    <input type="radio" name="login_type" value="admin" checked>
                    <span class="role-dot"></span>
                    <span class="role-text">管理员</span>
                </label>
                <label style="margin-left:24px;">
                    <input type="radio" name="login_type" value="user">
                    <span class="role-dot"></span>
                    <span class="role-text">普通用户（需授权）</span>
                </label>
            </div>

            <button type="submit" class="login-btn">登 录</button>
        </form>

        <div class="reg-link">
            <a href="/auth/register">注册新用户</a>
        </div>
    </div>

    <div class="login-footer">
        AI智能瞭望与智能问数系统 &copy; 2026
    </div>

    <script src="{{static_url('dist/layui-v2.13.6/layui-v2.13.6/layui/layui.js')}}"></script>
</body>
</html>
