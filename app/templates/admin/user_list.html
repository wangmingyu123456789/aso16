{% extends "layout.html" %}
{% block body %}
<style>
.layui-card{background:var(--bg-card)!important;border:1px solid var(--border-color)!important;}
.layui-card-header{background:var(--bg-card)!important;border-bottom:1px solid var(--border-color)!important;color:var(--text-heading)!important;}
.layui-card-body{background:var(--bg-card)!important;}
.layui-table-view{background:var(--bg-card)!important;border-color:var(--border-color)!important;}
.layui-table{background:var(--bg-card)!important;color:var(--text-primary)!important;}
.layui-table thead{background:var(--bg-table-header)!important;}
.layui-table thead th{background:var(--bg-table-header)!important;color:var(--text-secondary)!important;border-color:var(--border-color)!important;}
.layui-table tbody td{background:var(--bg-card)!important;color:var(--text-primary)!important;border-color:var(--border-color)!important;}
.layui-table tbody tr:hover{background:var(--bg-table-row-hover)!important;}
.layui-table-page{background:var(--bg-card)!important;border-color:var(--border-color)!important;color:var(--text-secondary)!important;}
.layui-table-page a{color:var(--text-primary)!important;}
.layui-table-page .layui-laypage .layui-laypage-curr .layui-laypage-em{background:#16b777!important;}
.layui-table-page .layui-laypage a,.layui-table-page .layui-laypage span{background:var(--bg-card)!important;color:var(--text-primary)!important;border-color:var(--border-color)!important;}
.layui-table-page .layui-laypage input{background:#fff!important;color:#333!important;border-color:#e6e6e6!important;}
.layui-table-page .layui-laypage button{background:#16b777!important;color:#fff!important;border-color:transparent!important;}
.layui-table-view .layui-table td[data-field]{color:var(--text-primary)!important;}
.layui-table-view .layui-table th[data-field]{color:var(--text-secondary)!important;}
.layui-table-box{border-color:var(--border-color)!important;background:var(--bg-card)!important;}
.layui-table-header{background:var(--bg-table-header)!important;border-color:var(--border-color)!important;}
.layui-table-tool{background:var(--bg-card)!important;border-color:var(--border-color)!important;}
.layui-input{background:var(--bg-input)!important;color:var(--text-primary)!important;border-color:var(--border-color)!important;}
.layui-input::placeholder{color:var(--text-placeholder)!important;}
.layui-table-page select{background:var(--bg-input)!important;color:var(--text-primary)!important;border-color:var(--border-color)!important;}
.layui-table-page select option{background:var(--bg-card)!important;color:var(--text-primary)!important;}
.layui-table-page .layui-laypage-limits select{background:var(--bg-input)!important;color:var(--text-primary)!important;border-color:var(--border-color)!important;}
.layui-table-page .layui-laypage-limits select option{background:var(--bg-card)!important;color:var(--text-primary)!important;}
.layui-laypage-limits select{background:var(--bg-input)!important;color:var(--text-primary)!important;border-color:var(--border-color)!important;}
.layui-laypage-limits select option{background:var(--bg-card)!important;color:var(--text-primary)!important;}
</style>
<div class="page-header">
    <h3>用户管理</h3>
    <p>管理系统所有用户，支持新增、编辑、删除、批量操作等功能</p>
</div>

<div class="layui-card">
    <div class="layui-card-header">
        <div style="display:flex;justify-content:space-between;align-items:center;">
            <span>用户列表</span>
            <button class="layui-btn layui-btn-sm layui-btn-normal" id="btnAdd">
                <i class="layui-icon layui-icon-addition"></i> 新增用户
            </button>
        </div>
    </div>
    <div class="layui-card-body">
        <div style="margin-bottom:16px;">
            <div class="layui-inline">
                <input type="text" id="searchKeyword" placeholder="搜索用户名" class="layui-input" style="width:200px;height:32px;">
            </div>
            <button class="layui-btn layui-btn-sm" id="btnSearch"><i class="layui-icon layui-icon-search"></i> 搜索</button>
            <button class="layui-btn layui-btn-sm layui-btn-danger" id="btnBatchDelete" style="margin-left:10px;"><i class="layui-icon layui-icon-delete"></i> 批量删除</button>
        </div>
        <table class="layui-hide" id="userTable" lay-filter="userTable"></table>
        <div id="pageWrap" style="display:flex;align-items:center;justify-content:flex-end;margin-top:16px;">
            <div id="pageContainer"></div>
        </div>
    </div>
</div>
{% end %}

{% block extra_script %}
<script>
var currentPage = 1;
var checkedIds = [];
var currentKeyword = '';
var allRoles = []; // 存储所有角色
var pageSize = 4; // 每页显示数量

function escapeHtml(text){
    if(!text) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(text));
    return div.innerHTML;
}

var roleTpl = function(d){
    var role = allRoles.find(function(r){ return r.code === d.role; });
    var roleName = role ? role.name : d.role;
    var badgeClass = 'layui-bg-green';
    if(d.role === 'admin'){
        badgeClass = 'layui-bg-red';
    } else if(d.role === 'manager'){
        badgeClass = 'layui-bg-blue';
    }
    return '<span class="layui-badge ' + badgeClass + '">' + roleName + '</span>';
};

var statusTpl = function(d){
    if(d.status === 1){
        return '<span class="layui-badge layui-bg-green">正常</span>';
    }
    return '<span class="layui-badge layui-bg-gray">禁用</span>';
};

var actionTpl = function(d){
    if(d.username === 'admin'){
        return '<a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 修改密码</a>' +
            '<span style="color:var(--text-muted);font-size:12px;margin-left:8px;">超级管理员</span>';
    }
    return '<a class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 编辑</a>' +
        '<a class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete"><i class="layui-icon layui-icon-delete"></i> 删除</a>';
};

layui.use(['table','form','layer'], function(){
    var table = layui.table;
    var form = layui.form;
    var layer = layui.layer;
    var $ = layui.$;

    // 加载角色列表
    function loadRoles(){
        $.get('/admin/users/roles_api',function(res){
            if(res.code === 0){
                allRoles = res.data;
                // 角色加载完成后初始化表格
                initTable();
            }
        });
    }

    // 初始化表格
    function initTable(){
        table.render({
            elem: '#userTable',
            url: '/admin/users/api',
            page: {
                curr: 1,
                prevText: '&#x4E0A;&#x4E00;&#x9875;',
                nextText: '&#x4E0B;&#x4E00;&#x9875;',
                layout: ['prev', 'page', 'next', 'skip', 'count', 'limit'],
                limits: [4, 10, 20, 50],
                limit: pageSize
            },
            cols: [[
                {type:'checkbox',width:50,align:'center'},
                {field:'id',title:'ID',width:80,align:'center',sort:true},
                {field:'username',title:'用户名',align:'center'},
                {field:'role',title:'角色',width:160,align:'center',templet:roleTpl},
                {field:'status',title:'状态',width:160,align:'center',templet:statusTpl},
                {field:'create_at',title:'创建时间',width:200,align:'center'},
                {title:'操作',width:180,align:'center',templet:actionTpl,fixed:'right'}
            ]],
            skin: 'line',
            done: function(res, page, count){
                currentPage = page;
                setTimeout(function(){
                    var $ = layui.$;
                    document.documentElement.style.colorScheme = (localStorage.getItem('admin_theme') || 'dark');
                    $('.layui-laypage-limits select').css({'background':'#1a2332','color':'#fff','border-color':'rgba(255,255,255,0.1)'});
                    $('.layui-laypage .layui-laypage-prev').each(function(){
                        if($(this).text().trim() === '' || /[\u2039\u203A‹›\u00ab\u00bb]/.test($(this).text())){
                            $(this).html('上一页');
                        }
                    });
                    $('.layui-laypage .layui-laypage-next').each(function(){
                        if($(this).text().trim() === '' || /[\u2039\u203A‹›\u00ab\u00bb]/.test($(this).text())){
                            $(this).html('下一页');
                        }
                    });
                }, 100);
            }
        });
    }

    table.on('checkbox(userTable)', function(obj){
        if(obj.type === 'all'){
            if(obj.checked){
                checkedIds = [];
                $.each(table.cache['userTable'], function(i,item){
                    checkedIds.push(item.id);
                });
            } else {
                checkedIds = [];
            }
        } else {
            if(obj.checked){
                checkedIds.push(obj.data.id);
            } else {
                var idx = checkedIds.indexOf(obj.data.id);
                if(idx > -1) checkedIds.splice(idx,1);
            }
        }
    });

    loadRoles();

    $('#btnSearch').on('click',function(){
        currentKeyword = $('#searchKeyword').val();
        table.reload('userTable', {
            where: {
                keyword: currentKeyword
            },
            page: {
                curr: 1
            }
        });
    });

    $('#btnAdd').on('click',function(){
        showAddForm();
    });

    table.on('tool(userTable)', function(obj){
        var data = obj.data;
        if(obj.event === 'edit'){
            showEditForm(data);
        } else if(obj.event === 'delete'){
            layer.confirm('确定要删除该用户吗？',function(index){
                $.post('/admin/users/delete',{id:data.id,_xsrf:getCsrfToken()},function(res){
                    if(res.code === 0){
                        layer.msg('删除成功',{icon:1});
                        // 刷新表格
                        table.reload('userTable', {
                            where: {
                                keyword: currentKeyword
                            },
                            page: {
                                curr: 1
                            }
                        });
                    } else {
                        layer.msg(res.msg,{icon:2});
                    }
                });
                layer.close(index);
            });
        }
    });

    $('#btnBatchDelete').on('click',function(){
        var checkStatus = table.checkStatus('userTable');
        var ids = [];
        $.each(checkStatus.data,function(i,item){
            ids.push(item.id);
        });
        if(ids.length === 0){
            layer.msg('请先选择要删除的用户',{icon:0});
            return;
        }
        layer.confirm('确定要删除选中的 '+ids.length+' 个用户吗？',function(index){
            $.post('/admin/users/batch_delete',{ids:JSON.stringify(ids),_xsrf:getCsrfToken()},function(res){
                if(res.code === 0){
                    layer.msg('批量删除成功',{icon:1});
                    checkedIds = [];
                    // 刷新表格
                    table.reload('userTable', {
                        where: {
                            keyword: currentKeyword
                        },
                        page: {
                            curr: 1
                        }
                    });
                } else {
                    layer.msg(res.msg,{icon:2});
                }
            });
            layer.close(index);
        });
    });

    function showAddForm(){
        // 生成角色选项（排除超级管理员）
        var roleOptions = '';
        allRoles.forEach(function(r){
            if(r.code === 'admin') return; // 超级管理员不能分配给其他用户
            roleOptions += '<option value="' + r.code + '">' + r.name + ' (' + r.code + ')</option>';
        });

        var html = '<form class="layui-form" id="addForm" style="padding:20px;" lay-filter="addForm">' +
            '<input type="hidden" name="_xsrf" value=\'' + getCsrfToken() + '\'>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">用户名</label>' +
                '<div class="layui-input-block">' +
                    '<input type="text" name="username" required lay-verify="required" placeholder="请输入用户名" class="layui-input">' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">密码</label>' +
                '<div class="layui-input-block">' +
                    '<input type="password" name="password" required lay-verify="required" placeholder="请输入密码" class="layui-input">' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">角色</label>' +
                '<div class="layui-input-block">' +
                    '<select name="role">' + roleOptions + '</select>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">状态</label>' +
                '<div class="layui-input-block">' +
                    '<input type="checkbox" name="status" lay-skin="switch" lay-text="正常|禁用" value="1" checked>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">登录管理</label>' +
                '<div class="layui-input-block">' +
                    '<input type="checkbox" name="can_login_admin" lay-skin="switch" lay-text="允许|禁止" value="1">' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item" style="text-align:right;margin-bottom:0;">' +
                '<button type="button" class="layui-btn layui-btn-normal" id="submitAddBtn">确定</button>' +
                '<button type="button" class="layui-btn layui-btn-primary" id="cancelAddBtn">取消</button>' +
            '</div>' +
        '</form>';

        layer.open({
            type: 1,
            title: '新增用户',
            area: ['500px','420px'],
            content: html,
            success: function(){
                form.render();
                $('#submitAddBtn').on('click',function(){
                    var usernameVal = $('input[name="username"]').val().trim();
                    if(usernameVal.toLowerCase() === 'admin'){
                        layer.msg('不能创建用户名为admin的用户',{icon:2});
                        return;
                    }
                    var formData = $('#addForm').serialize();
                    // 处理checkbox未选中时不发送值的问题
                    if(!$('input[name="status"]').is(':checked')){
                        formData += '&status=0';
                    }
                    if($('input[name="can_login_admin"]').is(':checked')){
                        formData += '&can_login_admin=1';
                    } else {
                        formData += '&can_login_admin=0';
                    }
                    $.post('/admin/users/add',formData,function(res){
                        if(res.code === 0){
                            layer.msg('新增成功',{icon:1});
                            layer.closeAll();
                            // 刷新表格，回到第一页
                            table.reload('userTable', {
                                where: {
                                    keyword: currentKeyword
                                },
                                page: {
                                    curr: 1
                                }
                            });
                        } else {
                            layer.msg(res.msg,{icon:2});
                        }
                    });
                });
                $('#cancelAddBtn').on('click',function(){
                    layer.closeAll();
                });
            }
        });
    }

    function showEditForm(data){
        var statusChecked = data.status === 1 ? 'checked' : '';
        var isSuperAdmin = (data.username === 'admin');

        // 生成角色选项（排除超级管理员）
        var roleOptions = '';
        allRoles.forEach(function(r){
            if(r.code === 'admin') return; // 超级管理员不能分配给其他用户
            var selected = (r.code === data.role) ? 'selected' : '';
            roleOptions += '<option value="' + r.code + '" ' + selected + '>' + r.name + ' (' + r.code + ')</option>';
        });

        var html = '<form class="layui-form" id="editForm" style="padding:20px;" lay-filter="editForm">' +
            '<input type="hidden" name="_xsrf" value=\'' + getCsrfToken() + '\'>' +
            '<input type="hidden" name="id" value="' + data.id + '">' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">用户名</label>' +
                '<div class="layui-input-block">' +
                    '<input type="text" name="username" value="' + escapeHtml(data.username) + '" class="layui-input"' + (isSuperAdmin ? ' disabled' : ' required lay-verify="required"') + '>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">' + (isSuperAdmin ? '新密码' : '密码') + '</label>' +
                '<div class="layui-input-block">' +
                    '<input type="password" name="password" placeholder="' + (isSuperAdmin ? '请输入新密码' : '留空则不修改密码') + '" class="layui-input"' + (isSuperAdmin ? ' required lay-verify="required"' : '') + '>' +
                '</div>' +
            '</div>';

        if(!isSuperAdmin){
            var canLoginChecked = (data.can_login_admin == 1) ? 'checked' : '';
            html += '<div class="layui-form-item">' +
                '<label class="layui-form-label">角色</label>' +
                '<div class="layui-input-block">' +
                    '<select name="role">' + roleOptions + '</select>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">状态</label>' +
                '<div class="layui-input-block">' +
                    '<input type="checkbox" name="status" lay-skin="switch" lay-text="正常|禁用" value="1" ' + statusChecked + '>' +
                '</div>' +
            '</div>' +
            '<div class="layui-form-item">' +
                '<label class="layui-form-label">登录管理</label>' +
                '<div class="layui-input-block">' +
                    '<input type="checkbox" name="can_login_admin" lay-skin="switch" lay-text="允许|禁止" value="1" ' + canLoginChecked + '>' +
                '</div>' +
            '</div>';
        }

        html += '<div class="layui-form-item" style="text-align:right;margin-bottom:0;">' +
                '<button type="button" class="layui-btn layui-btn-normal" id="submitEditBtn">确定</button>' +
                '<button type="button" class="layui-btn layui-btn-primary" id="cancelEditBtn">取消</button>' +
            '</div>' +
        '</form>';

        layer.open({
            type: 1,
            title: '编辑用户',
            area: ['500px','460px'],
            content: html,
            success: function(){
                form.render();
                $('#submitEditBtn').on('click',function(){
                    var formData = $('#editForm').serialize();
                    // 处理checkbox未选中时不发送值的问题
                    if(!$('input[name="status"]').is(':checked')){
                        formData += '&status=0';
                    }
                    if(!$('input[name="can_login_admin"]').is(':checked')){
                        formData += '&can_login_admin=0';
                    }
                    $.post('/admin/users/edit',formData,function(res){
                        if(res.code === 0){
                            if(formData.includes('password') && $('input[name="password"]').val()){
                                layer.msg('密码修改成功',{icon:1,time:2000});
                            } else {
                                layer.msg('修改成功',{icon:1,time:2000});
                            }
                            layer.closeAll();
                            // 刷新表格
                            table.reload('userTable', {
                                where: {
                                    keyword: currentKeyword
                                },
                                page: {
                                    curr: 1
                                }
                            });
                        } else {
                            layer.msg(res.msg,{icon:2,time:3000});
                        }
                    });
                });
                $('#cancelEditBtn').on('click',function(){
                    layer.closeAll();
                });
            }
        });
    }

    function getCsrfToken(){
        var cookies = document.cookie.split(';');
        for(var i=0;i<cookies.length;i++){
            var c = cookies[i].trim();
            if(c.indexOf('_xsrf=') === 0){
                return decodeURIComponent(c.substring(6));
            }
        }
        return '';
    }
});
</script>
{% end %}
